      cashDistributions: "Distributions en espèces depuis l'origine"
      sessionChange: "+{percent} % sur la séance"
      noEquities: "Aucune action active"
    defs:
      totalGain:
        title: "Gain total depuis l'origine"
        category: "Performance"
        short: "Performance économique nette de l'ensemble du portefeuille depuis sa création."
        full: "Cet indicateur mesure la performance nette globale de votre capital. Il ne se limite pas aux plus-values latentes actuelles : il intègre toutes les variations de prix des actifs, les plus-values réalisées sur les ventes, les dividendes versés et les intérêts perçus, puis déduit les frais de transaction payés au fil du temps."
        formula: "Gain total = (Valeur investie - Prix de revient) + Plus/moins-values réalisées + Dividendes + Intérêts - Frais de courtage"
        formulaDescription: "Rendement % = (Gain total depuis l'origine ÷ Capital total investi) × 100"
        components:
          unrealized:
            label: "Plus/moins-value latente"
            description: "Gain ou perte latent sur les positions ouvertes (Valeur investie − Prix de revient)."
          realized:
            label: "Plus/moins-values réalisées"
            description: "Gain ou perte net acquis lors des ventes d'actifs au fil du temps."
          income:
            label: "Dividendes et intérêts"
            description: "Distributions en espèces et rendements fixes cumulés crédités sur le portefeuille."
          fees:
            label: "Frais de transaction"
            description: "Total des commissions de courtage et frais d'ordre déduits au fil du temps."
        takeaways:
          alpha: "Véritable alpha économique : mesure la richesse totale créée plutôt que les seules variations de prix des titres."
          cashFlow: "Flux de trésorerie inclus : les dividendes et intérêts réinvestis ou encaissés sont entièrement pris en compte dans le pourcentage de rendement."
          netOfFees: "Net de frais : les commissions du courtier et coûts de transaction sont déduits pour montrer un rendement net réaliste."
      valuation:
        title: "Valorisation du portefeuille"
        category: "Valorisation"
        short: "Valeur nette totale de liquidation de votre portefeuille aux cours de marché en direct."
        full: "La valorisation du portefeuille reflète la valeur liquide totale exacte de l'ensemble de votre portefeuille à cet instant. Elle combine la valeur de marché en temps réel de tous les titres actifs (actions, ETF, cryptomonnaies, fonds communs) avec vos réserves de liquidités non investies."
        formula: "Valorisation du portefeuille = Valeur de marché totale des positions + Réserves de liquidités"
        formulaDescription: "La valeur des positions se calcule en multipliant la quantité de chaque position active par son dernier cours de marché."
        components:
          holdings:
            label: "Valeur des positions investies"
            description: "Valeur totale en direct de l'ensemble des actions, ETF, cryptos et autres actifs détenus."
          cash:
            label: "Réserves de liquidités non investies"
            description: "Coussin de liquidités disponible pour de nouveaux achats ou comme valeur refuge."
          costBasis:
            label: "Prix de revient des positions"
            description: "Capital total dépensé pour acquérir les positions actuellement ouvertes."
        takeaways:
          liquidWorth: "Valeur liquide : ce que rapporterait votre portefeuille avant impôts si toutes les positions étaient liquidées immédiatement aux cours acheteurs actuels."
          multiAsset: "Intégration multi-actifs : regroupe les positions en plusieurs devises, les soldes de liquidités et les fractions de titres."
          cashDrag: "Inclut le poids des liquidités : pondère précisément les réserves liquides à côté des actifs investis."
      todayReturn:
        title: "Rendement du jour"
        category: "Rendement quotidien"
        short: "Variation de valorisation sur la séance par rapport à la clôture précédente."
        full: "Le rendement du jour mesure la variation en montant et en pourcentage de vos positions actives pendant la séance en cours. Il compare les cours en direct aux cours de clôture officiels de la veille pour chaque position."
        formula: "Rendement du jour ($) = Somme de [ (Prix actuel - Clôture précédente) × Quantité ]"
        formulaDescription: "Rendement du jour (%) = (Rendement du jour $ ÷ Valeur totale à la clôture précédente) × 100"
        components:
          currencyDelta:
            label: "Variation 24 h en devise"
            description: "Gain ou perte absolu sur la séance en cours."
          percentChange:
            label: "Variation 24 h en %"
            description: "Rendement en pourcentage par rapport à la valorisation à la clôture d'hier."
          topWinner:
            label: "Meilleure hausse de la séance"
            description: "L'actif le plus performant de votre portefeuille pendant cette séance."
        takeaways:
          volatility: "Volatilité de la séance : montre l'effet des événements macro, des publications de résultats ou des mouvements de marché du jour sur vos positions."
          excludesCash: "Hors liquidités : seuls les titres sensibles aux prix déterminent le rendement quotidien ; les réserves de liquidités ont une volatilité quotidienne nulle."
          realTime: "Mise à jour en temps réel : recalculé à chaque nouveau cours pendant les heures de marché."
      realizedIncome:
        title: "Réalisé et revenus"
        category: "Revenus et rendement"
        short: "Gains en espèces acquis et cumulés grâce aux ventes, dividendes et rendements."
        full: "Alors que les plus-values latentes montent et descendent avec le sentiment du marché, Réalisé et revenus suit la richesse définitivement acquise et encaissée. Il additionne tous les gains réalisés sur les titres vendus et les revenus réguliers issus des dividendes et des intérêts."
        formula: "Réalisé et revenus = Plus/moins-values de cession + Total des dividendes reçus + Intérêts fixes perçus"
        formulaDescription: "Les plus/moins-values de cession sont calculées à chaque SELL selon la méthode FIFO / du coût moyen."
        components:
          sells:
            label: "Plus-values nettes réalisées"
            description: "Plus-values en capital acquises grâce aux ventes exécutées."
          dividends:
            label: "Dividendes reçus"
            description: "Paiements en espèces versés directement par les positions du portefeuille."
          interest:
            label: "Intérêts / Rendements fixes"
            description: "Revenus issus de la rémunération des liquidités, des coupons obligataires ou des prêts."
        takeaways:
          permanent: "Richesse acquise : les gains réalisés ne peuvent pas être effacés par de futures baisses de marché."
          income: "Génération de revenus : visibilité claire sur le rendement passif des actifs à dividendes."
          tax: "Fiscalité et comptabilité : utile pour suivre les événements imposables de l'année et les distributions de dividendes."
      cashReserves:
        title: "Réserves de liquidités"
        category: "Liquidité"
        short: "Liquidités non investies disponibles pour un rééquilibrage stratégique ou par sécurité."
        full: "Les réserves de liquidités représentent la monnaie non investie de votre portefeuille. Ces liquidités servent de « munitions » pour profiter des baisses de marché, de coussin de sécurité ou attendent le réinvestissement des dividendes."
        formula: "Réserves de liquidités = Total des dépôts - Total des achats + Total des ventes + Dividendes - Retraits - Frais"
        formulaDescription: "Poids des liquidités (%) = (Réserves de liquidités ÷ Valorisation totale du portefeuille) × 100"
        components:
          balance:
            label: "Solde actuel"
            description: "Liquidités immédiatement disponibles dans la devise de base du portefeuille."
          share:
            label: "Part de l'allocation"
            description: "Part en pourcentage de la valeur totale du portefeuille détenue en liquidités."
            value: "{percent} % du portefeuille"
        takeaways:
          liquidity: "Liquidité opportuniste : permet d'agir immédiatement lors des replis de marché sans vendre d'actifs existants."
          risk: "Réduction du risque : atténue la volatilité globale du portefeuille en marché baissier."
      capitalInjected:
        title: "Capital apporté"
        category: "Capital"
        short: "Total cumulé du capital déposé dans le portefeuille."
        full: "Le capital apporté suit le total de vos apports (dépôts) dans le journal du portefeuille. Il sert de dénominateur de référence pour calculer le véritable rendement du capital investi (ROIC)."
        formula: "Capital apporté = Dépôts cumulés - Retraits de capital cumulés"
        formulaDescription: "Calculé à partir de toutes les transactions DEPOSIT et WITHDRAWAL de votre portefeuille."
        components:
          deposited:
            label: "Capital total déposé"
            description: "Somme de tous les dépôts externes effectués dans le portefeuille."
        takeaways:
          benchmark: "Référence du capital : distingue l'épargne apportée de la croissance propre du marché."
          returnBase: "Base de rendement : sert de dénominateur pour des calculs précis du rendement pondéré par les capitaux et du rendement pondéré dans le temps."
      dividends:
        title: "Total des dividendes"
        category: "Distributions"
        short: "Total des dividendes en espèces reçus des actions et des fonds depuis l'origine."
        full: "Le total des dividendes représente l'ensemble des distributions en espèces versées directement à votre portefeuille par les actions, ETF et foncières cotées (REIT) à dividendes. Ils peuvent rester en liquidités ou être réinvestis dans de nouvelles positions."
        formula: "Total des dividendes = Somme de toutes les transactions DIVIDEND créditées sur le compte"
        formulaDescription: "Exclut la plus-value de prix et se concentre uniquement sur les bénéfices distribués par les sociétés."
        components:
          cumulative:
            label: "Dividendes cumulés"
            description: "Total des dividendes crédités sur l'ensemble des actifs du portefeuille."
        takeaways:
          cashFlow: "Flux de trésorerie passif : mesure la capacité réelle de distribution de vos investissements orientés revenus."
          compounding: "Moteur des intérêts composés : les dividendes peuvent être réinvestis systématiquement pour accélérer la croissance composée."
      topPerformer:
        title: "Meilleure performance de la séance"
        category: "Leader de la séance"
        short: "L'actif détenu ayant la plus forte hausse en pourcentage sur la séance en cours."
        full: "Identifie l'actif qui se distingue dans votre portefeuille d'après sa hausse en pourcentage depuis la dernière clôture officielle. Aide à repérer les moteurs de momentum et les meneurs parmi vos positions."
        formula: "Meilleure performance = max( (Cours actuel - Clôture précédente) ÷ Clôture précédente ) sur toutes les positions actives"
        formulaDescription: "Évalué sur toutes les positions actives du portefeuille, hors liquidités."
        components:
          topAsset:
            label: "Meilleur actif"
            description: "Ticker de l'actif et rendement en pourcentage sur la séance."
            none: "Aucune position en actions active"
        takeaways:
          momentum: "Suivi du momentum : visibilité immédiate sur la plus forte hausse du jour."
          attribution: "Attribution : comprenez quelle position porte la performance du portefeuille aujourd'hui."

