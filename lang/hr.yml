            description: "Najuspješniji instrument u vašem aktivnom portfelju tijekom ove sesije."
        takeaways:
          volatility: "Volatilnost sesije: pokazuje kako su dnevni makro događaji, izvješća o rezultatima ili tržišni pomaci danas utjecali na vaša ulaganja."
          excludesCash: "Isključuje gotovinu: dnevne prinose pokreću samo vrijednosnice osjetljive na cijenu; gotovinske rezerve imaju nultu dnevnu volatilnost."
          realTime: "Ažuriranje u stvarnom vremenu: dinamički se ponovno izračunava kako tijekom trgovanja stižu nove cijene."
      realizedIncome:
        title: "Ostvareno i prihodi"
        category: "Prihodi i prinos"
        short: "Kumulativna ostvarena gotovinska dobit od izvršenih prodaja, dividendi i prinosa."
        full: "Dok nerealizirana dobit na papiru raste i pada s raspoloženjem tržišta, metrika Ostvareno i prihodi prati trajno, ostvareno bogatstvo koje ste već naplatili. Zbraja svu dobit ostvarenu prodajom vrijednosnica i redovite prihode od dividendi i kamata."
        formula: "Ostvareno i prihodi = Dobit/gubitak zatvorenih prodaja + Ukupno primljene dividende + Zarađene fiksne kamate"
        formulaDescription: "Dobit/gubitak zatvorenih prodaja izračunava se pri svakom izvršenju SELL metodom FIFO / prosječne nabavne vrijednosti."
        components:
          sells:
            label: "Neto ostvarene prodaje"
            description: "Ostvareni kapitalni dobici iz izvršenih prodajnih transakcija."
          dividends:
            label: "Primljene dividende"
            description: "Gotovinske isplate koje ulaganja iz portfelja isplaćuju izravno vama."
          interest:
            label: "Fiksne kamate / prinosi"
            description: "Prihod od prinosa na gotovinu, kupona obveznica ili posuđivanja."
        takeaways:
          permanent: "Trajno bogatstvo: ostvareni dobici ne mogu se poništiti budućim padovima tržišta."
          income: "Stvaranje prihoda: jasan uvid u pasivni prinos od imovine koja isplaćuje dividende."
          tax: "Porezi i računovodstvo: korisno za praćenje godišnjih oporezivih kapitalnih događaja i isplata dividendi."
      cashReserves:
        title: "Gotovinske rezerve"
        category: "Likvidnost"
        short: "Neraspoređena likvidna gotovina dostupna za strateško uravnoteženje ili sigurnost."
        full: "Gotovinske rezerve predstavljaju neuloženu fiat valutu u vašem portfelju. Ta likvidnost služi kao 'suhi barut' za oportunističke padove tržišta, kao rezerva za hitne slučajeve ili čeka reinvestiranje dividendi."
        formula: "Gotovinske rezerve = Ukupne uplate - Ukupne kupnje + Ukupne prodaje + Dividende - Isplate - Naknade"
        formulaDescription: "Udio gotovine (%) = (Gotovinske rezerve ÷ Ukupna vrijednost portfelja) × 100"
        components:
          balance:
            label: "Trenutačno stanje"
            description: "Odmah dostupna likvidna gotovina u osnovnoj valuti portfelja."
          share:
            label: "Udio u alokaciji"
            description: "Postotni udio ukupne vrijednosti portfelja koji se drži u gotovini."
            value: "{percent}% portfelja"
        takeaways:
          liquidity: "Oportunistička likvidnost: omogućuje trenutačno djelovanje pri padovima tržišta bez prodaje postojeće imovine."
          risk: "Smanjenje rizika: ublažava ukupnu volatilnost portfelja tijekom medvjeđih ciklusa."
      capitalInjected:
        title: "Uloženi kapital"
        category: "Glavnica"
        short: "Ukupna kumulativna glavnica uplaćena u portfelj."
        full: "Uloženi kapital prati vaše ukupne uplate glavnice (depozite) u dnevnik portfelja. Služi kao financijska osnova (nazivnik) za izračun stvarnog povrata na uloženi kapital (ROIC)."
        formula: "Uloženi kapital = Kumulativne uplate - Kumulativna povlačenja kapitala"
        formulaDescription: "Izračunava se iz svih DEPOSIT i WITHDRAWAL transakcija u vašem portfelju."
        components:
          deposited:
            label: "Ukupno uplaćeni kapital"
            description: "Zbroj svih povijesnih vanjskih uplata prenesenih u portfelj."
        takeaways:
          benchmark: "Referentna glavnica: razlikuje vanjske uplate ušteđevine od organskog tržišnog rasta."
          returnBase: "Osnova prinosa: čini nazivnik za točne modele novčano ponderiranog i vremenski ponderiranog prinosa."
      dividends:
        title: "Ukupne dividende"
        category: "Isplate"
        short: "Sve gotovinske isplate dividendi primljene od dionica i fondova."
        full: "Ukupne dividende predstavljaju zbroj svih gotovinskih isplata koje su dionice, ETF-ovi i REIT-ovi s dividendom isplatili izravno u vaš portfelj. Mogu se držati kao gotovinska likvidnost ili ponovno uložiti u nova ulaganja."
        formula: "Ukupne dividende = Zbroj svih DIVIDEND transakcija pripisanih računu"
        formulaDescription: "Isključuje rast cijene i usredotočuje se isključivo na raspodjelu dobiti društava."
        components:
          cumulative:
            label: "Kumulativne dividende"
            description: "Ukupne novčane dividende pripisane za svu imovinu portfelja."
        takeaways:
          cashFlow: "Pasivni novčani tok: mjeri stvarnu sposobnost vaših ulaganja usmjerenih na prihod da isplaćuju gotovinu."
          compounding: "Pokretač složenog rasta: dividende se mogu sustavno reinvestirati kako bi se ubrzao složeni rast."
      topPerformer:
        title: "Najuspješniji u sesiji"
        category: "Predvodnik sesije"
        short: "Pojedinačni aktivni instrument s najvećim postotnim rastom u trenutačnoj sesiji."
        full: "Prepoznaje instrument koji se ističe u vašem portfelju prema unutardnevnom postotnom rastu u odnosu na prethodno službeno zatvaranje. Pomaže uočiti pokretače zamaha i predvodnike tržišta među vašim ulaganjima."
        formula: "Najuspješniji = max( (Trenutačna cijena - Prethodno zatvaranje) ÷ Prethodno zatvaranje ) za sva aktivna ulaganja"
        formulaDescription: "Procjenjuje se za svu aktivnu negotovinsku imovinu u portfelju."
        components:
          topAsset:
            label: "Najbolji instrument"
            description: "Oznaka instrumenta i unutardnevni postotni prinos."
            none: "Nema aktivnih pozicija u dionicama"
        takeaways:
          momentum: "Praćenje zamaha: trenutačan uvid u današnji najjači rast."
          attribution: "Atribucija: razumijte koja pozicija nosi današnju uspješnost portfelja."

