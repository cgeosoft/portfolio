        full: "अप्राप्त कागज़ी लाभ बाज़ार की धारणा के साथ घटते-बढ़ते हैं, जबकि प्राप्त लाभ और आय वह स्थायी, पक्की संपत्ति ट्रैक करता है जो आपने हासिल कर ली है। यह बेची गई प्रतिभूतियों से प्राप्त सभी लाभ और डिविडेंड व ब्याज से नियमित आय को जोड़ता है।"
        formula: "प्राप्त लाभ और आय = बंद बिक्री PnL + प्राप्त कुल डिविडेंड + अर्जित निश्चित ब्याज"
        formulaDescription: "बंद बिक्री PnL की गणना हर SELL निष्पादन पर FIFO / औसत लागत आधार विधि से होती है।"
        components:
          sells:
            label: "शुद्ध प्राप्त बिक्री"
            description: "निष्पादित बिक्री लेन-देन से पक्का हुआ पूंजीगत लाभ।"
          dividends:
            label: "प्राप्त डिविडेंड"
            description: "पोर्टफोलियो होल्डिंग्स द्वारा सीधे आपको दिए गए नकद भुगतान।"
          interest:
            label: "निश्चित ब्याज / यील्ड"
            description: "नकद यील्ड, बॉन्ड कूपन या उधार देने से अर्जित आय।"
        takeaways:
          permanent: "स्थायी संपत्ति: पक्के हुए लाभ भविष्य की बाज़ार गिरावट से उलटे नहीं हो सकते।"
          income: "आय सृजन: डिविडेंड देने वाले एसेट से निष्क्रिय यील्ड का स्पष्ट चित्र।"
          tax: "टैक्स और लेखा: सालाना कर योग्य पूंजीगत इवेंट और डिविडेंड वितरण ट्रैक करने में उपयोगी।"
      cashReserves:
        title: "नकद रिज़र्व"
        category: "लिक्विडिटी"
        short: "रणनीतिक रीबैलेंसिंग या सुरक्षा के लिए उपलब्ध अनावंटित नकद।"
        full: "नकद रिज़र्व आपके पोर्टफोलियो में बिना निवेश की गई मुद्रा है। यह लिक्विडिटी बाज़ार में गिरावट के मौकों के लिए 'ड्राई पाउडर', आपातकालीन बफ़र या डिविडेंड पुनर्निवेश की प्रतीक्षा का काम करती है।"
        formula: "नकद रिज़र्व = कुल जमा - कुल खरीद + कुल बिक्री + डिविडेंड - निकासी - शुल्क"
        formulaDescription: "नकद भार (%) = (नकद रिज़र्व ÷ कुल पोर्टफोलियो मूल्यांकन) × 100"
        components:
          balance:
            label: "मौजूदा बैलेंस"
            description: "पोर्टफोलियो की बेस करेंसी में तुरंत उपलब्ध नकद।"
          share:
            label: "आवंटन हिस्सा"
            description: "कुल पोर्टफोलियो मूल्य का नकद में रखा प्रतिशत हिस्सा।"
            value: "पोर्टफोलियो का {percent}%"
        takeaways:
          liquidity: "अवसर के लिए लिक्विडिटी: मौजूदा एसेट बेचे बिना बाज़ार गिरावट पर तुरंत खरीद संभव बनाती है।"
          risk: "जोखिम में कमी: मंदी के दौर में पोर्टफोलियो की कुल अस्थिरता घटाती है।"
      capitalInjected:
        title: "लगाई गई पूंजी"
        category: "मूलधन"
        short: "पोर्टफोलियो में जमा किया गया कुल संचित मूलधन।"
        full: "लगाई गई पूंजी पोर्टफोलियो लेजर में आपके कुल मूलधन योगदान (जमा) को ट्रैक करती है। यह वास्तविक निवेशित पूंजी पर रिटर्न (ROIC) की गणना के लिए वित्तीय आधार हर (denominator) का काम करती है।"
        formula: "लगाई गई पूंजी = संचित जमा - संचित पूंजी निकासी"
        formulaDescription: "आपके पोर्टफोलियो के सभी DEPOSIT और WITHDRAWAL लेन-देन रिकॉर्ड से गणना की जाती है।"
        components:
          deposited:
            label: "कुल जमा पूंजी"
            description: "पोर्टफोलियो में ट्रांसफ़र की गई सभी पिछली बाहरी जमाओं का योग।"
        takeaways:
          benchmark: "मूलधन का पैमाना: बाहरी बचत योगदान को बाज़ार की स्वाभाविक वृद्धि से अलग करता है।"
          returnBase: "रिटर्न आधार: सटीक मनी-वेटेड और टाइम-वेटेड रिटर्न मॉडल के लिए हर (denominator) बनाता है।"
      dividends:
        title: "कुल डिविडेंड"
        category: "वितरण"
        short: "इक्विटी और फ़ंड होल्डिंग्स से अब तक प्राप्त सभी नकद डिविडेंड।"
        full: "कुल डिविडेंड, डिविडेंड देने वाली इक्विटी, ETF और REIT द्वारा आपके पोर्टफोलियो को सीधे दिए गए जीवनभर के कुल नकद वितरण को दर्शाता है। इन्हें नकद लिक्विडिटी के रूप में रखा जा सकता है या नई होल्डिंग्स में लगाया जा सकता है।"
        formula: "कुल डिविडेंड = खाते में जमा सभी DIVIDEND लेन-देन का योग"
        formulaDescription: "कीमत में बढ़ोतरी शामिल नहीं; केवल कंपनी की कमाई के वितरण पर केंद्रित।"
        components:
          cumulative:
            label: "संचित डिविडेंड"
            description: "सभी पोर्टफोलियो एसेट से जमा हुए कुल डिविडेंड।"
        takeaways:
          cashFlow: "निष्क्रिय नकद प्रवाह: आपके आय-केंद्रित निवेशों की वास्तविक नकद भुगतान क्षमता मापता है।"
          compounding: "चक्रवृद्धि का ईंधन: चक्रवृद्धि वृद्धि तेज़ करने के लिए डिविडेंड को व्यवस्थित रूप से पुनर्निवेश किया जा सकता है।"
      topPerformer:
        title: "सत्र का शीर्ष प्रदर्शक"
        category: "सत्र अग्रणी"
        short: "मौजूदा बाज़ार सत्र में सबसे अधिक प्रतिशत लाभ वाला एकल सक्रिय एसेट।"
        full: "पिछले आधिकारिक बाज़ार बंद भाव से इंट्राडे प्रतिशत लाभ के आधार पर आपके पोर्टफोलियो का सबसे अलग दिखने वाला एसेट पहचानता है। आपकी होल्डिंग्स में मोमेंटम चालकों और बाज़ार नेतृत्व को पहचानने में मदद करता है।"
        formula: "शीर्ष प्रदर्शक = सभी सक्रिय होल्डिंग्स में max( (मौजूदा भाव - पिछला बंद भाव) ÷ पिछला बंद भाव )"
        formulaDescription: "पोर्टफोलियो के सभी सक्रिय गैर-नकद एसेट पर आकलन किया जाता है।"
        components:
          topAsset:
            label: "शीर्ष एसेट"
            description: "एसेट टिकर और इंट्राडे प्रतिशत रिटर्न।"
            none: "कोई सक्रिय इक्विटी पोज़िशन नहीं"
        takeaways:
          momentum: "मोमेंटम ट्रैकिंग: आज की सबसे मज़बूत एसेट तेज़ी तुरंत दिखती है।"
          attribution: "एट्रिब्यूशन: समझें कि आज पोर्टफोलियो के प्रदर्शन को कौन-सी पोज़िशन आगे बढ़ा रही है।"

