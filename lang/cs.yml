          volatility: "Volatilita seance: ukazuje, jak dnešní makro události, výsledky firem nebo pohyby trhu ovlivnily vaše pozice."
          excludesCash: "Bez hotovosti: denní výnos tvoří jen cenově citlivé cenné papíry; hotovostní rezervy mají nulovou denní volatilitu."
          realTime: "Aktualizace v reálném čase: přepočítává se, jakmile během obchodních hodin přicházejí nové ceny."
      realizedIncome:
        title: "Realizované a příjmy"
        category: "Příjmy a výnos"
        short: "Souhrnné zafixované hotovostní zisky z prodejů, dividend a úroků."
        full: "Nerealizované papírové zisky rostou a klesají s náladou trhu, kdežto ukazatel Realizované a příjmy sleduje trvale zajištěné bohatství. Sčítá zisky realizované z prodaných cenných papírů a pravidelné příjmy z dividend a úroků."
        formula: "Realizované a příjmy = Zisk/ztráta z uzavřených prodejů + Celkové přijaté dividendy + Přijaté pevné úroky"
        formulaDescription: "Zisk/ztráta z uzavřeného prodeje se počítá u každé transakce SELL metodou FIFO / průměrné pořizovací ceny."
        components:
          sells:
            label: "Čisté realizované prodeje"
            description: "Realizované kapitálové zisky z provedených prodejů."
          dividends:
            label: "Přijaté dividendy"
            description: "Hotovostní výplaty od pozic portfolia vyplacené přímo vám."
          interest:
            label: "Pevné úroky / výnosy"
            description: "Příjem z úročení hotovosti, kupónů dluhopisů nebo půjček."
        takeaways:
          permanent: "Trvalé bohatství: zafixované zisky nemohou budoucí poklesy trhu vzít zpět."
          income: "Tvorba příjmu: jasný přehled o pasivním příjmu z aktiv vyplácejících dividendy."
          tax: "Daně a účetnictví: užitečné pro sledování ročních zdanitelných událostí a výplat dividend."
      cashReserves:
        title: "Hotovostní rezervy"
        category: "Likvidita"
        short: "Nealokovaná likvidní hotovost pro strategické rebalancování nebo jako rezerva."
        full: "Hotovostní rezervy představují neinvestované peníze ve vašem portfoliu. Tato likvidita slouží jako „suchý prach“ pro příležitosti při propadech trhu, jako nouzová rezerva nebo čeká na reinvestici dividend."
        formula: "Hotovostní rezervy = Celkové vklady - Celkové nákupy + Celkové prodeje + Dividendy - Výběry - Poplatky"
        formulaDescription: "Váha hotovosti (%) = (Hotovostní rezervy ÷ Celkové ocenění portfolia) × 100"
        components:
          balance:
            label: "Aktuální zůstatek"
            description: "Okamžitě dostupná hotovost v základní měně portfolia."
          share:
            label: "Podíl na alokaci"
            description: "Procentní podíl celkové hodnoty portfolia drženého v hotovosti."
            value: "{percent} % portfolia"
        takeaways:
          liquidity: "Likvidita pro příležitosti: umožňuje okamžitě jednat při propadech trhu bez prodeje stávajících aktiv."
          risk: "Snížení rizika: tlumí celkovou volatilitu portfolia v medvědích fázích."
      capitalInjected:
        title: "Vložený kapitál"
        category: "Jistina"
        short: "Celkový kapitál vložený do portfolia."
        full: "Vložený kapitál sleduje vaše celkové vklady jistiny do deníku portfolia. Slouží jako základní jmenovatel pro výpočet skutečné návratnosti investovaného kapitálu (ROIC)."
        formula: "Vložený kapitál = Souhrnné vklady - Souhrnné výběry kapitálu"
        formulaDescription: "Počítá se ze všech transakcí DEPOSIT a WITHDRAWAL ve vašem portfoliu."
        components:
          deposited:
            label: "Celkem vložený kapitál"
            description: "Součet všech historických externích vkladů do portfolia."
        takeaways:
          benchmark: "Měřítko jistiny: odlišuje externí vklady úspor od přirozeného růstu trhu."
          returnBase: "Základ výnosu: tvoří jmenovatel pro přesné modely výnosu váženého penězi a časem."
      dividends:
        title: "Celkové dividendy"
        category: "Výplaty"
        short: "Všechny hotovostní dividendy přijaté z akcií a fondů."
        full: "Celkové dividendy představují souhrn všech hotovostních výplat, které do portfolia přímo vyplatily dividendové akcie, ETF a REIT. Mohou zůstat jako hotovostní likvidita nebo být investovány do nových pozic."
        formula: "Celkové dividendy = Součet všech transakcí DIVIDEND připsaných na účet"
        formulaDescription: "Nezahrnuje růst cen; zaměřuje se pouze na výplaty ze zisků společností."
        components:
          cumulative:
            label: "Souhrnné dividendy"
            description: "Celková částka dividend připsaných za všechna aktiva portfolia."
        takeaways:
          cashFlow: "Pasivní peněžní tok: měří skutečnou schopnost vašich příjmových investic vyplácet hotovost."
          compounding: "Palivo pro složené úročení: dividendy lze systematicky reinvestovat a urychlit tak růst."
      topPerformer:
        title: "Lídr seance"
        category: "Lídr seance"
        short: "Aktivní pozice s nejvyšším procentním růstem v aktuální seanci."
        full: "Určuje nejvýraznější aktivum ve vašem portfoliu podle vnitrodenního procentního růstu od předchozího oficiálního uzavření. Pomáhá odhalit zdroje momenta a lídry mezi vašimi pozicemi."
        formula: "Lídr = max( (Aktuální cena - Předchozí uzavření) ÷ Předchozí uzavření ) ze všech aktivních pozic"
        formulaDescription: "Vyhodnocuje se ze všech aktivních aktiv portfolia kromě hotovosti."
        components:
          topAsset:
            label: "Nejlepší aktivum"
            description: "Ticker aktiva a jeho vnitrodenní procentní výnos."
            none: "Žádné aktivní akciové pozice"
        takeaways:
          momentum: "Sledování momenta: okamžitý přehled o dnešním nejsilnějším růstu."
          attribution: "Atribuce: ukazuje, která pozice nese dnešní výkonnost portfolia."

