        category: "Ìdíyelé"
        short: "Àpapọ̀ iye àṣẹ́kù àkójọ ìdókòwò rẹ tí a bá tà á ní iye owó ọjà lọ́wọ́lọ́wọ́."
        full: "Ìdíyelé àkójọ ìdókòwò ń fi gbogbo iye tó ṣeé yí sí owó nínú àkójọ ìdókòwò rẹ hàn ní báyìí gan-an. Ó ń da iye ọjà lójú-ẹsẹ̀ gbogbo ohun-ìní tó ń ṣiṣẹ́ (ìpín, ETF, owó crypto, mutual fund) pọ̀ mọ́ owó lọ́wọ́ rẹ tí o kò tíì dókòwò."
        formula: "Ìdíyelé àkójọ ìdókòwò = Àpapọ̀ iye ọjà ohun-ìní + Owó lọ́wọ́ tí a fi pamọ́"
        formulaDescription: "A ń ṣírò iye ohun-ìní nípa fífi iye ìpín ipò kọ̀ọ̀kan tó ń ṣiṣẹ́ sọ iye owó ọjà rẹ̀ tuntun jùlọ di púpọ̀."
        components:
          holdings:
            label: "Iye ohun-ìní tí a dókòwò"
            description: "Àpapọ̀ iye lójú-ẹsẹ̀ gbogbo ìpín, ETF, crypto àti àwọn dúkìá mìíràn tó ń ṣiṣẹ́."
          cash:
            label: "Owó lọ́wọ́ tí a kò dókòwò"
            description: "Owó lọ́wọ́ tí a fi pamọ́ fún ìrà tuntun tàbí fún ààbò."
          costBasis:
            label: "Iye owó ìpìlẹ̀ ohun-ìní"
            description: "Àpapọ̀ owó tí a ná láti ra àwọn ipò tó ṣí sílẹ̀ lọ́wọ́lọ́wọ́."
        takeaways:
          liquidWorth: "Iye tó ṣeé yí sí owó: Ohun tí àkójọ ìdókòwò rẹ yóò mú wá ṣáájú owó orí tí a bá ta gbogbo ohun-ìní lẹ́sẹ̀kẹsẹ̀ ní iye owó ọjà lọ́wọ́lọ́wọ́."
          multiAsset: "Ìṣọ̀kan oní-dúkìá-púpọ̀: Ó ń kó àwọn ipò oní-owó-púpọ̀, ìyókù owó lọ́wọ́ àti apá dúkìá jọ."
          cashDrag: "Ẹrù owó lọ́wọ́ wà nínú rẹ̀: Ó ń wọn owó lọ́wọ́ tí a fi pamọ́ pẹ̀lú dúkìá tí a dókòwò."
      todayReturn:
        title: "Èrè òní"
        category: "Èrè ojoojúmọ́"
        short: "Àyípadà ìdíyelé àkókò ọjà kan ní ìfiwéra pẹ̀lú iye owó ìtìpa tó kọjá."
        full: "Èrè òní ń wọn àyípadà owó àti ìdá-ọgọ́rùn-ún àwọn ipò rẹ tó ń ṣiṣẹ́ nínú àkókò ọjà lọ́wọ́lọ́wọ́. Ó ń fi iye owó lójú-ẹsẹ̀ wé iye owó ìtìpa ọjà ti àná fún ohun-ìní kọ̀ọ̀kan."
        formula: "Èrè òní ($) = Àpapọ̀ [ (Iye owó lọ́wọ́lọ́wọ́ - Iye owó ìtìpa tó kọjá) × Ìpín ]"
        formulaDescription: "Èrè òní (%) = (Èrè òní $ ÷ Àpapọ̀ iye ìtìpa àkókò ọjà tó kọjá) × 100"
        components:
          currencyDelta:
            label: "Àyípadà owó wákàtí 24"
            description: "Èrè tàbí àdánù owó pátápátá nínú àkókò ọjà lọ́wọ́lọ́wọ́."
          percentChange:
            label: "Àyípadà ìdá-ọgọ́rùn-ún wákàtí 24"
            description: "Ìdá-ọgọ́rùn-ún èrè ní ìfiwéra pẹ̀lú ìdíyelé ìtìpa àná."
          topWinner:
            label: "Èyí tó gòkè jùlọ ní àkókò yìí"
            description: "Dúkìá tó ṣe dáadáa jùlọ nínú àkójọ ìdókòwò rẹ ní àkókò ọjà yìí."
        takeaways:
          volatility: "Ìyípadà àkókò ọjà: Ó ń fi hàn bí ìṣẹ̀lẹ̀ ọrọ̀ ajé ojoojúmọ́, ìjábọ̀ èrè ilé-iṣẹ́ tàbí ìyípadà ọjà ṣe kan àwọn ohun-ìní rẹ lónìí."
          excludesCash: "Kò ní owó lọ́wọ́ nínú: Àwọn ohun-ìní tí iye owó wọn ń yí padà nìkan ló ń mú èrè ojoojúmọ́ wá; owó lọ́wọ́ kì í yí padà lójoojúmọ́."
          realTime: "Ìmúdójúìwọ̀n lójú-ẹsẹ̀: Ó ń tún ṣírò bí iye owó tuntun ṣe ń dé ní àsìkò ọjà."
      realizedIncome:
        title: "Èrè tí a ti rí gbà àti owó tó ń wọlé"
        category: "Owó tó ń wọlé àti èso"
        short: "Àpapọ̀ èrè owó tí ó ti di ìdánilójú láti inú ìtà, èrè ìpín àti èso."
        full: "Bí èrè orí ìwé tí kò tíì di owó ṣe ń gòkè tí ó sì ń sọ̀kalẹ̀ pẹ̀lú èrò ọjà, Èrè tí a ti rí gbà àti owó tó ń wọlé ń tọpinpin ọrọ̀ tí ó ti di tìrẹ pátápátá. Ó ń kó gbogbo èrè láti inú ohun-ìní tí a tà pọ̀ mọ́ owó tó ń wọlé déédéé láti inú èrè ìpín àti èlé."
        formula: "Èrè tí a ti rí gbà àti owó tó ń wọlé = Èrè/Àdánù ìtà tí a ti parí + Àpapọ̀ èrè ìpín tí a gbà + Èlé tó dúró tí a rí"
        formulaDescription: "A ń ṣírò Èrè/Àdánù ìtà tí a ti parí lórí SELL kọ̀ọ̀kan pẹ̀lú ìlànà FIFO / àròpín iye owó ìpìlẹ̀."
        components:
          sells:
            label: "Ìtà àṣẹ́kù tí a ti rí gbà"
            description: "Èrè owó-ìdókòwò tí ó ti di ìdánilójú láti inú ìdúnàádúrà ìtà."
          dividends:
            label: "Èrè ìpín tí a gbà"
            description: "Owó tí àwọn ohun-ìní àkójọ ìdókòwò san fún ọ tààrà."
          interest:
            label: "Èlé tó dúró / èso"
            description: "Owó tó wọlé láti inú èso owó lọ́wọ́, kúpọ́ọ̀nù bond tàbí yíyáni lówó."
        takeaways:
          permanent: "Ọrọ̀ tó dúró: Ìṣubú ọjà lọ́jọ́ iwájú kò lè yí èrè tí ó ti di ìdánilójú padà."
          income: "Ìpèsè owó tó ń wọlé: Ó ń jẹ́ kí o rí èso tí dúkìá tó ń san èrè ìpín ń mú wá kedere."
          tax: "Owó orí àti ìṣirò owó: Ó wúlò fún títọpinpin àwọn ìṣẹ̀lẹ̀ owó-ìdókòwò tí a ń san owó orí lé lórí lọ́dọọdún àti ìpínfúnni èrè ìpín."
      cashReserves:
        title: "Owó lọ́wọ́ tí a fi pamọ́"
        category: "Owó lárọ̀ọ́wọ́tó"
        short: "Owó lọ́wọ́ tí a kò pín, tó wà fún àtúntò ọgbọ́n tàbí fún ààbò."
        full: "Owó lọ́wọ́ tí a fi pamọ́ ni owó tí o kò tíì dókòwò nínú àkójọ ìdókòwò rẹ. Owó yìí wà ní ìmúrasílẹ̀ fún àǹfààní nígbà tí ọjà bá jábọ́, fún pàjáwìrì, tàbí láti dúró de àtúndókòwò èrè ìpín."
        formula: "Owó lọ́wọ́ tí a fi pamọ́ = Àpapọ̀ ìfowópamọ́ - Àpapọ̀ ìrà + Àpapọ̀ ìtà + Èrè ìpín - Ìgbowó jáde - Owó iṣẹ́"
        formulaDescription: "Ìwúwo owó lọ́wọ́ (%) = (Owó lọ́wọ́ tí a fi pamọ́ ÷ Àpapọ̀ ìdíyelé àkójọ ìdókòwò) × 100"
        components:
          balance:
            label: "Ìyókù owó lọ́wọ́lọ́wọ́"
            description: "Owó lọ́wọ́ tó wà lẹ́sẹ̀kẹsẹ̀ ní owó ìpìlẹ̀ àkójọ ìdókòwò."
          share:
            label: "Ìpín nínú ìpínkiri"
            description: "Ìdá-ọgọ́rùn-ún àpapọ̀ iye àkójọ ìdókòwò tí ó wà gẹ́gẹ́ bí owó lọ́wọ́."
            value: "{percent}% nínú àkójọ ìdókòwò"
        takeaways:
          liquidity: "Owó fún àǹfààní: Ó ń jẹ́ kí o lè rà lẹ́sẹ̀kẹsẹ̀ nígbà tí ọjà bá jábọ́ láìta dúkìá tí o ní."
          risk: "Ìdínkù ewu: Ó ń dín ìyípadà àkójọ ìdókòwò kù nígbà tí ọjà bá ń jábọ́."
      capitalInjected:
        title: "Owó-ìdókòwò tí a fi sí i"
        category: "Owó ìpìlẹ̀"
        short: "Àpapọ̀ owó ìpìlẹ̀ tí a fi sínú àkójọ ìdókòwò láti ìbẹ̀rẹ̀."
        full: "Owó-ìdókòwò tí a fi sí i ń tọpinpin àpapọ̀ owó ìpìlẹ̀ tí o fi sílẹ̀ (ìfowópamọ́) sínú ìwé àkọsílẹ̀ àkójọ ìdókòwò. Òun ni olùpín ìpìlẹ̀ fún ṣíṣírò Èrè gidi lórí owó-ìdókòwò (ROIC)."
        formula: "Owó-ìdókòwò tí a fi sí i = Àpapọ̀ ìfowópamọ́ - Àpapọ̀ ìgbowó jáde"
        formulaDescription: "A ń ṣírò rẹ̀ láti inú gbogbo àkọsílẹ̀ ìdúnàádúrà DEPOSIT àti WITHDRAWAL nínú àkójọ ìdókòwò rẹ."
        components:
          deposited:
            label: "Àpapọ̀ owó-ìdókòwò tí a fi sí i"
            description: "Àpapọ̀ gbogbo ìfowópamọ́ láti òde tí a gbé wá sínú àkójọ ìdókòwò."
        takeaways:
          benchmark: "Òṣùwọ̀n owó ìpìlẹ̀: Ó ń ya owó tí o fi kún un láti òde sọ́tọ̀ kúrò lára ìdàgbàsókè ọjà fúnra rẹ̀."
          returnBase: "Ìpìlẹ̀ èrè: Òun ni olùpín fún àwọn àwòṣe èrè tí a wọ̀n nípa owó àti èrè tí a wọ̀n nípa àkókò."
      dividends:
        title: "Àpapọ̀ èrè ìpín"
        category: "Ìpínfúnni"
        short: "Gbogbo èrè ìpín owó tí a gbà láti inú ìpín àti fund láti ìbẹ̀rẹ̀."
        full: "Àpapọ̀ èrè ìpín ni gbogbo owó tí àwọn ìpín, ETF àti REIT tó ń san èrè ìpín ti san sínú àkójọ ìdókòwò rẹ tààrà. O lè fi wọ́n sílẹ̀ gẹ́gẹ́ bí owó lọ́wọ́ tàbí kí o tún wọn dókòwò sínú ohun-ìní tuntun."
        formula: "Àpapọ̀ èrè ìpín = Àpapọ̀ gbogbo ìdúnàádúrà DIVIDEND tí a fi sínú àkáǹtì"
        formulaDescription: "Kò ní ìgòkè iye owó nínú, ó dá lórí ìpínfúnni èrè ilé-iṣẹ́ nìkan."
        components:
          cumulative:
            label: "Àpapọ̀ èrè ìpín"
            description: "Àpapọ̀ èrè ìpín owó tí a fi sínú gbogbo dúkìá àkójọ ìdókòwò."
        takeaways:
          cashFlow: "Ìṣàn owó láìṣiṣẹ́: Ó ń wọn agbára ìsanwó owó gidi àwọn ìdókòwò rẹ tí ó dá lórí owó tó ń wọlé."
          compounding: "Epo fún èrè lórí èrè: A lè tún èrè ìpín dókòwò létòlétò láti mú ìdàgbàsókè èrè lórí èrè yára."
      topPerformer:
        title: "Èyí tó ṣe dáadáa jùlọ ní àkókò yìí"
        category: "Aṣáájú àkókò ọjà"
        short: "Dúkìá kan tó ń ṣiṣẹ́ tí ìdá-ọgọ́rùn-ún èrè rẹ̀ ga jùlọ ní àkókò ọjà lọ́wọ́lọ́wọ́."
        full: "Ó ń dá dúkìá tó tayọ nínú àkójọ ìdókòwò rẹ mọ̀ nípa ìdá-ọgọ́rùn-ún èrè rẹ̀ láàárín ọjọ́ láti iye owó ìtìpa ọjà tó kọjá. Ó ń ràn ọ́ lọ́wọ́ láti rí àwọn tó ń darí agbára àti aṣáájú ọjà nínú àwọn ohun-ìní rẹ."
        formula: "Èyí tó ṣe dáadáa jùlọ = max( (Iye owó lọ́wọ́lọ́wọ́ - Iye owó ìtìpa tó kọjá) ÷ Iye owó ìtìpa tó kọjá ) láàárín gbogbo ohun-ìní tó ń ṣiṣẹ́"
        formulaDescription: "A ń ṣàyẹ̀wò rẹ̀ láàárín gbogbo dúkìá tó ń ṣiṣẹ́ tí kì í ṣe owó lọ́wọ́ nínú àkójọ ìdókòwò."
        components:
          topAsset:
            label: "Dúkìá tó ga jùlọ"
            description: "Àmì dúkìá àti ìdá-ọgọ́rùn-ún èrè rẹ̀ láàárín ọjọ́."
            none: "Kò sí ipò ìpín tó ń ṣiṣẹ́"
        takeaways:
          momentum: "Títọpinpin agbára: Ó ń fi dúkìá tó gòkè jùlọ lónìí hàn lẹ́sẹ̀kẹsẹ̀."
          attribution: "Pípín iṣẹ́: Mọ ipò tó ń gbé iṣẹ́ àkójọ ìdókòwò lónìí."

