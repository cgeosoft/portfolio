        formula: "Portfoliowaarde = Totale marktwaarde van posities + Kasreserves"
        formulaDescription: "De waarde van de posities is het aantal stuks van elke actieve positie vermenigvuldigd met de laatste marktkoers."
        components:
          holdings:
            label: "Waarde van belegde posities"
            description: "Totale actuele waarde van alle actieve aandelen, ETF's, crypto en overige beleggingen."
          cash:
            label: "Niet-belegde kasreserves"
            description: "Liquide kasbuffer voor nieuwe aankopen of als veilige haven."
          costBasis:
            label: "Kostprijs van posities"
            description: "Totaal kapitaal besteed aan het verwerven van de openstaande posities."
        takeaways:
          liquidWorth: "Liquide waarde: wat je portfolio vóór belastingen zou opbrengen als alle posities direct tegen de huidige biedkoersen werden verkocht."
          multiAsset: "Meerdere beleggingscategorieën: voegt posities in meerdere valuta, saldi en fracties naadloos samen."
          cashDrag: "Inclusief cash drag: weegt liquide reserves correct mee naast belegde waarden."
      todayReturn:
        title: "Rendement vandaag"
        category: "Dagrendement"
        short: "Waardeverandering in de huidige handelsdag ten opzichte van het vorige slot."
        full: "Rendement vandaag meet de schommeling van je actieve posities tijdens de huidige handelsdag, als bedrag en als percentage. Het vergelijkt actuele koersen met de officiële slotkoersen van de vorige dag voor elke positie."
        formula: "Rendement vandaag ($) = Som van [ (Huidige koers - Vorige slotkoers) × Aantal ]"
        formulaDescription: "Rendement vandaag (%) = (Rendement vandaag $ ÷ Totale waarde bij vorige slot) × 100"
        components:
          currencyDelta:
            label: "24u-wijziging in valuta"
            description: "Absolute winst of verlies in de huidige handelsdag."
          percentChange:
            label: "24u-wijziging in procenten"
            description: "Procentueel rendement ten opzichte van de slotwaarde van gisteren."
          topWinner:
            label: "Grootste stijger van de dag"
            description: "De belegging met het beste resultaat in je actieve portfolio tijdens deze handelsdag."
        takeaways:
          volatility: "Dagvolatiliteit: laat zien hoe macro-gebeurtenissen, kwartaalcijfers of marktbewegingen je posities vandaag hebben beïnvloed."
          excludesCash: "Zonder contanten: alleen koersgevoelige effecten bepalen het dagrendement; kasreserves schommelen dagelijks niet."
          realTime: "Realtime updates: wordt tijdens handelsuren bij elke nieuwe koers dynamisch herberekend."
      realizedIncome:
        title: "Gerealiseerd & inkomsten"
        category: "Inkomsten & rendement"
        short: "Cumulatieve, vastgelegde contante winsten uit uitgevoerde verkopen, dividenden en rente."
        full: "Waar ongerealiseerde papieren winsten stijgen en dalen met het marktsentiment, volgt Gerealiseerd & inkomsten het blijvende, vastgelegde vermogen dat je hebt binnengehaald. Het telt alle gerealiseerde winsten uit verkochte effecten op bij de vaste inkomsten uit dividenden en rente."
        formula: "Gerealiseerd & inkomsten = W/V uit verkopen + Totaal ontvangen dividenden + Ontvangen vaste rente"
        formulaDescription: "De W/V uit verkopen wordt bij elke SELL-uitvoering berekend volgens de FIFO- of gemiddelde-kostprijsmethode."
        components:
          sells:
            label: "Gerealiseerde nettoverkopen"
            description: "Vastgelegde koerswinsten uit uitgevoerde verkooptransacties."
          dividends:
            label: "Ontvangen dividenden"
            description: "Contante betalingen die posities in de portfolio direct aan jou hebben uitgekeerd."
          interest:
            label: "Vaste rente / rendementen"
            description: "Inkomsten uit rente op tegoeden, obligatiecoupons of uitlenen."
        takeaways:
          permanent: "Blijvend vermogen: vastgelegde winsten kunnen niet worden tenietgedaan door toekomstige koersdalingen."
          income: "Inkomsten: helder zicht op de passieve inkomsten uit dividendbetalende beleggingen."
          tax: "Belasting & administratie: handig om jaarlijkse belastbare vermogenswinsten en dividenduitkeringen bij te houden."
      cashReserves:
        title: "Kasreserves"
        category: "Liquiditeit"
        short: "Niet-belegde contanten voor gerichte herbalancering of als buffer."
        full: "Kasreserves zijn niet-belegd geld in je portfolio. Deze liquiditeit dient als reserve voor kansen bij koersdalingen, als noodbuffer of wacht op herbelegging van dividenden."
        formula: "Kasreserves = Totale stortingen - Totale aankopen + Totale verkopen + Dividenden - Opnames - Kosten"
        formulaDescription: "Aandeel contanten (%) = (Kasreserves ÷ Totale portfoliowaarde) × 100"
        components:
          balance:
            label: "Huidig saldo"
            description: "Direct beschikbare contanten in de basisvaluta van de portfolio."
          share:
            label: "Aandeel in allocatie"
            description: "Percentage van de totale portfoliowaarde dat in contanten wordt aangehouden."
            value: "{percent}% van de portfolio"
        takeaways:
          liquidity: "Liquiditeit voor kansen: maakt direct handelen bij koersdalingen mogelijk zonder bestaande beleggingen te verkopen."
          risk: "Risicobeperking: dempt de volatiliteit van de hele portfolio in dalende markten."
      capitalInjected:
        title: "Ingebracht kapitaal"
        category: "Hoofdsom"
        short: "Totaal cumulatief kapitaal dat in de portfolio is gestort."
        full: "Ingebracht kapitaal volgt je totale kapitaalinbreng (stortingen) in het portfolioregister. Het dient als basis (noemer) voor de berekening van het werkelijke rendement op geïnvesteerd kapitaal (ROIC)."
        formula: "Ingebracht kapitaal = Cumulatieve stortingen - Cumulatieve kapitaalopnames"
        formulaDescription: "Berekend uit alle DEPOSIT- en WITHDRAWAL-transacties in je portfolio."
        components:
          deposited:
            label: "Totaal gestort kapitaal"
            description: "Som van alle eerdere externe stortingen in de portfolio."
        takeaways:
          benchmark: "Kapitaalbasis: onderscheidt externe spaarinleg van organische marktgroei."
          returnBase: "Rendementsbasis: vormt de noemer voor nauwkeurige geldgewogen en tijdgewogen rendementsmodellen."
      dividends:
        title: "Totaal dividenden"
        category: "Uitkeringen"
        short: "Alle contante dividenden die ooit zijn ontvangen uit aandelen en fondsen."
        full: "Totaal dividenden toont de som van alle contante uitkeringen die dividendbetalende aandelen, ETF's en REIT's direct aan je portfolio hebben betaald. Ze kunnen als contante liquiditeit worden aangehouden of in nieuwe posities worden belegd."
        formula: "Totaal dividenden = Som van alle DIVIDEND-transacties bijgeschreven op de rekening"
        formulaDescription: "Zonder koersstijgingen; telt alleen winstuitkeringen van bedrijven mee."
        components:
          cumulative:
            label: "Cumulatieve dividenden"
            description: "Totaal bijgeschreven dividenden over alle beleggingen in de portfolio."
        takeaways:
          cashFlow: "Passieve kasstroom: meet de werkelijke uitkeringskracht van je op inkomsten gerichte beleggingen."
          compounding: "Rente-op-rente: dividenden kunnen systematisch worden herbelegd om de groei te versnellen."
      topPerformer:
        title: "Beste presteerder van de dag"
        category: "Dagleider"
        short: "De afzonderlijke actieve belegging met de hoogste procentuele winst in de huidige handelsdag."
        full: "Bepaalt de uitschieter in je portfolio op basis van de procentuele winst binnen de dag ten opzichte van het laatste officiële slot. Helpt om momentumdrijvers en marktleiders onder je posities te herkennen."
        formula: "Beste presteerder = max( (Huidige koers - Vorige slotkoers) ÷ Vorige slotkoers ) over alle actieve posities"
        formulaDescription: "Beoordeeld over alle actieve beleggingen in de portfolio behalve contanten."
        components:
          topAsset:
            label: "Beste belegging"
            description: "Ticker van de belegging en procentueel rendement binnen de dag."
            none: "Geen actieve aandelenposities"
        takeaways:
          momentum: "Momentum volgen: direct zicht op de sterkste koersstijging van vandaag."
          attribution: "Attributie: zie welke positie het portfoliorendement van vandaag draagt."

