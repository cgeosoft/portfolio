            description: "Cumulatieve contante uitkeringen en vaste rente die in de portfolio zijn bijgeschreven."
          fees:
            label: "Transactiekosten"
            description: "Totale brokercommissies en orderkosten die in de loop van de tijd zijn afgetrokken."
        takeaways:
          alpha: "Echte economische alfa: beoordeelt het totale gecreëerde vermogen in plaats van alleen koerswijzigingen van tickers."
          cashFlow: "Inclusief kasstromen: herbelegde of ontvangen dividenden en rente tellen volledig mee in het rendementspercentage."
          netOfFees: "Na kosten: brokercommissies en handelskosten worden afgetrokken voor een realistisch nettorendement."
