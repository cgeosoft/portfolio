          volatility: "Volatilnost seje: prikazuje, kako so dnevni makro dogodki, poročila o rezultatih ali tržni premiki danes vplivali na vaše naložbe."
          excludesCash: "Brez gotovine: dnevne donose poganjajo samo vrednostni papirji, občutljivi na ceno; gotovinske rezerve imajo ničelno dnevno volatilnost."
          realTime: "Posodobitve v realnem času: dinamično se znova izračuna, ko med trgovanjem prihajajo nove cene."
      realizedIncome:
        title: "Realizirano in prihodki"
        category: "Prihodki in donosnost"
        short: "Kumulativni realizirani gotovinski dobiček iz izvedenih prodaj, dividend in donosov."
        full: "Medtem ko nerealizirani dobiček na papirju raste in pada s tržnim razpoloženjem, metrika Realizirano in prihodki spremlja trajno, realizirano premoženje, ki ste ga že prejeli. Sešteje ves dobiček iz prodanih vrednostnih papirjev in redne prihodke iz dividend in obresti."
        formula: "Realizirano in prihodki = Dobiček/izguba zaključenih prodaj + Skupaj prejete dividende + Prislužene fiksne obresti"
        formulaDescription: "Dobiček/izguba zaključenih prodaj se izračuna ob vsaki izvedbi SELL po metodi FIFO / povprečne nabavne vrednosti."
        components:
          sells:
            label: "Neto realizirane prodaje"
            description: "Realizirani kapitalski dobički iz izvedenih prodajnih transakcij."
          dividends:
            label: "Prejete dividende"
            description: "Gotovinska izplačila, ki jih naložbe v portfelju izplačajo neposredno vam."
          interest:
            label: "Fiksne obresti / donosi"
            description: "Prihodki od donosov na gotovino, kuponov obveznic ali posojanja."
        takeaways:
          permanent: "Trajno premoženje: realiziranih dobičkov prihodnji padci trga ne morejo izničiti."
          income: "Ustvarjanje prihodkov: jasen pregled pasivnega donosa iz sredstev, ki izplačujejo dividende."
          tax: "Davki in računovodstvo: uporabno za spremljanje letnih obdavčljivih kapitalskih dogodkov in izplačil dividend."
      cashReserves:
        title: "Gotovinske rezerve"
        category: "Likvidnost"
        short: "Nerazporejena likvidna gotovina, na voljo za strateško uravnoteženje ali varnost."
        full: "Gotovinske rezerve predstavljajo nevloženo fiat valuto v vašem portfelju. Ta likvidnost služi kot 'suhi smodnik' za priložnostne padce trga, kot rezerva za nujne primere ali čaka na ponovno vlaganje dividend."
        formula: "Gotovinske rezerve = Skupni pologi - Skupni nakupi + Skupne prodaje + Dividende - Dvigi - Provizije"
        formulaDescription: "Delež gotovine (%) = (Gotovinske rezerve ÷ Skupna vrednost portfelja) × 100"
        components:
          balance:
            label: "Trenutno stanje"
            description: "Takoj razpoložljiva likvidna gotovina v osnovni valuti portfelja."
          share:
            label: "Delež v alokaciji"
            description: "Odstotni delež skupne vrednosti portfelja v gotovini."
            value: "{percent}% portfelja"
        takeaways:
          liquidity: "Priložnostna likvidnost: omogoča takojšnje ukrepanje ob padcih trga brez prodaje obstoječih sredstev."
          risk: "Zmanjšanje tveganja: blaži skupno volatilnost portfelja v medvedjih ciklih."
      capitalInjected:
        title: "Vloženi kapital"
        category: "Glavnica"
        short: "Skupna kumulativna glavnica, vplačana v portfelj."
        full: "Vloženi kapital spremlja vaša skupna vplačila glavnice (pologe) v dnevnik portfelja. Služi kot finančna osnova (imenovalec) za izračun dejanskega donosa na vloženi kapital (ROIC)."
        formula: "Vloženi kapital = Kumulativni pologi - Kumulativni dvigi kapitala"
        formulaDescription: "Izračunano iz vseh transakcij DEPOSIT in WITHDRAWAL v vašem portfelju."
        components:
          deposited:
            label: "Skupaj vplačani kapital"
            description: "Vsota vseh preteklih zunanjih pologov, prenesenih v portfelj."
        takeaways:
          benchmark: "Primerjalna glavnica: loči zunanja vplačila prihrankov od organske tržne rasti."
          returnBase: "Osnova donosa: tvori imenovalec za natančna modela denarno tehtanega in časovno tehtanega donosa."
      dividends:
        title: "Skupne dividende"
        category: "Izplačila"
        short: "Vsa gotovinska izplačila dividend, prejeta od delnic in skladov."
        full: "Skupne dividende predstavljajo vsoto vseh gotovinskih izplačil, ki so jih delnice, ETF-ji in REIT-i z dividendo izplačali neposredno v vaš portfelj. Lahko jih obdržite kot gotovinsko likvidnost ali ponovno vložite v nove naložbe."
        formula: "Skupne dividende = Vsota vseh transakcij DIVIDEND, pripisanih računu"
        formulaDescription: "Izključuje rast cene in se osredotoča izključno na razdelitev dobička podjetij."
        components:
          cumulative:
            label: "Kumulativne dividende"
            description: "Skupne denarne dividende, pripisane za vsa sredstva portfelja."
        takeaways:
          cashFlow: "Pasivni denarni tok: meri dejansko zmožnost vaših dohodkovno usmerjenih naložb, da izplačujejo gotovino."
          compounding: "Gorivo za obrestno obrestovanje: dividende je mogoče sistematično ponovno vlagati, da se pospeši obrestno obrestna rast."
      topPerformer:
        title: "Najuspešnejši v seji"
        category: "Vodilni v seji"
        short: "Posamezen aktivni instrument z največjo odstotno rastjo v trenutni seji."
        full: "Prepozna instrument, ki izstopa v vašem portfelju glede na znotrajdnevno odstotno rast od prejšnjega uradnega zaprtja. Pomaga prepoznati gonilnike zagona in vodilne na trgu med vašimi naložbami."
        formula: "Najuspešnejši = max( (Trenutna cena - Prejšnje zaprtje) ÷ Prejšnje zaprtje ) med vsemi aktivnimi naložbami"
        formulaDescription: "Ocenjeno za vsa aktivna negotovinska sredstva v portfelju."
        components:
          topAsset:
            label: "Najboljši instrument"
            description: "Oznaka instrumenta in znotrajdnevni odstotni donos."
            none: "Ni aktivnih pozicij v delnicah"
        takeaways:
          momentum: "Spremljanje zagona: takojšen vpogled v današnjo najmočnejšo rast."
          attribution: "Pripis: razumite, katera pozicija nosi današnjo uspešnost portfelja."

