setup:
  _section: "setup"

# ── service: text the service sends (notifications, errors) ──────────────
service:
  assistant:
    untitledChat: "チャットセッション"
  report:
    title: "{portfolio} - 週次ブリーフィング（{period}）"
    summary:
      other: "評価額 {currency}{value}、{count} 資産全体の累積リターンは {change}%。"
    fallback:
      heading: "ポートフォリオ自動ブリーフィング（{period}）"
      overviewLabel: "市場概況"
      overview: "ポートフォリオの総評価額は {currency}{value}、全体のリターンは {change}% です。"
      note: "注：詳細レポート用の LLM モデルに一時的に接続できませんでした（{error}）。テクニカル指標と台帳の数値は検証済みです。"
  suggestions:
    dropped:
      invalid:
        other: "{count} 件の提案を除外しました：回答が不完全でした。"
      notHeld:
        other: "{count} 件の提案を除外しました：ポートフォリオにない保有銘柄を変更する内容でした。"
      unknown:
        other: "{count} 件の提案を除外しました：データプロバイダーがその銘柄を認識していません。"
      privateAsset:
        other: "{count} 件の提案を除外しました：非上場の保有資産を売買する内容でした。"
      misread:
        other: "{count} 件の提案を除外しました：アシスタントが現在のウェイトを読み違えました。"
      noChange:
        other: "{count} 件の提案を除外しました：ウェイトの変更が小さすぎるか、方向が逆でした。"
      duplicate:
        other: "{count} 件の提案を除外しました：銘柄が重複していました。"
      extra:
        other: "{count} 件の提案を除外しました：保持するのは {max} 件までです。"
    dismissedLeftOut:
