        formula: "本日のリターン（$）= Σ [（現在価格 - 前日終値）× 株数 ]"
        formulaDescription: "本日のリターン（%）=（本日のリターン $ ÷ 前日終値ベースの評価額合計）× 100"
        components:
          currencyDelta:
            label: "24 時間の金額変動"
            description: "当日に生じた損益の絶対額。"
          percentChange:
            label: "24 時間の変動率"
            description: "前日終値ベースの評価額に対するリターン率。"
          topWinner:
            label: "当日の上昇率トップ"
            description: "当日、保有ポートフォリオで最もパフォーマンスが良かった資産。"
        takeaways:
          volatility: "当日のボラティリティ：日々のマクロイベント、決算発表、市場の変化が今日の保有銘柄にどう影響したかを示します。"
          excludesCash: "現金を除外：日次リターンを左右するのは価格変動のある証券のみで、現金準備の日次ボラティリティはゼロです。"
          realTime: "リアルタイム更新：取引時間中、新しい相場が届くたびに再計算します。"
      realizedIncome:
        title: "実現損益とインカム"
        category: "インカムと利回り"
        short: "売却、配当、利回りによって確定した現金利益の累計。"
        full: "含み益は市場心理とともに上下しますが、「実現損益とインカム」は確保済みの確定した資産を追跡します。売却した証券から実現した利益と、配当や利息による定期的なインカムを合算します。"
        formula: "実現損益とインカム = 売却確定損益 + 受取配当の合計 + 受取固定利息"
        formulaDescription: "売却確定損益は、SELL の約定ごとに先入先出法（FIFO）/ 平均取得単価法で計算します。"
        components:
          sells:
            label: "売却による実現純額"
            description: "約定した売却取引で確定したキャピタルゲイン。"
          dividends:
            label: "受取配当"
            description: "保有銘柄からあなたに直接支払われた現金。"
          interest:
            label: "固定利息 / 利回り"
            description: "現金の利回り、債券のクーポン、貸付から得たインカム。"
        takeaways:
          permanent: "確定した資産：確定済みの利益は、今後の相場下落で失われることはありません。"
          income: "インカムの創出：配当資産から生まれる受動的な利回りを明確に把握できます。"
          tax: "税務と会計：毎年の課税対象となる譲渡益や配当の把握に役立ちます。"
      cashReserves:
        title: "現金準備"
        category: "流動性"
        short: "戦略的なリバランスや安全のために使える、未配分の現金。"
        full: "現金準備は、ポートフォリオ内の未投資の法定通貨です。この流動資金は、押し目買いの「待機資金」、緊急時のバッファー、配当再投資までの待機に使えます。"
        formula: "現金準備 = 入金総額 - 購入総額 + 売却総額 + 配当 - 出金 - 手数料"
        formulaDescription: "現金比率（%）=（現金準備 ÷ ポートフォリオ評価額の合計）× 100"
        components:
          balance:
            label: "現在の残高"
            description: "ポートフォリオの基準通貨で、すぐに使える現金。"
          share:
            label: "配分比率"
            description: "ポートフォリオ総額のうち現金で保有している割合。"
            value: "ポートフォリオの {percent}%"
        takeaways:
          liquidity: "機動的な流動性：既存の資産を売らずに、相場下落時にすぐ購入できます。"
          risk: "リスク低減：弱気相場でポートフォリオ全体のボラティリティを和らげます。"
      capitalInjected:
        title: "投入資本"
        category: "元本"
        short: "ポートフォリオに入金した元本の累計。"
        full: "投入資本は、ポートフォリオ台帳への元本の拠出（入金）の合計を追跡します。真の投下資本利益率（ROIC）を計算する際の基準となる分母です。"
        formula: "投入資本 = 累計入金額 - 累計出金額"
        formulaDescription: "ポートフォリオ内のすべての DEPOSIT と WITHDRAWAL の取引記録から計算します。"
        components:
          deposited:
            label: "入金した資本の合計"
            description: "これまでに外部からポートフォリオへ入金した額の合計。"
        takeaways:
          benchmark: "元本の基準：外部からの積立拠出と、市場による自然な成長を区別します。"
          returnBase: "リターンの基準：金額加重リターンと時間加重リターンを正確に計算するための分母になります。"
      dividends:
        title: "配当合計"
        category: "分配"
        short: "株式とファンドの保有銘柄から受け取った現金配当の累計。"
        full: "配当合計は、配当を出す株式、ETF、REIT からポートフォリオに直接支払われた現金分配の累計額です。現金として保有することも、新しい保有銘柄に再投資することもできます。"
        formula: "配当合計 = 口座に入金されたすべての DIVIDEND 取引の合計"
        formulaDescription: "値上がり益は含まず、企業利益の分配のみを対象とします。"
        components:
          cumulative:
            label: "累計配当"
            description: "ポートフォリオのすべての資産で入金された配当金の合計。"
        takeaways:
          cashFlow: "受動的なキャッシュフロー：インカム重視の投資が実際に生み出す現金を測ります。"
          compounding: "複利の原動力：配当を計画的に再投資すると、複利による成長が加速します。"
      topPerformer:
        title: "当日のトップパフォーマー"
        category: "当日の首位"
        short: "当日の取引で上昇率が最も高い、保有中の個別資産。"
        full: "前日の公式終値からの日中上昇率に基づいて、ポートフォリオで際立った資産を特定します。保有銘柄の中のモメンタムの源泉や相場の主導役を見つけるのに役立ちます。"
        formula: "トップパフォーマー = 保有中の全銘柄における max(（現在の相場 - 前日終値）÷ 前日終値 )"
        formulaDescription: "ポートフォリオ内で保有中の、現金以外のすべての資産を対象に評価します。"
        components:
          topAsset:
            label: "トップの資産"
            description: "資産のティッカーと日中リターン率。"
            none: "保有中の株式ポジションなし"
        takeaways:
