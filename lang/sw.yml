        full: "Marejesho ya Leo hupima mabadiliko ya kifedha na ya asilimia ya nafasi zako amilifu katika kipindi cha sasa cha biashara. Hulinganisha bei za moja kwa moja na bei rasmi za kufunga soko za siku iliyopita kwa kila umiliki."
