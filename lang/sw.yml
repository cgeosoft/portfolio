          liquidity: "Ukwasi wa Fursa: Huwezesha kununua mara moja soko linaposhuka bila kuuza mali zilizopo."
          risk: "Kupunguza Hatari: Hupunguza kuyumba kwa jalada kwa ujumla wakati wa masoko yanayoshuka."
      capitalInjected:
        title: "Mtaji Ulioingizwa"
        category: "Mtaji Mkuu"
        short: "Jumla ya mtaji mkuu ulioingizwa kwenye jalada."
        full: "Mtaji Ulioingizwa hufuatilia jumla ya michango yako ya mtaji mkuu (amana) kwenye leja ya jalada. Hutumika kama kigawanyo cha msingi cha kifedha kwa kukokotoa Marejesho halisi ya Mtaji Uliowekezwa (ROIC)."
        formula: "Mtaji Ulioingizwa = Jumla ya Amana - Jumla ya Utoaji wa Mtaji"
        formulaDescription: "Hukokotolewa kutoka kwa rekodi zote za miamala ya DEPOSIT na WITHDRAWAL katika jalada lako."
        components:
          deposited:
            label: "Jumla ya Mtaji Ulioingizwa"
            description: "Jumla ya amana zote za kihistoria za nje zilizohamishiwa kwenye jalada."
        takeaways:
          benchmark: "Kigezo cha Mtaji Mkuu: Hutofautisha michango ya akiba ya nje na ukuaji wa asili wa soko."
          returnBase: "Msingi wa Marejesho: Huunda kigawanyo cha miundo sahihi ya Marejesho Yaliyopimwa kwa Fedha na Marejesho Yaliyopimwa kwa Muda."
      dividends:
        title: "Jumla ya Magawio"
        category: "Migao"
        short: "Malipo yote ya magawio ya taslimu yaliyopokelewa kutoka kwa umiliki wa hisa na mifuko tangu mwanzo."
        full: "Jumla ya Magawio inawakilisha migao yote ya taslimu iliyolipwa moja kwa moja kwenye jalada lako na hisa, ETF na REIT zinazolipa magawio. Hizi zinaweza kubaki kama ukwasi wa taslimu au kuwekezwa upya katika umiliki mpya."
        formula: "Jumla ya Magawio = Jumla ya miamala yote ya DIVIDEND iliyoingizwa kwenye akaunti"
        formulaDescription: "Haijumuishi ongezeko la bei na inazingatia tu migao ya mapato ya kampuni."
        components:
          cumulative:
            label: "Magawio Yaliyolimbikizwa"
            description: "Jumla ya magawio ya kifedha yaliyoingizwa kwenye mali zote za jalada."
        takeaways:
          cashFlow: "Mtiririko wa Fedha wa Kupita: Hupima uwezo halisi wa malipo ya taslimu wa uwekezaji wako unaolenga mapato."
          compounding: "Nishati ya Ukuaji Mseto: Magawio yanaweza kuwekezwa upya kwa utaratibu ili kuharakisha ukuaji mseto."
      topPerformer:
        title: "Iliyofanya Vizuri Zaidi Kipindi Hiki"
        category: "Kiongozi wa Kipindi"
        short: "Mali amilifu moja yenye faida kubwa zaidi ya asilimia katika kipindi cha sasa cha soko."
        full: "Hutambua mali inayojitokeza katika jalada lako kulingana na faida ya asilimia ya ndani ya siku tangu bei rasmi ya kufunga soko iliyopita. Husaidia kutambua vichocheo vya kasi na uongozi wa soko katika umiliki wako."
        formula: "Iliyofanya Vizuri Zaidi = max( (Bei ya Sasa - Bei ya Kufunga Iliyopita) ÷ Bei ya Kufunga Iliyopita ) katika umiliki wote amilifu"
        formulaDescription: "Hutathminiwa katika mali zote amilifu zisizo taslimu katika jalada."
        components:
