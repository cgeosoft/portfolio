            description: "Jumla ya mtaji uliotumika kupata nafasi zilizo wazi sasa."
        takeaways:
          liquidWorth: "Thamani ya Ukwasi: Kile ambacho jalada lako lingeleta kabla ya kodi ikiwa umiliki wote ungeuzwa mara moja kwa bei za sasa za soko."
