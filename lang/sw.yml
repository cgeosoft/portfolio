        short: "Jumla ya thamani halisi ya jalada lako ikiwa litauzwa kwa bei za soko za sasa."
        full: "Thamani ya Jalada inaonyesha jumla kamili ya thamani ya ukwasi ya jalada lako lote la uwekezaji kwa sasa. Inajumuisha thamani ya soko ya wakati halisi ya dhamana zote amilifu (hisa, ETF, sarafu za kripto, mifuko ya pamoja) pamoja na akiba yako ya taslimu ambayo haijawekezwa."
        formula: "Thamani ya Jalada = Jumla ya Thamani ya Soko ya Umiliki + Akiba ya Taslimu"
        formulaDescription: "Thamani ya Umiliki hukokotolewa kwa kuzidisha idadi ya hisa za kila nafasi amilifu kwa bei yake ya soko ya karibuni."
        components:
