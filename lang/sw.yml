        category: "Ukwasi"
        short: "Taslimu isiyogawiwa inayopatikana kwa kusawazisha upya kimkakati au usalama."
        full: "Akiba ya Taslimu inawakilisha fedha ambazo hazijawekezwa katika jalada lako. Ukwasi huu hutumika kama akiba ya kunufaika na kushuka kwa soko, kinga ya dharura, au kusubiri kuwekeza upya magawio."
        formula: "Akiba ya Taslimu = Jumla ya Amana Zilizoingizwa - Jumla ya Ununuzi + Jumla ya Mauzo + Magawio - Utoaji - Ada"
        formulaDescription: "Uzito wa Taslimu (%) = (Akiba ya Taslimu ÷ Jumla ya Thamani ya Jalada) × 100"
        components:
          balance:
