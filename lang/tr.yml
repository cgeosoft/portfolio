        title: "Gerçekleşen ve Gelir"
        category: "Gelir ve Getiri"
        short: "Gerçekleşen satışlardan, temettülerden ve getirilerden elde edilen kümülatif kesinleşmiş nakit kârlar."
        full: "Gerçekleşmemiş kâğıt üzerindeki kazançlar piyasa havasıyla inip çıkarken, Gerçekleşen ve Gelir elde ettiğiniz kalıcı, kesinleşmiş serveti izler. Satılan menkul kıymetlerden gerçekleşen tüm kârları, temettü ve faizden gelen düzenli gelir akışlarıyla toplar."
        formula: "Gerçekleşen ve Gelir = Kapanan Satış K/Z + Alınan Toplam Temettüler + Kazanılan Sabit Faiz"
        formulaDescription: "Kapanan Satış K/Z, her SELL işleminde FIFO / ortalama maliyet esası yöntemiyle hesaplanır."
        components:
          sells:
            label: "Net Gerçekleşen Satışlar"
            description: "Gerçekleşen satış işlemlerinden kesinleşen sermaye kazançları."
          dividends:
            label: "Alınan Temettüler"
            description: "Portföy varlıklarının doğrudan size dağıttığı nakit ödemeler."
          interest:
            label: "Sabit Faiz / Getiriler"
            description: "Nakit getirilerinden, tahvil kuponlarından veya borç vermeden elde edilen gelir."
        takeaways:
          permanent: "Kalıcı Servet: Kesinleşen kazançlar gelecekteki piyasa düşüşleriyle geri alınamaz."
          income: "Gelir Üretimi: Temettü ödeyen varlıklardan elde edilen pasif getiriyi net biçimde gösterir."
          tax: "Vergi ve Muhasebe: Yıllık vergiye tabi sermaye olaylarını ve temettü dağıtımlarını izlemek için kullanışlıdır."
      cashReserves:
        title: "Nakit Rezervleri"
        category: "Likidite"
        short: "Stratejik yeniden dengeleme veya güvenlik için kullanılabilir, dağıtılmamış likit nakit."
        full: "Nakit Rezervleri, portföyünüzdeki yatırılmamış itibari parayı temsil eder. Bu likidite, fırsatçı piyasa düşüşleri için 'kuru barut', acil durum tamponu veya temettü yeniden yatırımını beklerken bir kaynak işlevi görür."
        formula: "Nakit Rezervleri = Toplam Yatırılan Para - Toplam Alışlar + Toplam Satışlar + Temettüler - Çekilen Para - Komisyonlar"
        formulaDescription: "Nakit Ağırlığı (%) = (Nakit Rezervleri ÷ Toplam Portföy Değerlemesi) × 100"
        components:
          balance:
            label: "Güncel Bakiye"
            description: "Portföyün temel para biriminde hemen kullanılabilir likit nakit."
          share:
            label: "Dağılım Payı"
            description: "Toplam portföy değerinin nakit olarak tutulan yüzdesi."
            value: "Portföyün %{percent} kadarı"
        takeaways:
          liquidity: "Fırsat Likiditesi: Mevcut varlıkları satmadan piyasa düşüşlerinde hemen işlem yapmayı sağlar."
          risk: "Risk Azaltma: Ayı dönemlerinde genel portföy oynaklığını azaltır."
      capitalInjected:
        title: "Yatırılan Sermaye"
        category: "Anapara"
        short: "Portföye yatırılan toplam kümülatif anapara."
        full: "Yatırılan Sermaye, portföy defterine yaptığınız toplam anapara katkılarını (para yatırmaları) izler. Gerçek Yatırılan Sermaye Getirisini (ROIC) hesaplamak için temel finansal paydadır."
        formula: "Yatırılan Sermaye = Kümülatif Yatırılan Para - Kümülatif Sermaye Çekimleri"
        formulaDescription: "Portföyünüzdeki tüm DEPOSIT ve WITHDRAWAL işlem kayıtlarından hesaplanır."
        components:
          deposited:
            label: "Yatırılan Toplam Sermaye"
            description: "Portföye aktarılan tüm geçmiş dış para yatırmalarının toplamı."
        takeaways:
          benchmark: "Anapara Ölçütü: Dışarıdan yapılan birikim katkılarını organik piyasa büyümesinden ayırır."
          returnBase: "Getiri Tabanı: Doğru Para Ağırlıklı ve Zaman Ağırlıklı Getiri modellerinin paydasını oluşturur."
      dividends:
        title: "Toplam Temettüler"
        category: "Dağıtımlar"
        short: "Hisse ve fon varlıklarından alınan tüm zamanların nakit temettü ödemeleri."
        full: "Toplam Temettüler, temettü veren hisseler, ETF'ler ve GYO'lar tarafından portföyünüze doğrudan ödenen ömür boyu toplam nakit dağıtımları temsil eder. Bunlar nakit likidite olarak tutulabilir veya yeni varlıklara yeniden yatırılabilir."
        formula: "Toplam Temettüler = Hesaba yatırılan tüm DIVIDEND işlemlerinin toplamı"
        formulaDescription: "Fiyat artışını hariç tutar ve yalnızca şirket kâr dağıtımlarına odaklanır."
        components:
          cumulative:
            label: "Kümülatif Temettüler"
            description: "Tüm portföy varlıklarından yatırılan toplam parasal temettüler."
        takeaways:
          cashFlow: "Pasif Nakit Akışı: Gelir odaklı yatırımlarınızın gerçek nakit ödeme gücünü ölçer."
          compounding: "Bileşik Büyüme Yakıtı: Temettüler, bileşik büyümeyi hızlandırmak için sistematik olarak yeniden yatırılabilir."
      topPerformer:
        title: "Seansın En İyi Performansı"
        category: "Seans Lideri"
        short: "Geçerli piyasa seansında en yüksek yüzdesel kazancı sağlayan tekil aktif varlık."
        full: "Önceki resmî piyasa kapanışına göre gün içi yüzdesel kazanca dayanarak portföyünüzde öne çıkan varlığı belirler. Varlıklarınız arasındaki momentum kaynaklarını ve piyasa liderliğini fark etmenize yardımcı olur."
        formula: "En İyi Performans = tüm aktif varlıklar arasında max( (Güncel Fiyat - Önceki Kapanış) ÷ Önceki Kapanış )"
        formulaDescription: "Portföydeki tüm aktif, nakit dışı varlıklar arasında değerlendirilir."
        components:
          topAsset:
            label: "En İyi Varlık"
            description: "Varlık sembolü ve gün içi yüzdesel getiri."
            none: "Aktif hisse pozisyonu yok"
        takeaways:
          momentum: "Momentum Takibi: Bugünün en güçlü varlık yükselişini anında gösterir."
          attribution: "Atıf: Bugünkü portföy performansını hangi pozisyonun taşıdığını anlayın."

