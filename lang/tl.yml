    defs:
      totalGain:
        title: "Kabuuang Kita Mula sa Simula"
        category: "Performance"
        short: "Kabuuang net na economic performance ng iyong buong portfolio mula sa simula."
        full: "Sinusukat ng metric na ito ang komprehensibong net performance ng iyong kapital. Hindi lang nito tinitingnan ang kasalukuyang unrealized na kita sa papel; pinagsasama nito ang lahat ng pagbabago sa presyo ng asset, realized na kita mula sa mga naisarang benta, mga dibidendo, mga bayad na interes, at ibinabawas ang mga transaction fee na binayaran sa paglipas ng panahon."
        formula: "Kabuuang Kita = (Halagang Ininvest - Cost Basis) + Realized PnL + Dibidendo + Interes - Broker Fee"
        formulaDescription: "Return % = (Kabuuang Kita Mula sa Simula ÷ Kabuuang Kapital na Ininvest) × 100"
        components:
          unrealized:
            label: "Unrealized na Kita / Lugi"
            description: "Kita o lugi sa papel ng mga kasalukuyang bukas na posisyon (Halagang Ininvest − Cost Basis)."
          realized:
            label: "Sarado / Realized PnL"
            description: "Net na kita o lugi na naitala sa pagbebenta ng mga asset sa paglipas ng panahon."
          income:
            label: "Dibidendo at Interes"
            description: "Pinagsamang cash distribution at fixed yield na na-credit sa portfolio."
          fees:
            label: "Mga Transaction Fee"
            description: "Kabuuang brokerage commission at order fee na ibinawas sa paglipas ng panahon."
        takeaways:
          alpha: "Tunay na Economic Alpha: Sinusukat ang kabuuang yamang nalikha sa halip na ang static na pagbabago lang ng presyo ng ticker."
          cashFlow: "Kasama ang Cash Flow: Buong isinasama sa porsyento ng return ang mga dibidendo at interes na ininvest muli o natanggap."
          netOfFees: "Net ng Fee: Ibinabawas ang mga broker commission at trade friction para ipakita ang makatotohanang net return."
      valuation:
        title: "Valuation ng Portfolio"
        category: "Valuation"
        short: "Kabuuang liquidated net worth ng iyong portfolio sa live na market quote."
        full: "Ipinapakita ng Valuation ng Portfolio ang eksaktong kabuuang liquid na halaga ng iyong buong investment portfolio ngayon. Pinagsasama nito ang real-time na market value ng lahat ng aktibong security (stock, ETF, cryptocurrency, mutual fund) at ang iyong hindi ininvest na cash reserve."
        formula: "Valuation ng Portfolio = Kabuuang Market Value ng Holdings + Mga Cash Reserve"
        formulaDescription: "Kinakalkula ang Halaga ng Holdings sa pamamagitan ng pag-multiply ng bilang ng shares ng bawat aktibong posisyon sa pinakabagong live na market quote nito."
        components:
          holdings:
            label: "Halaga ng Ininvest na Holdings"
            description: "Pinagsamang live na halaga ng lahat ng aktibong stock, ETF, crypto at iba pang asset."
          cash:
            label: "Hindi Ininvest na Cash Reserve"
            description: "Liquid na cash buffer na available para sa mga bagong pagbili o safe-haven na liquidity."
          costBasis:
            label: "Cost Basis ng Holdings"
            description: "Kabuuang kapital na ginastos para makuha ang mga kasalukuyang bukas na posisyon."
        takeaways:
          liquidWorth: "Liquid na Halaga: Ang makukuha mula sa iyong portfolio bago ang buwis kung agad na ili-liquidate ang lahat ng holdings sa kasalukuyang market bid."
          multiAsset: "Multi-Asset na Integrasyon: Maayos na pinagsasama ang mga posisyon sa iba't ibang currency, cash balance at fractional na asset."
          cashDrag: "Kasama ang Cash Drag: Tumpak na tinitimbang ang mga liquid reserve kasama ng mga ininvest na asset."
      todayReturn:
        title: "Return Ngayong Araw"
        category: "Pang-araw-araw na Return"
        short: "Pagbabago ng valuation sa isang session kumpara sa nakaraang pagsasara ng merkado."
        full: "Sinusukat ng Return Ngayong Araw ang pagbabago sa halaga at porsyento ng iyong mga aktibong posisyon sa kasalukuyang trading session. Inihahambing nito ang mga live na quote sa opisyal na closing price ng nakaraang araw para sa bawat holding."
        formula: "Return Ngayong Araw ($) = Kabuuan ng [ (Kasalukuyang Presyo - Nakaraang Closing Price) × Shares ]"
        formulaDescription: "Return Ngayong Araw (%) = (Return Ngayong Araw $ ÷ Kabuuang Halaga sa Pagsasara ng Nakaraang Session) × 100"
        components:
          currencyDelta:
            label: "Pagbabago ng Halaga sa 24h"
            description: "Absolute na kita o lugi sa kasalukuyang session."
          percentChange:
            label: "Porsyentong Pagbabago sa 24h"
            description: "Porsyento ng return kumpara sa baseline na valuation sa pagsasara kahapon."
          topWinner:
            label: "Pinakamalaking Panalo sa Session"
            description: "Ang asset na may pinakamahusay na performance sa iyong aktibong portfolio sa session na ito."
        takeaways:
          volatility: "Volatility ng Session: Ipinapakita kung paano naapektuhan ng mga pang-araw-araw na macro event, earnings report o paggalaw ng merkado ang iyong holdings ngayon."
          excludesCash: "Hindi Kasama ang Cash: Mga security lang na sensitibo sa presyo ang nagtutulak ng pang-araw-araw na return; zero ang pang-araw-araw na volatility ng mga cash reserve."
          realTime: "Real-time na Update: Dinamikong kinakalkula muli habang dumarating ang mga bagong quote sa oras ng merkado."
      realizedIncome:
        title: "Realized at Kita"
        category: "Kita at Yield"
        short: "Pinagsamang naitalang cash profit mula sa mga naisagawang benta, dibidendo at yield."
        full: "Habang tumataas at bumababa ang mga unrealized na kita sa papel ayon sa sentimyento ng merkado, sinusubaybayan ng Realized at Kita ang permanenteng yamang naitabi mo na. Pinagsasama nito ang lahat ng realized na kita mula sa mga naibentang security at ang regular na kita mula sa mga dibidendo at interes."
        formula: "Realized at Kita = PnL ng Naisarang Benta + Kabuuang Natanggap na Dibidendo + Kinitang Fixed Interest"
        formulaDescription: "Kinakalkula ang PnL ng Naisarang Benta sa bawat SELL gamit ang FIFO / average cost basis na paraan."
        components:
          sells:
            label: "Net na Realized na Benta"
            description: "Realized na capital gain mula sa mga naisagawang sell transaction."
          dividends:
            label: "Natanggap na Dibidendo"
            description: "Mga cash payment na direktang ibinigay sa iyo ng mga holding sa portfolio."
          interest:
            label: "Fixed Interest / Yield"
            description: "Kitang nakuha mula sa cash yield, bond coupon o pagpapautang."
        takeaways:
          permanent: "Permanenteng Yaman: Hindi mababawi ng mga susunod na pagbagsak ng merkado ang mga naitalang kita."
          income: "Paglikha ng Kita: Malinaw na tanaw sa passive yield mula sa mga asset na nagbabayad ng dibidendo."
          tax: "Buwis at Accounting: Kapaki-pakinabang sa pagsubaybay ng taunang taxable capital event at mga dibidendo."
      cashReserves:
        title: "Mga Cash Reserve"
        category: "Liquidity"
        short: "Hindi nakalaang liquid na cash na available para sa estratehikong rebalancing o seguridad."
        full: "Ang Mga Cash Reserve ay ang hindi ininvest na fiat currency sa iyong portfolio. Nagsisilbi ang liquidity na ito bilang 'dry powder' para sa mga oportunidad kapag bumaba ang merkado, emergency buffer, o habang hinihintay ang muling pag-invest ng dibidendo."
        formula: "Mga Cash Reserve = Kabuuang Deposito - Kabuuang Pagbili + Kabuuang Benta + Dibidendo - Withdrawal - Fee"
        formulaDescription: "Timbang ng Cash (%) = (Mga Cash Reserve ÷ Kabuuang Valuation ng Portfolio) × 100"
        components:
          balance:
            label: "Kasalukuyang Balanse"
            description: "Agad na magagamit na liquid na cash sa base currency ng portfolio."
          share:
            label: "Bahagi sa Alokasyon"
            description: "Porsyento ng kabuuang halaga ng portfolio na nasa cash."
            value: "{percent}% ng portfolio"
        takeaways:
          liquidity: "Oportunistikong Liquidity: Nagbibigay-daan sa agarang pagkilos kapag bumaba ang merkado nang hindi nagbebenta ng kasalukuyang asset."
          risk: "Pagbawas ng Risk: Pinapahina ang kabuuang volatility ng portfolio sa mga bear cycle."
      capitalInjected:
        title: "Kapital na Ipinasok"
        category: "Principal"
        short: "Kabuuang pinagsamang principal na kapital na idineposito sa portfolio."
        full: "Sinusubaybayan ng Kapital na Ipinasok ang iyong kabuuang principal na kontribusyon (deposito) sa ledger ng portfolio. Ito ang batayang denominator sa pagkalkula ng tunay na Return on Invested Capital (ROIC)."
        formula: "Kapital na Ipinasok = Pinagsamang Deposito - Pinagsamang Withdrawal ng Kapital"
        formulaDescription: "Kinakalkula mula sa lahat ng DEPOSIT at WITHDRAWAL na transaksyon sa iyong portfolio."
        components:
          deposited:
            label: "Kabuuang Kapital na Idineposito"
            description: "Kabuuan ng lahat ng nakaraang external na deposito na inilipat sa portfolio."
        takeaways:
          benchmark: "Principal Benchmark: Pinaghihiwalay ang mga external na kontribusyon mula sa organikong paglago ng merkado."
          returnBase: "Batayan ng Return: Ito ang denominator para sa tumpak na Money-Weighted at Time-Weighted Return na model."
      dividends:
        title: "Kabuuang Dibidendo"
        category: "Mga Distribusyon"
        short: "Lahat ng cash dividend payout na natanggap mula sa mga equity at fund holding."
        full: "Ang Kabuuang Dibidendo ay ang lahat ng cash distribution na direktang ibinayad sa iyong portfolio ng mga equity, ETF at REIT na nagbabayad ng dibidendo. Maaari itong itabi bilang cash liquidity o i-invest muli sa mga bagong holding."
        formula: "Kabuuang Dibidendo = Kabuuan ng lahat ng DIVIDEND na transaksyong na-credit sa account"
        formulaDescription: "Hindi kasama ang pagtaas ng presyo; nakatuon lamang sa mga distribusyon ng kita ng kumpanya."
        components:
          cumulative:
            label: "Pinagsamang Dibidendo"
            description: "Kabuuang dibidendong na-credit mula sa lahat ng asset ng portfolio."
        takeaways:
          cashFlow: "Passive na Cash Flow: Sinusukat ang tunay na kakayahang magbayad ng cash ng iyong mga investment na nakatuon sa kita."
          compounding: "Panggatong ng Compounding: Maaaring sistematikong i-invest muli ang mga dibidendo para pabilisin ang compound growth."
      topPerformer:
        title: "Pinakamahusay sa Session"
        category: "Nangunguna sa Session"
        short: "Ang indibidwal na aktibong asset na may pinakamataas na porsyentong pagtaas sa kasalukuyang market session."
        full: "Tinutukoy ang namumukod-tanging asset sa iyong portfolio batay sa intraday na porsyentong pagtaas mula sa nakaraang opisyal na pagsasara ng merkado. Nakatutulong itong makita ang mga nagtutulak ng momentum at nangunguna sa merkado sa iyong holdings."
        formula: "Pinakamahusay = max( (Kasalukuyang Quote - Nakaraang Close) ÷ Nakaraang Close ) sa lahat ng aktibong holding"
        formulaDescription: "Sinusuri sa lahat ng aktibong non-cash na asset sa portfolio."
        components:
          topAsset:
            label: "Nangungunang Asset"
            description: "Ticker ng asset at intraday na porsyento ng return."
            none: "Walang aktibong equity na posisyon"
        takeaways:
          momentum: "Pagsubaybay sa Momentum: Agarang tanaw sa pinakamalakas na rally ng asset ngayong araw."
          attribution: "Attribution: Unawain kung aling posisyon ang nagdadala ng performance ng portfolio ngayong araw."

