      cashDistributions: "Distribuições em dinheiro desde o início"
      sessionChange: "+{percent}% na sessão"
      noEquities: "Não há ações ativas"
    defs:
      totalGain:
        title: "Ganho total desde o início"
        category: "Desempenho"
        short: "Resultado económico líquido de toda a sua carteira desde o início."
        full: "Esta métrica reflete o desempenho líquido completo do seu capital. Não se limita às mais-valias potenciais atuais: soma todas as variações de preço, os lucros realizados em vendas, os dividendos e os juros recebidos, e subtrai as comissões pagas ao longo do tempo."
        formula: "Ganho total = (Valor investido - Custo de aquisição) + Resultado realizado + Dividendos + Juros - Comissões da corretora"
        formulaDescription: "Rentabilidade % = (Ganho total desde o início ÷ Capital total investido) × 100"
        components:
          unrealized:
            label: "Ganho / perda não realizado"
            description: "Lucro ou perda potencial das posições abertas (Valor investido − Custo de aquisição)."
          realized:
            label: "Resultado fechado / realizado"
            description: "Lucro ou perda líquido consolidado com a venda de ativos ao longo do tempo."
          income:
            label: "Dividendos e juros"
            description: "Distribuições em dinheiro e rendimentos fixos acumulados creditados na carteira."
          fees:
            label: "Comissões de transação"
            description: "Total das comissões de corretagem e de ordens deduzidas ao longo do tempo."
        takeaways:
          alpha: "Alfa económico real: mede a riqueza total criada, e não apenas a variação do preço de cotação."
          cashFlow: "Inclui fluxos de caixa: os dividendos e juros reinvestidos ou recebidos refletem-se por completo na percentagem de rentabilidade."
          netOfFees: "Líquido de comissões: as comissões da corretora e os custos de negociação são deduzidos para mostrar uma rentabilidade líquida realista."
      valuation:
        title: "Avaliação da carteira"
        category: "Avaliação"
        short: "Património líquido total da sua carteira às cotações de mercado atuais."
        full: "A avaliação da carteira reflete o valor líquido total exato de toda a sua carteira de investimento neste momento. Combina o valor de mercado em tempo real de todos os títulos ativos (ações, ETF, criptomoedas, fundos de investimento) com as suas reservas de liquidez não investidas."
        formula: "Avaliação da carteira = Valor de mercado total das posições + Reservas de liquidez"
        formulaDescription: "O valor das posições é calculado multiplicando a quantidade de cada posição ativa pela sua última cotação de mercado."
        components:
          holdings:
            label: "Valor das posições investidas"
            description: "Valor atual agregado de todas as ações, ETF, criptoativos e outros ativos."
          cash:
            label: "Reservas de liquidez não investidas"
            description: "Reserva de liquidez disponível para novas compras ou como refúgio."
          costBasis:
            label: "Custo de aquisição das posições"
            description: "Capital total gasto para adquirir as posições abertas."
        takeaways:
          liquidWorth: "Valor líquido: o que a sua carteira renderia antes de impostos se todas as posições fossem vendidas de imediato aos preços de compra do mercado."
          multiAsset: "Integração multiativos: consolida posições em várias moedas, saldos de liquidez e frações de ativos."
          cashDrag: "Inclui o efeito da liquidez: pondera as reservas de liquidez juntamente com os ativos investidos."
      todayReturn:
        title: "Rentabilidade de hoje"
        category: "Rentabilidade diária"
        short: "Variação da avaliação na sessão face ao fecho anterior do mercado."
        full: "A rentabilidade de hoje mede a variação monetária e percentual das suas posições ativas na sessão atual. Compara as cotações atuais com o preço oficial de fecho do dia anterior de cada posição."
        formula: "Rentabilidade de hoje ($) = Soma de [ (Preço atual - Fecho anterior) × Quantidade ]"
        formulaDescription: "Rentabilidade de hoje (%) = (Rentabilidade de hoje $ ÷ Valor agregado no fecho da sessão anterior) × 100"
        components:
          currencyDelta:
            label: "Variação 24 h em moeda"
            description: "Ganho ou perda absoluto na sessão atual."
          percentChange:
            label: "Variação percentual 24 h"
            description: "Rentabilidade percentual face à avaliação no fecho de ontem."
          topWinner:
            label: "Maior subida da sessão"
            description: "O ativo com melhor desempenho da sua carteira nesta sessão."
        takeaways:
          volatility: "Volatilidade da sessão: mostra como os eventos macroeconómicos, os resultados das empresas ou os movimentos do mercado afetaram hoje as suas posições."
          excludesCash: "Exclui a liquidez: só os títulos sensíveis ao preço geram rentabilidade diária; as reservas de liquidez não têm volatilidade diária."
          realTime: "Atualização em tempo real: é recalculada à medida que chegam novas cotações durante o horário de mercado."
      realizedIncome:
        title: "Realizado e rendimentos"
        category: "Rendimentos"
        short: "Ganhos em dinheiro consolidados de vendas executadas, dividendos e rendimentos."
        full: "Enquanto as mais-valias potenciais sobem e descem com o mercado, Realizado e rendimentos acompanha a riqueza permanente e consolidada que já garantiu. Soma todos os lucros realizados em vendas de títulos com os rendimentos regulares de dividendos e juros."
        formula: "Realizado e rendimentos = Resultado de vendas fechadas + Total de dividendos recebidos + Juros fixos obtidos"
        formulaDescription: "O resultado de vendas fechadas é calculado em cada SELL com o método FIFO / custo médio."
        components:
          sells:
            label: "Vendas realizadas líquidas"
            description: "Mais-valias consolidadas das vendas executadas."
          dividends:
            label: "Dividendos recebidos"
            description: "Pagamentos em dinheiro distribuídos diretamente a si pelas posições da carteira."
          interest:
            label: "Juros / rendimentos fixos"
            description: "Rendimentos de juros sobre liquidez, cupões de obrigações ou empréstimos."
        takeaways:
          permanent: "Riqueza permanente: os ganhos consolidados não se perdem com futuras quedas do mercado."
          income: "Geração de rendimentos: visão clara do rendimento passivo dos ativos que pagam dividendos."
          tax: "Fiscalidade e contabilidade: útil para acompanhar os eventos tributáveis anuais e os dividendos recebidos."
      cashReserves:
        title: "Reservas de liquidez"
        category: "Liquidez"
        short: "Liquidez não alocada disponível para rebalanceamento ou como reserva de segurança."
        full: "As reservas de liquidez são o dinheiro não investido da sua carteira. Esta liquidez serve de 'munição' para aproveitar quedas do mercado, como reserva de emergência ou enquanto aguarda o reinvestimento de dividendos."
        formula: "Reservas de liquidez = Depósitos totais - Compras totais + Vendas totais + Dividendos - Levantamentos - Comissões"
        formulaDescription: "Peso da liquidez (%) = (Reservas de liquidez ÷ Avaliação total da carteira) × 100"
        components:
          balance:
            label: "Saldo atual"
            description: "Liquidez disponível de imediato na moeda base da carteira."
          share:
            label: "Peso na carteira"
            description: "Percentagem do valor total da carteira mantida em liquidez."
            value: "{percent}% da carteira"
        takeaways:
          liquidity: "Liquidez para oportunidades: permite agir de imediato perante quedas do mercado sem vender ativos."
          risk: "Redução do risco: amortece a volatilidade da carteira nos ciclos de baixa."
      capitalInjected:
        title: "Capital aportado"
        category: "Capital"
        short: "Capital total depositado na carteira."
        full: "O capital aportado acompanha o total das suas entradas de capital (depósitos) no registo da carteira. Serve de denominador de base para calcular a verdadeira rentabilidade do capital investido (ROIC)."
        formula: "Capital aportado = Depósitos acumulados - Levantamentos de capital acumulados"
        formulaDescription: "Calculado a partir de todas as transações DEPOSIT e WITHDRAWAL da sua carteira."
        components:
          deposited:
            label: "Capital total depositado"
            description: "Soma de todos os depósitos externos transferidos para a carteira."
        takeaways:
          benchmark: "Referência do capital: distingue as poupanças aportadas do crescimento orgânico do mercado."
          returnBase: "Base de rentabilidade: é o denominador dos modelos de rentabilidade ponderada pelo dinheiro e ponderada no tempo."
      dividends:
        title: "Total de dividendos"
        category: "Distribuições"
        short: "Todos os dividendos em dinheiro recebidos de ações e fundos."
        full: "O total de dividendos é a soma de todas as distribuições em dinheiro pagas à sua carteira por ações, ETF e REIT que distribuem dividendos. Podem ser mantidos como liquidez ou reinvestidos em novas posições."
        formula: "Total de dividendos = Soma de todas as transações DIVIDEND creditadas na conta"
        formulaDescription: "Exclui a valorização do preço e foca-se apenas na distribuição de lucros das empresas."
        components:
          cumulative:
            label: "Dividendos acumulados"
            description: "Total de dividendos creditados por todos os ativos da carteira."
        takeaways:
          cashFlow: "Fluxo de caixa passivo: mede a capacidade real de pagamento em dinheiro dos seus investimentos orientados para rendimento."
          compounding: "Motor dos juros compostos: os dividendos podem ser reinvestidos de forma sistemática para acelerar o crescimento composto."
      topPerformer:
        title: "Melhor ativo da sessão"
        category: "Líder da sessão"
        short: "O ativo com a maior subida percentual na sessão atual."
        full: "Identifica o ativo que mais se destaca na sua carteira com base na subida percentual intradiária desde o último fecho oficial. Ajuda a detetar os motores de momento e a liderança entre as suas posições."
        formula: "Melhor ativo = máx( (Cotação atual - Fecho anterior) ÷ Fecho anterior ) entre todas as posições ativas"
        formulaDescription: "São avaliados todos os ativos da carteira, exceto a liquidez."
        components:
          topAsset:
            label: "Melhor ativo"
            description: "Ticker do ativo e a sua rentabilidade percentual intradiária."
            none: "Não há posições em ações ativas"
        takeaways:
          momentum: "Acompanhamento do momento: visão imediata do ativo com maior subida de hoje."
          attribution: "Atribuição: perceba que posição está a impulsionar hoje o desempenho da carteira."

