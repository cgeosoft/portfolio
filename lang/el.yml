            description: "Σύμβολο στοιχείου και ενδοσυνεδριακή ποσοστιαία απόδοση."
            none: "Καμία ενεργή θέση σε μετοχές"
        takeaways:
          momentum: "Παρακολούθηση ορμής: άμεση εικόνα της ισχυρότερης σημερινής ανόδου."
          attribution: "Ανάλυση απόδοσης: κατανοήστε ποια θέση στηρίζει τη σημερινή απόδοση του χαρτοφυλακίου."

