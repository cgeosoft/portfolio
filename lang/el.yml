        takeaways:
          permanent: "Μόνιμος πλούτος: τα κλειδωμένα κέρδη δεν αναιρούνται από μελλοντικές πτώσεις της αγοράς."
          income: "Δημιουργία εσόδων: σαφής εικόνα της παθητικής απόδοσης από στοιχεία που πληρώνουν μέρισμα."
          tax: "Φορολογία και λογιστική: χρήσιμο για την παρακολούθηση των ετήσιων φορολογητέων κεφαλαιακών γεγονότων και διανομών μερισμάτων."
      cashReserves:
        title: "Αποθεματικά μετρητών"
        category: "Ρευστότητα"
        short: "Μη κατανεμημένα ρευστά μετρητά διαθέσιμα για στρατηγική εξισορρόπηση ή ασφάλεια."
        full: "Τα αποθεματικά μετρητών είναι το μη επενδυμένο νόμισμα στο χαρτοφυλάκιό σας. Αυτή η ρευστότητα λειτουργεί ως «πολεμοφόδια» για ευκαιρίες σε πτώσεις της αγοράς, ως απόθεμα έκτακτης ανάγκης ή εν αναμονή επανεπένδυσης μερισμάτων."
        formula: "Αποθεματικά μετρητών = Σύνολο καταθέσεων - Σύνολο αγορών + Σύνολο πωλήσεων + Μερίσματα - Αναλήψεις - Προμήθειες"
        formulaDescription: "Στάθμιση μετρητών (%) = (Αποθεματικά μετρητών ÷ Συνολική αποτίμηση χαρτοφυλακίου) × 100"
        components:
          balance:
            label: "Τρέχον υπόλοιπο"
            description: "Άμεσα διαθέσιμα ρευστά μετρητά στο νόμισμα βάσης του χαρτοφυλακίου."
          share:
            label: "Μερίδιο κατανομής"
            description: "Το ποσοστό της συνολικής αξίας του χαρτοφυλακίου που διακρατείται σε μετρητά."
            value: "{percent}% του χαρτοφυλακίου"
        takeaways:
          liquidity: "Ευκαιριακή ρευστότητα: επιτρέπει άμεση εκτέλεση σε πτώσεις της αγοράς χωρίς πώληση υπαρχόντων στοιχείων."
          risk: "Μείωση κινδύνου: αμβλύνει τη συνολική μεταβλητότητα του χαρτοφυλακίου σε πτωτικούς κύκλους."
      capitalInjected:
        title: "Εισφερθέν κεφάλαιο"
        category: "Κεφάλαιο"
        short: "Το συνολικό σωρευτικό κεφάλαιο που κατατέθηκε στο χαρτοφυλάκιο."
        full: "Το εισφερθέν κεφάλαιο παρακολουθεί τις συνολικές εισφορές κεφαλαίου (καταθέσεις) στο βιβλίο του χαρτοφυλακίου. Αποτελεί τον βασικό παρονομαστή για τον υπολογισμό της πραγματικής απόδοσης του επενδυμένου κεφαλαίου (ROIC)."
        formula: "Εισφερθέν κεφάλαιο = Σωρευτικές καταθέσεις - Σωρευτικές αναλήψεις κεφαλαίου"
        formulaDescription: "Υπολογίζεται από όλες τις εγγραφές συναλλαγών DEPOSIT και WITHDRAWAL του χαρτοφυλακίου σας."
        components:
          deposited:
            label: "Συνολικό κατατεθειμένο κεφάλαιο"
            description: "Το άθροισμα όλων των εξωτερικών καταθέσεων που μεταφέρθηκαν στο χαρτοφυλάκιο."
        takeaways:
          benchmark: "Μέτρο αναφοράς κεφαλαίου: διακρίνει τις εξωτερικές εισφορές αποταμίευσης από την οργανική ανάπτυξη της αγοράς."
          returnBase: "Βάση απόδοσης: αποτελεί τον παρονομαστή για ακριβή μοντέλα απόδοσης σταθμισμένης με χρήμα και σταθμισμένης με χρόνο."
      dividends:
        title: "Συνολικά μερίσματα"
        category: "Διανομές"
        short: "Όλα τα μερίσματα σε μετρητά που λήφθηκαν από μετοχές και αμοιβαία."
        full: "Τα συνολικά μερίσματα είναι οι συνολικές διανομές μετρητών που καταβλήθηκαν απευθείας στο χαρτοφυλάκιό σας από μερισματοφόρες μετοχές, ETF και REIT. Μπορούν να διακρατηθούν ως ρευστότητα ή να επανεπενδυθούν σε νέες συμμετοχές."
        formula: "Συνολικά μερίσματα = Άθροισμα όλων των συναλλαγών DIVIDEND που πιστώθηκαν στον λογαριασμό"
        formulaDescription: "Εξαιρεί την ανατίμηση και εστιάζει αποκλειστικά στις διανομές εταιρικών κερδών."
        components:
          cumulative:
            label: "Σωρευτικά μερίσματα"
            description: "Σύνολο χρηματικών μερισμάτων που πιστώθηκαν από όλα τα στοιχεία του χαρτοφυλακίου."
        takeaways:
          cashFlow: "Παθητική ταμειακή ροή: μετρά την πραγματική δυνατότητα πληρωμής μετρητών των επενδύσεων εισοδήματος."
          compounding: "Καύσιμο ανατοκισμού: τα μερίσματα μπορούν να επανεπενδύονται συστηματικά για να επιταχύνουν τη σύνθετη ανάπτυξη."
      topPerformer:
        title: "Κορυφαίο στοιχείο συνεδρίασης"
        category: "Πρωταγωνιστής συνεδρίασης"
        short: "Το μεμονωμένο ενεργό στοιχείο με το μεγαλύτερο ποσοστιαίο κέρδος στην τρέχουσα συνεδρίαση."
        full: "Εντοπίζει το στοιχείο που ξεχωρίζει στο χαρτοφυλάκιό σας με βάση το ενδοσυνεδριακό ποσοστιαίο κέρδος από το προηγούμενο επίσημο κλείσιμο. Βοηθά να εντοπίσετε τις κινητήριες δυνάμεις ορμής και τα στοιχεία που ηγούνται."
        formula: "Κορυφαίο στοιχείο = max( (Τρέχουσα τιμή - Προηγούμενο κλείσιμο) ÷ Προηγούμενο κλείσιμο ) σε όλες τις ενεργές συμμετοχές"
