            description: "الدخل المكتسب من عوائد النقد أو قسائم السندات أو الإقراض."
        takeaways:
          permanent: "ثروة دائمة: لا يمكن لتراجعات السوق المستقبلية عكس الأرباح المثبّتة."
          income: "توليد الدخل: رؤية واضحة لتوليد العائد السلبي من الأصول الموزعة للأرباح."
          tax: "الضرائب والمحاسبة: مفيد لتتبع الأحداث الرأسمالية الخاضعة للضريبة سنويًا وتوزيعات الأرباح."
      cashReserves:
        title: "الاحتياطيات النقدية"
        category: "السيولة"
        short: "نقد سائل غير مخصص متاح لإعادة التوازن الاستراتيجي أو للأمان."
        full: "تمثل الاحتياطيات النقدية العملة غير المستثمرة في محفظتك. تعمل هذه السيولة كـ'ذخيرة جاهزة' لاغتنام تراجعات السوق، أو كهامش للطوارئ، أو بانتظار إعادة استثمار التوزيعات."
        formula: "الاحتياطيات النقدية = إجمالي الإيداعات - إجمالي المشتريات + إجمالي المبيعات + التوزيعات - السحوبات - الرسوم"
        formulaDescription: "وزن النقد (%) = (الاحتياطيات النقدية ÷ إجمالي تقييم المحفظة) × 100"
        components:
          balance:
            label: "الرصيد الحالي"
            description: "النقد السائل المتاح فورًا بالعملة الأساسية للمحفظة."
          share:
            label: "حصة التوزيع"
            description: "النسبة المئوية من إجمالي قيمة المحفظة المحتفظ بها نقدًا."
            value: "{percent}% من المحفظة"
        takeaways:
          liquidity: "سيولة للفرص: تتيح التنفيذ الفوري عند تراجعات السوق دون بيع الأصول الحالية."
          risk: "تخفيف المخاطر: يخفف التقلب العام للمحفظة خلال الدورات الهابطة."
      capitalInjected:
        title: "رأس المال المودَع"
        category: "رأس المال الأصلي"
        short: "إجمالي رأس المال الأصلي التراكمي المودَع في المحفظة."
        full: "يتتبع رأس المال المودَع إجمالي مساهماتك الأصلية (الإيداعات) في سجل المحفظة. ويشكّل المقام المالي الأساسي لحساب العائد الحقيقي على رأس المال المستثمر (ROIC)."
        formula: "رأس المال المودَع = الإيداعات التراكمية - سحوبات رأس المال التراكمية"
        formulaDescription: "يُحسب من كل سجلات معاملات DEPOSIT وWITHDRAWAL في محفظتك."
        components:
          deposited:
            label: "إجمالي رأس المال المودَع"
            description: "مجموع كل الإيداعات الخارجية التاريخية المحوّلة إلى المحفظة."
        takeaways:
          benchmark: "مرجع رأس المال الأصلي: يميّز مساهمات الادخار الخارجية عن نمو السوق الطبيعي."
          returnBase: "أساس العائد: يشكّل المقام لنماذج العائد الموزون بالأموال والموزون زمنيًا الدقيقة."
      dividends:
        title: "إجمالي التوزيعات"
        category: "التوزيعات"
        short: "كل توزيعات الأرباح النقدية المستلمة من الأسهم والصناديق منذ البداية."
        full: "يمثل إجمالي التوزيعات مجموع التوزيعات النقدية المدفوعة مباشرةً إلى محفظتك طوال الوقت من الأسهم وصناديق ETF وصناديق REIT الموزعة للأرباح. يمكن الاحتفاظ بها كسيولة نقدية أو إعادة توظيفها في حيازات جديدة."
        formula: "إجمالي التوزيعات = مجموع كل معاملات DIVIDEND المضافة إلى الحساب"
        formulaDescription: "يستثني ارتفاع الأسعار ويركز حصرًا على توزيعات أرباح الشركات."
        components:
          cumulative:
            label: "التوزيعات التراكمية"
            description: "إجمالي التوزيعات النقدية المضافة عبر كل أصول المحفظة."
        takeaways:
          cashFlow: "تدفق نقدي سلبي: يقيس القدرة الفعلية على توليد النقد لاستثماراتك الموجهة للدخل."
          compounding: "وقود التراكم: يمكن إعادة استثمار التوزيعات بانتظام لتسريع النمو المركب."
      topPerformer:
        title: "الأفضل أداءً في الجلسة"
        category: "متصدر الجلسة"
        short: "الأصل النشط الفردي صاحب أعلى نسبة ربح في جلسة السوق الحالية."
        full: "يحدد الأصل الأبرز في محفظتك بناءً على نسبة الربح خلال اليوم مقارنةً بآخر إغلاق رسمي للسوق. يساعد على رصد محركات الزخم وريادة السوق بين حيازاتك."
        formula: "الأفضل أداءً = max( (السعر الحالي - الإغلاق السابق) ÷ الإغلاق السابق ) عبر كل الحيازات النشطة"
        formulaDescription: "يُقيَّم عبر كل الأصول النشطة غير النقدية في المحفظة."
        components:
          topAsset:
            label: "الأصل الأفضل"
            description: "رمز الأصل ونسبة عائده خلال اليوم."
            none: "لا توجد مراكز أسهم نشطة"
        takeaways:
          momentum: "تتبع الزخم: رؤية فورية لأقوى ارتفاع لأصل اليوم."
          attribution: "الإسناد: فهم المركز الذي يحمل أداء المحفظة اليوم."

