      noEquities: "Nessuna azione attiva"
    defs:
      totalGain:
        title: "Guadagno totale dall'inizio"
        category: "Performance"
        short: "Performance economica netta dell'intero portafoglio dalla sua creazione."
        full: "Questo indicatore misura la performance netta complessiva del tuo capitale. Non considera solo le plusvalenze latenti attuali, ma combina tutte le variazioni di prezzo degli asset, i profitti realizzati con le vendite, i dividendi distribuiti e gli interessi incassati, e sottrae le commissioni di transazione pagate nel tempo."
        formula: "Guadagno totale = (Valore investito - Costo di carico) + Utile/perdita realizzato + Dividendi + Interessi - Commissioni del broker"
        formulaDescription: "Rendimento % = (Guadagno totale dall'inizio ÷ Capitale totale investito) × 100"
        components:
          unrealized:
            label: "Utile / perdita latente"
            description: "Utile o perdita sulla carta delle posizioni aperte (Valore investito − Costo di carico)."
          realized:
            label: "Utile/perdita realizzato"
            description: "Utile o perdita netto consolidato con le vendite di asset nel tempo."
          income:
            label: "Dividendi e interessi"
            description: "Distribuzioni in contanti e rendimenti fissi cumulati accreditati sul portafoglio."
          fees:
            label: "Commissioni di transazione"
            description: "Totale delle commissioni di intermediazione e sugli ordini detratte nel tempo."
        takeaways:
          alpha: "Vero alpha economico: misura la ricchezza totale creata invece delle sole variazioni di prezzo dei titoli."
          cashFlow: "Flussi di cassa inclusi: i dividendi e gli interessi reinvestiti o incassati sono interamente considerati nel rendimento percentuale."
          netOfFees: "Al netto delle commissioni: commissioni del broker e costi di negoziazione vengono detratti per mostrare un rendimento netto realistico."
      valuation:
        title: "Valutazione del portafoglio"
        category: "Valutazione"
        short: "Valore netto totale di liquidazione del portafoglio alle quotazioni di mercato in tempo reale."
        full: "La valutazione del portafoglio indica il valore liquido totale esatto dell'intero portafoglio in questo momento. Combina il valore di mercato in tempo reale di tutti i titoli attivi (azioni, ETF, criptovalute, fondi comuni) con le riserve di liquidità non investite."
        formula: "Valutazione del portafoglio = Valore di mercato totale delle posizioni + Riserve di liquidità"
        formulaDescription: "Il valore delle posizioni si calcola moltiplicando la quantità di ogni posizione attiva per la sua ultima quotazione di mercato."
        components:
          holdings:
            label: "Valore delle posizioni investite"
            description: "Valore complessivo in tempo reale di tutte le azioni, ETF, cripto e altri asset detenuti."
          cash:
            label: "Riserve di liquidità non investite"
            description: "Margine di liquidità disponibile per nuovi acquisti o come bene rifugio."
          costBasis:
            label: "Costo di carico delle posizioni"
            description: "Capitale totale speso per acquisire le posizioni attualmente aperte."
        takeaways:
          liquidWorth: "Valore liquido: quanto renderebbe il portafoglio al lordo delle imposte se tutte le posizioni venissero liquidate subito ai prezzi denaro attuali."
          multiAsset: "Integrazione multi-asset: consolida posizioni in più valute, saldi di liquidità e frazioni di titoli."
          cashDrag: "Include l'effetto della liquidità: pesa con precisione le riserve liquide insieme agli asset investiti."
      todayReturn:
        title: "Rendimento di oggi"
        category: "Rendimento giornaliero"
        short: "Variazione della valutazione nella seduta rispetto alla chiusura precedente."
        full: "Il rendimento di oggi misura la variazione in valore e in percentuale delle posizioni attive durante la seduta in corso. Confronta le quotazioni in tempo reale con i prezzi di chiusura ufficiali del giorno precedente per ogni posizione."
        formula: "Rendimento di oggi ($) = Somma di [ (Prezzo attuale - Chiusura precedente) × Quantità ]"
        formulaDescription: "Rendimento di oggi (%) = (Rendimento di oggi $ ÷ Valore complessivo alla chiusura precedente) × 100"
        components:
          currencyDelta:
            label: "Variazione 24h in valuta"
            description: "Guadagno o perdita assoluto nella seduta in corso."
          percentChange:
            label: "Variazione 24h in %"
            description: "Rendimento percentuale rispetto alla valutazione alla chiusura di ieri."
          topWinner:
            label: "Miglior rialzo della seduta"
            description: "L'asset con la performance migliore del portafoglio in questa seduta."
        takeaways:
          volatility: "Volatilità della seduta: mostra come eventi macro, risultati trimestrali o movimenti di mercato del giorno hanno influito sulle tue posizioni."
          excludesCash: "Esclusa la liquidità: solo i titoli sensibili al prezzo determinano il rendimento giornaliero; le riserve di liquidità hanno volatilità giornaliera nulla."
          realTime: "Aggiornamento in tempo reale: si ricalcola a ogni nuova quotazione durante l'orario di mercato."
      realizedIncome:
        title: "Realizzato e proventi"
        category: "Proventi e rendimento"
        short: "Profitti in contanti consolidati e cumulati da vendite, dividendi e rendimenti."
        full: "Mentre le plusvalenze latenti salgono e scendono con il sentiment del mercato, Realizzato e proventi segue la ricchezza consolidata e incassata in modo permanente. Somma tutti i profitti realizzati con la vendita di titoli e i proventi regolari da dividendi e interessi."
        formula: "Realizzato e proventi = Utile/perdita da vendite + Totale dividendi ricevuti + Interessi fissi maturati"
        formulaDescription: "L'utile/perdita da vendite viene calcolato a ogni SELL con il metodo FIFO / del costo medio."
        components:
          sells:
            label: "Plusvalenze nette realizzate"
            description: "Plusvalenze consolidate con le vendite eseguite."
          dividends:
            label: "Dividendi ricevuti"
            description: "Pagamenti in contanti distribuiti direttamente dalle posizioni del portafoglio."
          interest:
            label: "Interessi / Rendimenti fissi"
            description: "Proventi da remunerazione della liquidità, cedole obbligazionarie o prestiti."
        takeaways:
          permanent: "Ricchezza consolidata: i guadagni realizzati non possono essere annullati da futuri ribassi del mercato."
          income: "Generazione di proventi: visibilità chiara sul rendimento passivo degli asset che pagano dividendi."
          tax: "Fisco e contabilità: utile per seguire gli eventi tassabili dell'anno e le distribuzioni di dividendi."
      cashReserves:
        title: "Riserve di liquidità"
        category: "Liquidità"
        short: "Liquidità non investita disponibile per un ribilanciamento strategico o per sicurezza."
        full: "Le riserve di liquidità rappresentano la valuta non investita del portafoglio. Questa liquidità serve come \"munizioni\" per sfruttare i cali di mercato, come cuscinetto di emergenza o in attesa del reinvestimento dei dividendi."
        formula: "Riserve di liquidità = Totale depositi - Totale acquisti + Totale vendite + Dividendi - Prelievi - Commissioni"
        formulaDescription: "Peso della liquidità (%) = (Riserve di liquidità ÷ Valutazione totale del portafoglio) × 100"
        components:
          balance:
            label: "Saldo attuale"
            description: "Liquidità immediatamente disponibile nella valuta di base del portafoglio."
          share:
            label: "Quota dell'allocazione"
            description: "Percentuale del valore totale del portafoglio detenuta in liquidità."
            value: "{percent}% del portafoglio"
        takeaways:
          liquidity: "Liquidità opportunistica: consente di agire subito durante i ribassi del mercato senza vendere asset esistenti."
          risk: "Riduzione del rischio: attenua la volatilità complessiva del portafoglio nelle fasi ribassiste."
      capitalInjected:
        title: "Capitale versato"
        category: "Capitale"
        short: "Totale cumulato del capitale depositato nel portafoglio."
        full: "Il capitale versato segue il totale dei tuoi apporti (depositi) nel registro del portafoglio. Funge da denominatore di riferimento per calcolare il vero rendimento del capitale investito (ROIC)."
        formula: "Capitale versato = Depositi cumulati - Prelievi di capitale cumulati"
        formulaDescription: "Calcolato da tutte le transazioni DEPOSIT e WITHDRAWAL del portafoglio."
        components:
          deposited:
            label: "Capitale totale depositato"
            description: "Somma di tutti i depositi esterni trasferiti nel portafoglio."
        takeaways:
          benchmark: "Riferimento del capitale: distingue i risparmi versati dalla crescita generata dal mercato."
          returnBase: "Base del rendimento: costituisce il denominatore per calcoli precisi del rendimento ponderato per il denaro e per il tempo."
      dividends:
        title: "Dividendi totali"
        category: "Distribuzioni"
        short: "Dividendi in contanti ricevuti da azioni e fondi dall'inizio."
        full: "I dividendi totali rappresentano l'insieme delle distribuzioni in contanti versate direttamente al portafoglio da azioni, ETF e REIT che pagano dividendi. Possono restare come liquidità o essere reinvestiti in nuove posizioni."
        formula: "Dividendi totali = Somma di tutte le transazioni DIVIDEND accreditate sul conto"
        formulaDescription: "Esclude l'apprezzamento del prezzo e considera solo gli utili distribuiti dalle società."
        components:
          cumulative:
            label: "Dividendi cumulati"
            description: "Totale dei dividendi accreditati su tutti gli asset del portafoglio."
        takeaways:
          cashFlow: "Flusso di cassa passivo: misura la reale capacità di distribuzione dei tuoi investimenti orientati al reddito."
          compounding: "Motore della capitalizzazione composta: i dividendi possono essere reinvestiti sistematicamente per accelerare la crescita composta."
      topPerformer:
        title: "Miglior titolo della seduta"
        category: "Leader della seduta"
        short: "L'asset detenuto con il maggior rialzo percentuale nella seduta in corso."
        full: "Individua l'asset che si distingue nel portafoglio in base al rialzo percentuale intraday rispetto all'ultima chiusura ufficiale. Aiuta a individuare i motori di momentum e i titoli trainanti tra le tue posizioni."
        formula: "Miglior titolo = max( (Quotazione attuale - Chiusura precedente) ÷ Chiusura precedente ) su tutte le posizioni attive"
        formulaDescription: "Valutato su tutte le posizioni attive del portafoglio, esclusa la liquidità."
        components:
          topAsset:
            label: "Asset migliore"
            description: "Ticker dell'asset e rendimento percentuale intraday."
            none: "Nessuna posizione azionaria attiva"
        takeaways:
          momentum: "Monitoraggio del momentum: visibilità immediata sul rialzo più forte di oggi."
          attribution: "Attribuzione: capisci quale posizione sostiene la performance del portafoglio oggi."

