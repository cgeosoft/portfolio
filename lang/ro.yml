        full: "Acest indicator surprinde performanța netă completă a capitalului dvs. Nu se uită doar la câștigurile nerealizate de pe hârtie, ci însumează toate variațiile de preț ale activelor, profiturile realizate din vânzări, distribuțiile de dividende și plățile de dobânzi și scade comisioanele de tranzacționare plătite în timp."
