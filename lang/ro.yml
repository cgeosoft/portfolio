        formulaDescription: "Randament % = (Câștig total de la început ÷ Capital total investit) × 100"
        components:
          unrealized:
            label: "Câștig / pierdere nerealizată"
            description: "Profit sau pierdere pe hârtie pentru pozițiile deschise (Valoare investită − Cost de achiziție)."
          realized:
            label: "PnL închis / realizat"
            description: "Profitul sau pierderea netă fixată la vânzarea activelor în timp."
          income:
            label: "Dividende și dobânzi"
            description: "Distribuțiile în numerar cumulate și randamentele fixe creditate în portofoliu."
          fees:
            label: "Comisioane de tranzacționare"
            description: "Totalul comisioanelor de brokeraj și al taxelor pe ordine deduse în timp."
        takeaways:
          alpha: "Alfa economic real: evaluează averea totală creată, nu doar variațiile statice ale prețului."
          cashFlow: "Include fluxurile de numerar: dividendele și dobânzile reinvestite sau încasate sunt incluse integral în procentul de randament."
          netOfFees: "Net de comisioane: comisioanele brokerului și costurile de tranzacționare sunt deduse pentru a arăta randamente nete realiste."
      valuation:
        title: "Evaluarea portofoliului"
        category: "Evaluare"
        short: "Valoarea netă totală lichidabilă a portofoliului la cotațiile de piață actuale."
        full: "Evaluarea portofoliului reflectă valoarea lichidă totală exactă a întregului portofoliu de investiții în acest moment. Combină valoarea de piață în timp real a tuturor titlurilor active (acțiuni, ETF-uri, criptomonede, fonduri mutuale) cu rezervele de numerar neinvestite."
        formula: "Evaluarea portofoliului = Valoarea de piață totală a deținerilor + Rezerve de numerar"
        formulaDescription: "Valoarea deținerilor se calculează înmulțind numărul de unități al fiecărei poziții active cu ultima cotație de piață."
        components:
          holdings:
            label: "Valoarea deținerilor investite"
            description: "Valoarea actuală agregată a tuturor acțiunilor, ETF-urilor, activelor cripto și a altor active."
          cash:
            label: "Rezerve de numerar neinvestite"
            description: "Rezervă de numerar lichid disponibilă pentru noi cumpărări sau ca refugiu sigur."
          costBasis:
            label: "Costul de achiziție al deținerilor"
            description: "Capitalul total cheltuit pentru achiziționarea pozițiilor deschise."
        takeaways:
          liquidWorth: "Valoare lichidă: suma pe care ar aduce-o portofoliul înainte de impozite dacă toate deținerile ar fi vândute imediat la prețurile de cumpărare curente ale pieței."
          multiAsset: "Integrare multi-active: consolidează pozițiile în mai multe monede, soldurile de numerar și activele fracționare."
          cashDrag: "Include frâna numerarului: ponderează corect rezervele lichide alături de activele investite."
      todayReturn:
        title: "Randamentul de astăzi"
        category: "Randament zilnic"
        short: "Variația evaluării într-o singură sesiune față de închiderea anterioară a pieței."
        full: "Randamentul de astăzi măsoară fluctuația monetară și procentuală a pozițiilor active în sesiunea de tranzacționare curentă. Compară cotațiile actuale cu prețurile oficiale de închidere din ziua anterioară pentru fiecare deținere."
        formula: "Randamentul de astăzi ($) = Suma [ (Preț curent - Preț de închidere anterior) × Unități ]"
        formulaDescription: "Randamentul de astăzi (%) = (Randamentul de astăzi $ ÷ Valoarea agregată la închiderea sesiunii anterioare) × 100"
        components:
          currencyDelta:
            label: "Variație monetară 24h"
            description: "Câștigul sau pierderea absolută din sesiunea curentă."
          percentChange:
            label: "Variație procentuală 24h"
            description: "Randamentul procentual față de evaluarea de bază la închiderea de ieri."
          topWinner:
            label: "Cel mai mare câștig al sesiunii"
            description: "Activul cu cea mai bună performanță din portofoliul activ în această sesiune."
        takeaways:
          volatility: "Volatilitatea sesiunii: arată cum evenimentele macro zilnice, rapoartele de rezultate sau mișcările pieței v-au afectat astăzi deținerile."
          excludesCash: "Exclude numerarul: doar titlurile sensibile la preț determină randamentele zilnice; rezervele de numerar au volatilitate zilnică zero."
          realTime: "Actualizări în timp real: se recalculează dinamic pe măsură ce sosesc cotații noi în orele de tranzacționare."
      realizedIncome:
        title: "Realizat și venituri"
        category: "Venituri și randament"
        short: "Profiturile în numerar fixate cumulat din vânzări executate, dividende și randamente."
        full: "În timp ce câștigurile nerealizate de pe hârtie cresc și scad odată cu sentimentul pieței, Realizat și venituri urmărește averea permanentă, cristalizată, pe care ați încasat-o. Însumează toate profiturile realizate din titlurile vândute împreună cu fluxurile regulate de venit din dividende și dobânzi."
        formula: "Realizat și venituri = PnL din vânzări închise + Total dividende primite + Dobânzi fixe câștigate"
        formulaDescription: "PnL din vânzări închise se calculează la fiecare execuție SELL folosind metoda FIFO / a costului mediu de achiziție."
        components:
          sells:
            label: "Vânzări nete realizate"
            description: "Câștiguri de capital cristalizate din tranzacțiile de vânzare executate."
          dividends:
            label: "Dividende primite"
            description: "Plăți în numerar distribuite direct către dvs. de deținerile din portofoliu."
          interest:
            label: "Dobânzi fixe / randamente"
            description: "Venituri din randamente ale numerarului, cupoane de obligațiuni sau împrumuturi."
        takeaways:
          permanent: "Avere permanentă: câștigurile fixate nu pot fi anulate de scăderile viitoare ale pieței."
          income: "Generarea de venituri: vizibilitate clară asupra randamentului pasiv generat de activele care plătesc dividende."
          tax: "Fiscalitate și contabilitate: util pentru urmărirea anuală a evenimentelor de capital impozabile și a distribuțiilor de dividende."
      cashReserves:
        title: "Rezerve de numerar"
        category: "Lichiditate"
        short: "Numerar lichid nealocat, disponibil pentru reechilibrare strategică sau siguranță."
        full: "Rezervele de numerar reprezintă moneda fiduciară neinvestită din portofoliu. Această lichiditate servește drept „muniție” pentru scăderile oportune ale pieței, rezervă pentru urgențe sau în așteptarea reinvestirii dividendelor."
        formula: "Rezerve de numerar = Total depuneri - Total cumpărări + Total vânzări + Dividende - Retrageri - Comisioane"
        formulaDescription: "Ponderea numerarului (%) = (Rezerve de numerar ÷ Evaluarea totală a portofoliului) × 100"
        components:
          balance:
            label: "Sold curent"
            description: "Numerar lichid disponibil imediat în moneda de bază a portofoliului."
          share:
            label: "Cotă din alocare"
            description: "Proporția procentuală din valoarea totală a portofoliului deținută în numerar."
            value: "{percent}% din portofoliu"
        takeaways:
          liquidity: "Lichiditate oportună: permite execuția imediată la scăderile pieței fără a vinde activele existente."
          risk: "Reducerea riscului: atenuează volatilitatea generală a portofoliului în ciclurile de scădere."
      capitalInjected:
        title: "Capital depus"
        category: "Principal"
        short: "Capitalul principal total depus cumulat în portofoliu."
        full: "Capitalul depus urmărește contribuțiile totale de capital (depunerile) în registrul portofoliului. Servește drept numitor financiar de bază pentru calculul randamentului real al capitalului investit (ROIC)."
        formula: "Capital depus = Depuneri cumulate - Retrageri de capital cumulate"
        formulaDescription: "Calculat din toate înregistrările de tranzacții DEPOSIT și WITHDRAWAL din portofoliu."
        components:
          deposited:
            label: "Capital total depus"
            description: "Suma tuturor depunerilor externe transferate în portofoliu."
        takeaways:
          benchmark: "Reper al principalului: separă contribuțiile din economii externe de creșterea organică a pieței."
          returnBase: "Baza randamentului: formează numitorul pentru modele exacte de randament ponderat cu bani și ponderat în timp."
      dividends:
        title: "Total dividende"
        category: "Distribuții"
        short: "Toate dividendele în numerar primite din acțiuni și fonduri."
        full: "Total dividende reprezintă distribuțiile în numerar agregate, plătite direct în portofoliu de acțiunile, ETF-urile și REIT-urile cu dividende. Acestea pot fi păstrate ca lichiditate sau redistribuite în noi dețineri."
        formula: "Total dividende = Suma tuturor tranzacțiilor DIVIDEND creditate în cont"
        formulaDescription: "Exclude aprecierea prețului și se concentrează strict pe distribuțiile din profiturile companiilor."
        components:
          cumulative:
            label: "Dividende cumulate"
