    defs:
      totalGain:
        title: "Tổng lãi từ khi bắt đầu"
        category: "Hiệu suất"
        short: "Hiệu quả kinh tế ròng từ trước đến nay của toàn bộ danh mục kể từ khi bắt đầu."
        full: "Chỉ số này thể hiện toàn diện hiệu quả ròng của vốn. Nó không chỉ xét lãi trên giấy chưa thực hiện hiện tại mà tổng hợp mọi biến động giá tài sản, lợi nhuận đã thực hiện từ các lần bán, cổ tức, tiền lãi, rồi trừ đi phí giao dịch đã trả theo thời gian."
        formula: "Tổng lãi = (Giá trị đã đầu tư - Giá vốn) + Lãi/lỗ đã thực hiện + Cổ tức + Tiền lãi - Phí môi giới"
        formulaDescription: "Lợi nhuận % = (Tổng lãi từ khi bắt đầu ÷ Tổng vốn đã đầu tư) × 100"
        components:
          unrealized:
            label: "Lãi / lỗ chưa thực hiện"
            description: "Lãi hoặc lỗ trên giấy của các vị thế đang mở (Giá trị đã đầu tư − Giá vốn)."
          realized:
            label: "Lãi/lỗ đã đóng / đã thực hiện"
            description: "Lãi hoặc lỗ ròng đã chốt khi bán tài sản theo thời gian."
          income:
            label: "Cổ tức & tiền lãi"
            description: "Tổng tiền mặt chi trả và lãi cố định lũy kế đã ghi có vào danh mục."
          fees:
            label: "Phí giao dịch"
            description: "Tổng hoa hồng môi giới và phí đặt lệnh đã khấu trừ theo thời gian."
        takeaways:
          alpha: "Alpha kinh tế thực: Đánh giá tổng tài sản được tạo ra thay vì chỉ biến động giá tĩnh của mã."
          cashFlow: "Bao gồm dòng tiền: Cổ tức và tiền lãi đã tái đầu tư hoặc đã nhận được tính đầy đủ vào tỷ lệ lợi nhuận."
          netOfFees: "Sau phí: Hoa hồng môi giới và chi phí giao dịch được trừ để thể hiện lợi nhuận ròng thực tế."
      valuation:
        title: "Định giá danh mục"
        category: "Định giá"
        short: "Tổng giá trị ròng khi thanh lý danh mục theo giá thị trường trực tiếp."
        full: "Định giá danh mục phản ánh chính xác tổng giá trị thanh khoản của toàn bộ danh mục đầu tư ngay lúc này. Nó cộng giá trị thị trường theo thời gian thực của mọi chứng khoán đang nắm giữ (cổ phiếu, ETF, tiền mã hóa, quỹ tương hỗ) với dự trữ tiền mặt chưa đầu tư."
        formula: "Định giá danh mục = Tổng giá trị thị trường của khoản nắm giữ + Dự trữ tiền mặt"
        formulaDescription: "Giá trị khoản nắm giữ được tính bằng số cổ phiếu của từng vị thế nhân với giá thị trường mới nhất."
        components:
          holdings:
            label: "Giá trị khoản nắm giữ đã đầu tư"
            description: "Tổng giá trị trực tiếp của mọi cổ phiếu, ETF, tiền mã hóa và tài sản khác đang nắm giữ."
          cash:
            label: "Dự trữ tiền mặt chưa đầu tư"
            description: "Khoản đệm tiền mặt sẵn có cho lệnh mua mới hoặc làm thanh khoản trú ẩn an toàn."
          costBasis:
            label: "Giá vốn khoản nắm giữ"
            description: "Tổng vốn đã bỏ ra để mua các vị thế đang mở."
        takeaways:
          liquidWorth: "Giá trị thanh khoản: Số tiền danh mục mang lại trước thuế nếu mọi khoản nắm giữ được thanh lý ngay theo giá mua hiện tại trên thị trường."
          multiAsset: "Tích hợp đa tài sản: Hợp nhất liền mạch các vị thế đa tiền tệ, số dư tiền mặt và tài sản lẻ."
          cashDrag: "Tính cả lực kéo của tiền mặt: Phản ánh chính xác tỷ trọng dự trữ thanh khoản bên cạnh tài sản đã đầu tư."
      todayReturn:
        title: "Lợi nhuận hôm nay"
        category: "Lợi nhuận ngày"
        short: "Chênh lệch giá trị trong một phiên so với giá đóng cửa phiên trước."
        full: "Lợi nhuận hôm nay đo mức biến động bằng tiền và phần trăm của các vị thế đang mở trong phiên giao dịch hiện tại. Nó so sánh giá trực tiếp với giá đóng cửa chính thức của ngày hôm trước cho từng khoản nắm giữ."
        formula: "Lợi nhuận hôm nay ($) = Tổng của [ (Giá hiện tại - Giá đóng cửa phiên trước) × Số cổ phiếu ]"
        formulaDescription: "Lợi nhuận hôm nay (%) = (Lợi nhuận hôm nay $ ÷ Tổng giá trị đóng cửa phiên trước) × 100"
        components:
          currencyDelta:
            label: "Chênh lệch tiền 24h"
            description: "Lãi hoặc lỗ tài chính tuyệt đối trong phiên hiện tại."
          percentChange:
            label: "Thay đổi phần trăm 24h"
            description: "Tỷ lệ lợi nhuận so với giá trị cơ sở lúc đóng cửa hôm qua."
          topWinner:
            label: "Tăng mạnh nhất phiên"
            description: "Tài sản có hiệu suất tốt nhất trong danh mục của bạn ở phiên này."
        takeaways:
          volatility: "Biến động phiên: Cho thấy sự kiện vĩ mô, báo cáo kết quả kinh doanh hay biến động thị trường hôm nay ảnh hưởng thế nào tới khoản nắm giữ."
          excludesCash: "Không tính tiền mặt: Chỉ chứng khoán nhạy cảm với giá mới tạo ra lợi nhuận ngày; dự trữ tiền mặt có biến động ngày bằng 0."
          realTime: "Cập nhật thời gian thực: Tự tính lại khi có giá mới trong giờ giao dịch."
      realizedIncome:
        title: "Đã thực hiện & thu nhập"
        category: "Thu nhập & lợi suất"
        short: "Lợi nhuận tiền mặt đã chốt lũy kế từ các lần bán, cổ tức và lợi suất."
        full: "Trong khi lãi trên giấy chưa thực hiện lên xuống theo tâm lý thị trường, Đã thực hiện & thu nhập theo dõi phần tài sản cố định, đã kết tinh mà bạn thu về. Nó cộng mọi khoản lợi nhuận từ chứng khoán đã bán với dòng thu nhập đều đặn từ cổ tức và tiền lãi."
        formula: "Đã thực hiện & thu nhập = Lãi/lỗ từ bán + Tổng cổ tức đã nhận + Tiền lãi cố định đã hưởng"
        formulaDescription: "Lãi/lỗ từ bán được tính ở mỗi lệnh SELL theo phương pháp FIFO / giá vốn bình quân."
        components:
          sells:
            label: "Bán đã thực hiện ròng"
            description: "Lãi vốn đã kết tinh từ các giao dịch bán đã khớp."
          dividends:
            label: "Cổ tức đã nhận"
            description: "Tiền mặt do các khoản nắm giữ trong danh mục chi trả trực tiếp cho bạn."
          interest:
            label: "Lãi cố định / lợi suất"
            description: "Thu nhập từ lợi suất tiền mặt, coupon trái phiếu hoặc cho vay."
        takeaways:
          permanent: "Tài sản cố định: Lãi đã chốt không thể bị đảo ngược bởi các đợt giảm của thị trường sau này."
          income: "Tạo thu nhập: Thấy rõ lợi suất thụ động từ các tài sản trả cổ tức."
          tax: "Thuế & kế toán: Hữu ích để theo dõi các sự kiện vốn chịu thuế và các khoản chia cổ tức hằng năm."
      cashReserves:
        title: "Dự trữ tiền mặt"
        category: "Thanh khoản"
        short: "Tiền mặt thanh khoản chưa phân bổ, sẵn có cho tái cân bằng chiến lược hoặc an toàn."
        full: "Dự trữ tiền mặt là tiền pháp định chưa đầu tư trong danh mục. Khoản thanh khoản này đóng vai trò 'đạn dược' để tận dụng các nhịp giảm của thị trường, làm khoản đệm khẩn cấp hoặc chờ tái đầu tư cổ tức."
        formula: "Dự trữ tiền mặt = Tổng tiền nạp - Tổng mua + Tổng bán + Cổ tức - Rút tiền - Phí"
        formulaDescription: "Tỷ trọng tiền mặt (%) = (Dự trữ tiền mặt ÷ Tổng định giá danh mục) × 100"
        components:
          balance:
            label: "Số dư hiện tại"
            description: "Tiền mặt sẵn dùng ngay bằng đồng tiền cơ sở của danh mục."
          share:
            label: "Tỷ trọng phân bổ"
            description: "Tỷ lệ phần trăm tổng giá trị danh mục đang ở dạng tiền mặt."
            value: "{percent}% danh mục"
        takeaways:
          liquidity: "Thanh khoản cơ hội: Cho phép mua ngay khi thị trường giảm mà không phải bán tài sản hiện có."
          risk: "Giảm thiểu rủi ro: Giảm biến động chung của danh mục trong các chu kỳ giá xuống."
      capitalInjected:
        title: "Vốn đã nạp"
        category: "Vốn gốc"
        short: "Tổng vốn gốc lũy kế đã nạp vào danh mục."
        full: "Vốn đã nạp theo dõi tổng phần vốn gốc (tiền nạp) bạn đã đưa vào sổ danh mục. Nó đóng vai trò mẫu số cơ sở để tính lợi nhuận trên vốn đầu tư (ROIC) thực."
        formula: "Vốn đã nạp = Tổng tiền nạp lũy kế - Tổng vốn đã rút lũy kế"
        formulaDescription: "Được tính từ mọi bản ghi giao dịch DEPOSIT và WITHDRAWAL trong danh mục."
        components:
          deposited:
            label: "Tổng vốn đã nạp"
            description: "Tổng mọi khoản nạp từ bên ngoài đã chuyển vào danh mục từ trước đến nay."
        takeaways:
          benchmark: "Mốc vốn gốc: Phân biệt phần tiết kiệm đóng góp từ bên ngoài với tăng trưởng tự nhiên từ thị trường."
          returnBase: "Cơ sở lợi nhuận: Là mẫu số cho các mô hình lợi nhuận theo trọng số tiền và trọng số thời gian chính xác."
      dividends:
        title: "Tổng cổ tức"
        category: "Chi trả"
        short: "Tổng cổ tức tiền mặt từ trước đến nay nhận được từ cổ phiếu và quỹ đang nắm giữ."
        full: "Tổng cổ tức là tổng tiền mặt chi trả trọn đời mà các cổ phiếu, ETF và REIT trả cổ tức đã trả trực tiếp vào danh mục của bạn. Khoản này có thể giữ làm thanh khoản tiền mặt hoặc tái đầu tư vào khoản nắm giữ mới."
        formula: "Tổng cổ tức = Tổng mọi giao dịch DIVIDEND đã ghi có vào tài khoản"
        formulaDescription: "Không tính phần tăng giá, chỉ tập trung vào phần lợi nhuận doanh nghiệp được chia."
        components:
          cumulative:
            label: "Cổ tức lũy kế"
            description: "Tổng cổ tức bằng tiền đã ghi có từ mọi tài sản trong danh mục."
        takeaways:
          cashFlow: "Dòng tiền thụ động: Đo khả năng chi trả tiền mặt thực của các khoản đầu tư hướng thu nhập."
          compounding: "Nhiên liệu lãi kép: Cổ tức có thể được tái đầu tư có hệ thống để đẩy nhanh tăng trưởng kép."
      topPerformer:
        title: "Tăng tốt nhất phiên"
        category: "Dẫn đầu phiên"
        short: "Tài sản riêng lẻ đang nắm giữ có mức tăng phần trăm cao nhất trong phiên hiện tại."
        full: "Xác định tài sản nổi bật trong danh mục dựa trên mức tăng phần trăm trong ngày so với giá đóng cửa chính thức phiên trước. Giúp nhận ra động lực tăng giá và mã dẫn dắt thị trường trong các khoản nắm giữ."
        formula: "Tăng tốt nhất = max( (Giá hiện tại - Giá đóng cửa phiên trước) ÷ Giá đóng cửa phiên trước ) trên mọi khoản nắm giữ"
        formulaDescription: "Được đánh giá trên mọi tài sản không phải tiền mặt đang nắm giữ trong danh mục."
        components:
          topAsset:
