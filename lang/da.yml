    defs:
      totalGain:
        title: "Samlet gevinst siden start"
        category: "Afkast"
        short: "Det samlede økonomiske nettoresultat for hele din portefølje siden start."
        full: "Dette nøgletal viser det samlede nettoresultat af din kapital. Det ser ikke kun på aktuelle urealiserede papirgevinster, men samler alle kursændringer, realiserede gevinster fra lukkede salg, udbytteudlodninger og renteudbetalinger og trækker de betalte transaktionsgebyrer fra over tid."
        formula: "Samlet gevinst = (Investeret værdi - Kostpris) + Realiseret resultat + Udbytter + Renter - Mæglergebyrer"
        formulaDescription: "Afkast % = (Samlet gevinst siden start ÷ Samlet investeret kapital) × 100"
        components:
          unrealized:
            label: "Urealiseret gevinst / tab"
            description: "Papirgevinst eller -tab på nuværende åbne positioner (Investeret værdi − Kostpris)."
          realized:
            label: "Lukket / realiseret resultat"
            description: "Nettogevinst eller -tab, der er låst fast ved salg af aktiver over tid."
          income:
            label: "Udbytter og renter"
            description: "Samlede kontante udlodninger og faste renter krediteret porteføljen."
          fees:
            label: "Transaktionsgebyrer"
            description: "Samlede kurtager og ordregebyrer fratrukket over tid."
        takeaways:
          alpha: "Reel økonomisk alfa: Vurderer den samlede skabte formue frem for blot kursændringer."
          cashFlow: "Pengestrømme medregnet: Geninvesterede eller modtagne udbytter og renter indgår fuldt ud i afkastprocenten."
          netOfFees: "Efter gebyrer: Kurtage og handelsomkostninger trækkes fra for at vise realistiske nettoafkast."
      valuation:
        title: "Porteføljens værdi"
        category: "Værdiansættelse"
        short: "Porteføljens samlede nettoværdi ved realisering til aktuelle markedskurser."
        full: "Porteføljens værdi viser den nøjagtige samlede likvide værdi af hele din investeringsportefølje lige nu. Den kombinerer markedsværdien i realtid af alle aktive værdipapirer (aktier, ETF'er, kryptovalutaer, investeringsforeninger) med dine uinvesterede kontantreserver."
        formula: "Porteføljens værdi = Beholdningernes samlede markedsværdi + Kontantreserver"
        formulaDescription: "Beholdningernes værdi beregnes ved at gange hver aktiv positions antal med den seneste markedskurs."
        components:
          holdings:
            label: "Værdi af investerede beholdninger"
            description: "Samlet aktuel værdi af alle aktive aktier, ETF'er, krypto og andre aktiver."
          cash:
            label: "Uinvesterede kontantreserver"
            description: "Likvid kontantbuffer til nye køb eller som sikker havn."
          costBasis:
            label: "Beholdningernes kostpris"
            description: "Samlet kapital brugt på at erhverve de nuværende åbne positioner."
        takeaways:
          liquidWorth: "Likvid værdi: Hvad din portefølje ville give før skat, hvis alle beholdninger blev solgt med det samme til aktuelle bud."
          multiAsset: "Flere aktivtyper samlet: Samler positioner i flere valutaer, kontantsaldi og brøkdele af aktiver."
          cashDrag: "Inkluderer kontanters træk på afkastet: Vægter likvide reserver korrekt sammen med investerede aktiver."
      todayReturn:
        title: "Dagens afkast"
        category: "Dagligt afkast"
        short: "Værdiændring i handelsdagen i forhold til forrige lukkekurs."
        full: "Dagens afkast måler det beløbsmæssige og procentvise udsving i dine aktive positioner i den aktuelle handelsdag. Det sammenligner aktuelle kurser med den forrige dags officielle lukkekurser for hver beholdning."
        formula: "Dagens afkast ($) = Summen af [ (Aktuel kurs - Forrige lukkekurs) × Antal ]"
        formulaDescription: "Dagens afkast (%) = (Dagens afkast $ ÷ Samlet værdi ved forrige lukning) × 100"
        components:
          currencyDelta:
            label: "Beløbsændring 24 t"
            description: "Absolut økonomisk gevinst eller tab i den aktuelle handelsdag."
          percentChange:
            label: "Procentvis ændring 24 t"
            description: "Procentvist afkast i forhold til værdien ved gårsdagens lukning."
          topWinner:
            label: "Dagens største vinder"
            description: "Det aktiv i din portefølje, der har klaret sig bedst i denne handelsdag."
        takeaways:
          volatility: "Daglig volatilitet: Viser, hvordan makrobegivenheder, regnskaber eller markedsbevægelser påvirkede dine beholdninger i dag."
          excludesCash: "Uden kontanter: Kun kursfølsomme værdipapirer driver det daglige afkast; kontantreserver har ingen daglig volatilitet."
          realTime: "Opdateringer i realtid: Genberegnes løbende, når nye kurser kommer ind i åbningstiden."
      realizedIncome:
        title: "Realiseret og indkomst"
        category: "Indkomst og afkast"
        short: "Samlede fastlåste kontante gevinster fra gennemførte salg, udbytter og renter."
        full: "Mens urealiserede papirgevinster stiger og falder med markedsstemningen, følger Realiseret og indkomst den varige, sikrede formue, du har hjemtaget. Det summerer alle realiserede gevinster fra solgte værdipapirer sammen med løbende indkomst fra udbytter og renter."
        formula: "Realiseret og indkomst = Resultat af lukkede salg + Samlede modtagne udbytter + Optjente faste renter"
        formulaDescription: "Resultatet af lukkede salg beregnes ved hver SELL-handel med FIFO- eller gennemsnitskostprismetoden."
        components:
          sells:
            label: "Realiserede nettosalg"
            description: "Sikrede kursgevinster fra gennemførte salgstransaktioner."
          dividends:
            label: "Modtagne udbytter"
            description: "Kontante udbetalinger fra porteføljens beholdninger direkte til dig."
          interest:
            label: "Faste renter / afkast"
            description: "Indkomst fra renter på kontanter, obligationskuponer eller udlån."
        takeaways:
          permanent: "Varig formue: Fastlåste gevinster kan ikke udviskes af fremtidige markedsfald."
          income: "Indkomstskabelse: Klart overblik over passiv indkomst fra udbyttebetalende aktiver."
          tax: "Skat og regnskab: Nyttigt til at følge årets skattepligtige kapitalbegivenheder og udbytteudlodninger."
      cashReserves:
        title: "Kontantreserver"
        category: "Likviditet"
        short: "Ikke-allokerede likvide kontanter til strategisk rebalancering eller som sikkerhed."
        full: "Kontantreserver er uinvesteret valuta i din portefølje. Denne likviditet fungerer som 'krudt i bøssen' til opportunistiske køb ved markedsfald, som nødbuffer eller i ventetid på geninvestering af udbytte."
        formula: "Kontantreserver = Samlede indskud - Samlede køb + Samlede salg + Udbytter - Hævninger - Gebyrer"
        formulaDescription: "Kontantandel (%) = (Kontantreserver ÷ Porteføljens samlede værdi) × 100"
        components:
          balance:
            label: "Aktuel saldo"
            description: "Umiddelbart tilgængelige kontanter i porteføljens basisvaluta."
          share:
            label: "Andel af fordelingen"
            description: "Den procentdel af porteføljens samlede værdi, der står i kontanter."
            value: "{percent} % af porteføljen"
        takeaways:
          liquidity: "Opportunistisk likviditet: Gør det muligt at handle straks ved markedsfald uden at sælge eksisterende aktiver."
          risk: "Risikoreduktion: Dæmper porteføljens samlede volatilitet i nedgangsperioder."
      capitalInjected:
        title: "Indskudt kapital"
        category: "Hovedstol"
        short: "Samlet hovedstol indskudt i porteføljen."
        full: "Indskudt kapital følger dine samlede indskud i porteføljens journal. Den er det økonomiske grundlag (nævneren) for beregning af det reelle afkast på investeret kapital (ROIC)."
        formula: "Indskudt kapital = Samlede indskud - Samlede hævninger af kapital"
        formulaDescription: "Beregnes ud fra alle DEPOSIT- og WITHDRAWAL-transaktioner i din portefølje."
        components:
          deposited:
            label: "Samlet indskudt kapital"
            description: "Summen af alle historiske eksterne indskud overført til porteføljen."
        takeaways:
          benchmark: "Hovedstol som målestok: Adskiller dine egne opsparingsindskud fra markedets organiske vækst."
          returnBase: "Afkastgrundlag: Danner nævneren i præcise penge- og tidsvægtede afkastmodeller."
      dividends:
        title: "Samlede udbytter"
        category: "Udlodninger"
        short: "Alle kontante udbytter modtaget fra aktie- og fondsbeholdninger."
        full: "Samlede udbytter er alle de kontante udlodninger, som udbyttebetalende aktier, ETF'er og REIT'er har udbetalt direkte til din portefølje. De kan beholdes som kontant likviditet eller geninvesteres i nye beholdninger."
        formula: "Samlede udbytter = Summen af alle DIVIDEND-transaktioner krediteret kontoen"
        formulaDescription: "Udelukker kursstigninger og fokuserer udelukkende på udlodning af virksomhedernes indtjening."
        components:
          cumulative:
            label: "Akkumulerede udbytter"
            description: "Samlede kontante udbytter krediteret på tværs af alle porteføljens aktiver."
        takeaways:
          cashFlow: "Passiv pengestrøm: Måler den reelle udbetalingsevne af dine indkomstorienterede investeringer."
          compounding: "Brændstof til renters rente: Udbytter kan geninvesteres systematisk for at øge den sammensatte vækst."
      topPerformer:
        title: "Dagens bedste aktiv"
        category: "Dagens fører"
        short: "Det enkelte aktive aktiv med den største procentvise stigning i den aktuelle handelsdag."
        full: "Finder det aktiv i din portefølje, der skiller sig ud med den største procentvise stigning i løbet af dagen i forhold til forrige officielle lukkekurs. Hjælper med at se, hvilke beholdninger der driver momentum og fører an."
        formula: "Bedste aktiv = max( (Aktuel kurs - Forrige lukkekurs) ÷ Forrige lukkekurs ) blandt alle aktive beholdninger"
        formulaDescription: "Vurderes blandt alle aktive aktiver i porteføljen, undtagen kontanter."
        components:
          topAsset:
            label: "Bedste aktiv"
            description: "Aktivets ticker og procentvise afkast i løbet af dagen."
            none: "Ingen aktive aktiepositioner"
        takeaways:
          momentum: "Momentum: Øjeblikkeligt overblik over dagens stærkeste kursstigning."
          attribution: "Afkastbidrag: Forstå, hvilken position der bærer dagens porteføljeafkast."

