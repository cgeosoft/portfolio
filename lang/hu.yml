        short: "Az értékelés egynapos változása az előző piaci záráshoz képest."
        full: "A mai hozam az aktív pozíciók pénzbeli és százalékos változását méri az aktuális kereskedési napon. Minden tételnél az aktuális árfolyamot veti össze az előző nap hivatalos záróárával."
        formula: "Mai hozam ($) = Összeg [ (Jelenlegi ár - Előző záróár) × Darabszám ]"
        formulaDescription: "Mai hozam (%) = (Mai hozam $ ÷ Az előző nap összesített záró értéke) × 100"
        components:
          currencyDelta:
            label: "24 órás pénzbeli változás"
            description: "Az aktuális kereskedési napon elért abszolút nyereség vagy veszteség."
          percentChange:
            label: "24 órás százalékos változás"
            description: "Százalékos hozam a tegnapi záró értékhez képest."
          topWinner:
            label: "A nap legnagyobb nyertese"
            description: "Az aktív portfólió legjobban teljesítő eszköze ezen a kereskedési napon."
        takeaways:
          volatility: "Napi volatilitás: megmutatja, hogyan hatottak ma a tételeire a napi makroesemények, gyorsjelentések vagy piaci mozgások."
          excludesCash: "Készpénz nélkül: csak az árérzékeny értékpapírok befolyásolják a napi hozamot; a készpénztartalék napi volatilitása nulla."
          realTime: "Valós idejű frissítés: a kereskedési órákban az új árfolyamok érkezésével folyamatosan újraszámolódik."
      realizedIncome:
        title: "Realizált és jövedelem"
        category: "Jövedelem és hozam"
        short: "A végrehajtott eladásokból, osztalékokból és hozamokból halmozottan realizált készpénznyereség."
        full: "Míg a nem realizált papíron lévő nyereség a piaci hangulattal együtt nő és csökken, a Realizált és jövedelem a véglegesen realizált, már elkönyvelt vagyont követi. Összegzi az eladott értékpapírokon realizált nyereséget, valamint az osztalékokból és kamatokból származó rendszeres jövedelmet."
        formula: "Realizált és jövedelem = Lezárt eladások PnL + Összes kapott osztalék + Kapott fix kamat"
        formulaDescription: "A lezárt eladások PnL-je minden SELL végrehajtáskor a FIFO / átlagos bekerülési érték módszerrel számolódik."
        components:
          sells:
            label: "Nettó realizált eladások"
            description: "A végrehajtott eladási tranzakciókból realizált tőkenyereség."
          dividends:
            label: "Kapott osztalékok"
            description: "A portfólió tételei által közvetlenül Önnek kifizetett készpénz."
          interest:
            label: "Fix kamat / hozamok"
            description: "Készpénzhozamból, kötvénykamatszelvényekből vagy kölcsönzésből származó jövedelem."
        takeaways:
          permanent: "Végleges vagyon: a realizált nyereséget a jövőbeli piaci esések nem tudják visszafordítani."
          income: "Jövedelemtermelés: világos kép az osztalékfizető eszközök passzív hozamáról."
          tax: "Adózás és könyvelés: hasznos az éves adóköteles tőkeesemények és osztalékok követéséhez."
      cashReserves:
        title: "Készpénztartalék"
        category: "Likviditás"
        short: "Nem allokált likvid készpénz stratégiai újrasúlyozáshoz vagy biztonsági tartalékként."
        full: "A készpénztartalék a portfólió be nem fektetett pénze. Ez a likviditás „lőszerként” szolgál a kedvező piaci esésekhez, vésztartalékként vagy az osztalékok újrabefektetésére várva."
        formula: "Készpénztartalék = Összes befizetés - Összes vétel + Összes eladás + Osztalékok - Kifizetések - Díjak"
        formulaDescription: "Készpénz súlya (%) = (Készpénztartalék ÷ A portfólió teljes értéke) × 100"
        components:
          balance:
            label: "Jelenlegi egyenleg"
            description: "Azonnal elérhető likvid készpénz a portfólió alapdevizájában."
          share:
            label: "Arány az allokációban"
