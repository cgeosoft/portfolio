          cash:
            label: "Be nem fektetett készpénztartalék"
            description: "Új vételekhez vagy biztonsági tartalékként elérhető likvid készpénz."
          costBasis:
            label: "A tételek bekerülési értéke"
            description: "A jelenleg nyitott pozíciók megszerzésére fordított teljes tőke."
        takeaways:
          liquidWorth: "Likvid érték: ennyit érne a portfólió adózás előtt, ha minden tételt azonnal eladna a jelenlegi piaci vételi árakon."
          multiAsset: "Több eszközosztály egyben: egységesen kezeli a többdevizás pozíciókat, a készpénzegyenlegeket és a tört darabszámú eszközöket."
          cashDrag: "A készpénz fékező hatásával együtt: a likvid tartalékot a befektetett eszközökkel együtt pontosan súlyozza."
      todayReturn:
        title: "Mai hozam"
