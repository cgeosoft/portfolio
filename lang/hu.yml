        title: "Befizetett tőke"
        category: "Tőke"
        short: "A portfólióba befizetett teljes halmozott tőke."
        full: "A befizetett tőke a portfólió naplójába tett összes tőkebefizetést (befizetéseket) követi. Ez a pénzügyi alap nevező a befektetett tőke valós megtérülésének (ROIC) kiszámításához."
        formula: "Befizetett tőke = Halmozott befizetések - Halmozott tőkekivonások"
        formulaDescription: "A portfólió összes DEPOSIT és WITHDRAWAL tranzakciójából számítva."
        components:
          deposited:
            label: "Összes befizetett tőke"
            description: "A portfólióba utalt összes külső befizetés összege."
        takeaways:
          benchmark: "Tőke-viszonyítási alap: elkülöníti a külső megtakarításokat a piac organikus növekedésétől."
          returnBase: "Hozamalap: ez a nevező a pontos pénzsúlyozott és időarányos hozammodellekhez."
      dividends:
        title: "Összes osztalék"
        category: "Kifizetések"
        short: "A részvény- és alaptételekből eddig kapott összes készpénzosztalék."
        full: "Az összes osztalék az osztalékfizető részvények, ETF-ek és REIT-ek által közvetlenül a portfólióba fizetett összesített készpénzkifizetéseket jelenti. Ezek készpénzként tarthatók vagy új tételekbe fektethetők."
        formula: "Összes osztalék = A számlán jóváírt összes DIVIDEND tranzakció összege"
        formulaDescription: "Az árfolyam-emelkedést nem tartalmazza, kizárólag a vállalati nyereség kifizetéseire összpontosít."
        components:
          cumulative:
            label: "Halmozott osztalékok"
            description: "A portfólió összes eszközén jóváírt pénzbeli osztalékok összege."
        takeaways:
          cashFlow: "Passzív pénzáram: a jövedelemorientált befektetések valós készpénz-kifizető képességét méri."
          compounding: "A kamatos kamat motorja: az osztalékok rendszeres újrabefektetése gyorsítja az összetett növekedést."
      topPerformer:
        title: "A nap legjobbja"
        category: "A nap vezetője"
        short: "Az az egyedi aktív eszköz, amely az aktuális kereskedési napon a legnagyobb százalékos emelkedést érte el."
        full: "Az előző hivatalos piaci záráshoz mért napon belüli százalékos emelkedés alapján azonosítja a portfólió kiemelkedő eszközét. Segít felismerni a lendületet adó és vezető tételeket."
        formula: "A nap legjobbja = max( (Jelenlegi árfolyam - Előző záróár) ÷ Előző záróár ) az összes aktív tételre"
        formulaDescription: "A portfólió összes aktív, nem készpénz eszközére értékelve."
        components:
