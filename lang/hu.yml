        takeaways:
          liquidity: "Kihasználható likviditás: piaci esésekkor azonnali vételt tesz lehetővé meglévő eszközök eladása nélkül."
          risk: "Kockázatcsökkentés: medvepiaci időszakokban mérsékli a portfólió teljes volatilitását."
