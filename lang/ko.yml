        full: "미실현 평가 이익은 시장 심리에 따라 오르내리지만, 실현 손익 및 수입은 이미 확보한 영구적인 자산을 추적합니다. 매도한 증권에서 실현한 모든 이익과 배당금 및 이자로 들어온 정기 수입을 합산합니다."
        formula: "실현 손익 및 수입 = 매도 실현 손익 + 총 수령 배당금 + 확정 이자 수입"
        formulaDescription: "매도 실현 손익은 각 SELL 체결 시 FIFO / 평균 원가법으로 계산합니다."
        components:
          sells:
            label: "순 매도 실현액"
            description: "체결된 매도 거래에서 확정된 자본 이득입니다."
          dividends:
            label: "수령 배당금"
            description: "포트폴리오 보유 종목이 직접 지급한 현금입니다."
          interest:
            label: "확정 이자 / 수익"
            description: "현금 수익, 채권 이표 또는 대여에서 얻은 수입입니다."
        takeaways:
          permanent: "영구적 자산: 확정된 이익은 향후 시장 하락으로 사라지지 않습니다."
          income: "수입 창출: 배당 자산에서 나오는 패시브 수익을 명확하게 보여 줍니다."
          tax: "세금 및 회계: 연간 과세 대상 자본 이벤트와 배당금 분배를 추적하는 데 유용합니다."
      cashReserves:
        title: "현금 보유액"
        category: "유동성"
        short: "전략적 리밸런싱이나 안전을 위해 사용할 수 있는 미배분 현금입니다."
        full: "현금 보유액은 포트폴리오에서 투자되지 않은 법정 통화를 나타냅니다. 이 유동성은 시장 하락 시 기회를 잡기 위한 '실탄', 비상 완충 자금 또는 배당금 재투자 대기 자금 역할을 합니다."
        formula: "현금 보유액 = 총 입금액 - 총 매수액 + 총 매도액 + 배당금 - 출금액 - 수수료"
        formulaDescription: "현금 비중 (%) = (현금 보유액 ÷ 총 포트폴리오 평가액) × 100"
        components:
          balance:
            label: "현재 잔액"
            description: "포트폴리오 기준 통화로 즉시 사용할 수 있는 현금입니다."
          share:
            label: "배분 비중"
            description: "전체 포트폴리오 가치 중 현금으로 보유한 비율입니다."
            value: "포트폴리오의 {percent}%"
        takeaways:
          liquidity: "기회 대응 유동성: 기존 자산을 매도하지 않고도 시장 하락 시 즉시 매수할 수 있습니다."
          risk: "위험 완화: 약세장에서 포트폴리오 전체 변동성을 줄입니다."
      capitalInjected:
        title: "투입 자본"
        category: "원금"
        short: "포트폴리오에 입금한 누적 원금 총액입니다."
        full: "투입 자본은 포트폴리오 원장에 입금한 원금(입금액) 총액을 추적합니다. 실제 투하자본수익률(ROIC)을 계산할 때 기준 분모로 사용됩니다."
        formula: "투입 자본 = 누적 입금액 - 누적 자본 출금액"
        formulaDescription: "포트폴리오의 모든 DEPOSIT 및 WITHDRAWAL 거래 기록으로 계산합니다."
        components:
          deposited:
            label: "총 입금 자본"
            description: "포트폴리오로 이체된 모든 외부 입금액의 합계입니다."
        takeaways:
          benchmark: "원금 기준: 외부에서 넣은 저축 기여분과 시장에 의한 자연 성장을 구분합니다."
          returnBase: "수익률 기준: 정확한 금액 가중 및 시간 가중 수익률 모델의 분모가 됩니다."
      dividends:
        title: "총 배당금"
        category: "분배"
        short: "주식 및 펀드 보유 종목에서 받은 전체 기간 현금 배당금입니다."
        full: "총 배당금은 배당을 지급하는 주식, ETF, 리츠(REIT)가 포트폴리오에 직접 지급한 전체 기간 현금 분배 합계입니다. 현금 유동성으로 보유하거나 새로운 종목에 재투자할 수 있습니다."
        formula: "총 배당금 = 계좌에 입금된 모든 DIVIDEND 거래의 합계"
        formulaDescription: "가격 상승분은 제외하고 기업 이익 분배만 집계합니다."
        components:
          cumulative:
            label: "누적 배당금"
            description: "모든 포트폴리오 자산에서 입금된 배당금 총액입니다."
        takeaways:
          cashFlow: "패시브 현금흐름: 수입 중심 투자의 실제 현금 지급 능력을 측정합니다."
          compounding: "복리의 원동력: 배당금을 체계적으로 재투자하면 복리 성장을 가속할 수 있습니다."
      topPerformer:
        title: "세션 최고 성과 종목"
        category: "세션 선두"
        short: "현재 시장 세션에서 상승률이 가장 높은 개별 보유 자산입니다."
        full: "전일 공식 종가 대비 장중 상승률을 기준으로 포트폴리오에서 가장 두드러진 자산을 식별합니다. 보유 종목 중 모멘텀을 이끄는 종목과 시장 주도 종목을 파악하는 데 도움이 됩니다."
        formula: "최고 성과 종목 = 모든 보유 종목 중 max( (현재 시세 - 전일 종가) ÷ 전일 종가 )"
        formulaDescription: "포트폴리오의 현금이 아닌 모든 보유 자산을 대상으로 평가합니다."
        components:
          topAsset:
            label: "최고 자산"
            description: "자산 티커와 장중 수익률입니다."
            none: "보유 중인 주식 포지션 없음"
        takeaways:
          momentum: "모멘텀 추적: 오늘 가장 강하게 상승한 자산을 바로 확인할 수 있습니다."
          attribution: "기여도: 오늘 포트폴리오 성과를 이끄는 포지션을 파악할 수 있습니다."

