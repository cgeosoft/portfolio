    live:
      sinceInception: "Avkastning: {percent} sedan start"
      invested: "Investerat: {amount}"
      costBasis: "Anskaffningsvärde: {amount}"
      dayChange: "Förändring 24 h: {arrow} {percent}"
      sellsAndDividends: "Försäljningar: {sells} | Utd.: {dividends}"
      cashShare: "{percent} % av hela portföljen"
      netDeposits: "Sammanlagda nettoinsättningar"
      cashDistributions: "Alla kontanta utdelningar"
      sessionChange: "+{percent} % förändring under handelsdagen"
      noEquities: "Inga aktiva aktier"
    defs:
      totalGain:
        title: "Total vinst sedan start"
        category: "Avkastning"
        short: "Hela portföljens ekonomiska nettoresultat sedan start."
        full: "Det här nyckeltalet visar det samlade nettoresultatet av ditt kapital. Det ser inte bara på aktuella orealiserade pappersvinster, utan sammanför alla kursförändringar, realiserade vinster från avslutade försäljningar, utdelningar och ränteutbetalningar, och drar av betalda transaktionsavgifter över tid."
        formula: "Total vinst = (Investerat värde - Anskaffningsvärde) + Realiserat resultat + Utdelningar + Räntor - Courtage"
        formulaDescription: "Avkastning % = (Total vinst sedan start ÷ Totalt investerat kapital) × 100"
        components:
          unrealized:
            label: "Orealiserad vinst / förlust"
            description: "Pappersvinst eller -förlust på nuvarande öppna positioner (Investerat värde − Anskaffningsvärde)."
          realized:
            label: "Avslutat / realiserat resultat"
            description: "Nettovinst eller -förlust som låsts in vid försäljning av tillgångar över tid."
          income:
            label: "Utdelningar och räntor"
            description: "Sammanlagda kontanta utdelningar och fasta räntor som krediterats portföljen."
          fees:
            label: "Transaktionsavgifter"
            description: "Sammanlagt courtage och orderavgifter som dragits av över tid."
        takeaways:
          alpha: "Verklig ekonomisk alfa: Bedömer den totala förmögenhet som skapats, inte bara kursförändringar."
          cashFlow: "Kassaflöden medräknade: Återinvesterade eller mottagna utdelningar och räntor ingår fullt ut i avkastningsprocenten."
          netOfFees: "Efter avgifter: Courtage och handelskostnader dras av för att visa realistisk nettoavkastning."
      valuation:
        title: "Portföljens värde"
        category: "Värdering"
        short: "Portföljens totala nettovärde vid försäljning till aktuella marknadskurser."
        full: "Portföljens värde visar det exakta totala likvida värdet av hela din investeringsportfölj just nu. Det kombinerar marknadsvärdet i realtid för alla aktiva värdepapper (aktier, ETF:er, kryptovalutor, värdepappersfonder) med dina oinvesterade kassareserver."
        formula: "Portföljens värde = Innehavens totala marknadsvärde + Kassareserver"
        formulaDescription: "Innehavens värde beräknas genom att multiplicera antalet i varje aktiv position med den senaste marknadskursen."
        components:
          holdings:
            label: "Värde av investerade innehav"
            description: "Sammanlagt aktuellt värde av alla aktiva aktier, ETF:er, krypto och andra tillgångar."
          cash:
            label: "Oinvesterade kassareserver"
            description: "Likvid kassabuffert för nya köp eller som säker hamn."
          costBasis:
            label: "Innehavens anskaffningsvärde"
            description: "Totalt kapital som använts för att köpa de nuvarande öppna positionerna."
        takeaways:
          liquidWorth: "Likvidt värde: Vad din portfölj skulle ge före skatt om alla innehav såldes omedelbart till aktuella köpkurser."
          multiAsset: "Flera tillgångsslag samlade: Sammanför positioner i flera valutor, kontantsaldon och andelar av tillgångar."
          cashDrag: "Inkluderar kontanternas effekt på avkastningen: Viktar likvida reserver korrekt tillsammans med investerade tillgångar."
      todayReturn:
        title: "Dagens avkastning"
        category: "Daglig avkastning"
        short: "Värdeförändring under handelsdagen jämfört med föregående stängningskurs."
        full: "Dagens avkastning mäter beloppsmässiga och procentuella svängningar i dina aktiva positioner under den aktuella handelsdagen. Den jämför aktuella kurser med föregående dags officiella stängningskurser för varje innehav."
        formula: "Dagens avkastning ($) = Summan av [ (Aktuell kurs - Föregående stängningskurs) × Antal ]"
        formulaDescription: "Dagens avkastning (%) = (Dagens avkastning $ ÷ Sammanlagt värde vid föregående stängning) × 100"
        components:
          currencyDelta:
            label: "Beloppsförändring 24 h"
            description: "Absolut ekonomisk vinst eller förlust under den aktuella handelsdagen."
          percentChange:
            label: "Procentuell förändring 24 h"
            description: "Procentuell avkastning jämfört med värdet vid gårdagens stängning."
          topWinner:
            label: "Dagens största vinnare"
            description: "Den tillgång i din portfölj som har gått bäst under den här handelsdagen."
        takeaways:
          volatility: "Daglig volatilitet: Visar hur makrohändelser, rapporter eller marknadsrörelser påverkade dina innehav idag."
          excludesCash: "Utan kontanter: Bara kurskänsliga värdepapper driver den dagliga avkastningen; kassareserver har ingen daglig volatilitet."
          realTime: "Uppdateringar i realtid: Beräknas löpande på nytt när nya kurser kommer in under öppettiderna."
      realizedIncome:
        title: "Realiserat och inkomster"
        category: "Inkomster och avkastning"
        short: "Sammanlagda inlåsta kontanta vinster från genomförda försäljningar, utdelningar och räntor."
        full: "Medan orealiserade pappersvinster stiger och faller med marknadsstämningen följer Realiserat och inkomster den varaktiga, säkrade förmögenhet du har tagit hem. Det summerar alla realiserade vinster från sålda värdepapper tillsammans med löpande inkomster från utdelningar och räntor."
        formula: "Realiserat och inkomster = Resultat av avslutade försäljningar + Totala mottagna utdelningar + Intjänade fasta räntor"
        formulaDescription: "Resultatet av avslutade försäljningar beräknas vid varje SELL-affär med FIFO- eller genomsnittskostnadsmetoden."
        components:
          sells:
            label: "Realiserade nettoförsäljningar"
            description: "Säkrade kursvinster från genomförda försäljningstransaktioner."
          dividends:
            label: "Mottagna utdelningar"
            description: "Kontanta utbetalningar från portföljens innehav direkt till dig."
          interest:
            label: "Fasta räntor / avkastning"
            description: "Inkomster från ränta på kontanter, obligationskuponger eller utlåning."
        takeaways:
          permanent: "Varaktig förmögenhet: Inlåsta vinster kan inte raderas av framtida marknadsnedgångar."
          income: "Inkomstgenerering: Tydlig överblick över passiva inkomster från utdelande tillgångar."
          tax: "Skatt och redovisning: Användbart för att följa årets skattepliktiga kapitalhändelser och utdelningar."
      cashReserves:
        title: "Kassareserver"
        category: "Likviditet"
        short: "Ej allokerade likvida medel för strategisk ombalansering eller som säkerhet."
        full: "Kassareserver är oinvesterade pengar i din portfölj. Likviditeten fungerar som 'torrt krut' för opportunistiska köp vid marknadsnedgångar, som nödbuffert eller i väntan på återinvestering av utdelningar."
        formula: "Kassareserver = Totala insättningar - Totala köp + Totala försäljningar + Utdelningar - Uttag - Avgifter"
        formulaDescription: "Kassaandel (%) = (Kassareserver ÷ Portföljens totala värde) × 100"
        components:
          balance:
            label: "Aktuellt saldo"
            description: "Omedelbart tillgängliga kontanter i portföljens basvaluta."
          share:
            label: "Andel av fördelningen"
            description: "Den procentuella andel av portföljens totala värde som finns i kontanter."
            value: "{percent} % av portföljen"
        takeaways:
          liquidity: "Opportunistisk likviditet: Gör det möjligt att agera direkt vid marknadsnedgångar utan att sälja befintliga tillgångar."
          risk: "Riskminskning: Dämpar portföljens totala volatilitet under nedgångsperioder."
      capitalInjected:
        title: "Insatt kapital"
        category: "Kapitalinsats"
        short: "Totalt kapital som satts in i portföljen."
        full: "Insatt kapital följer dina sammanlagda insättningar i portföljens journal. Det är den ekonomiska grunden (nämnaren) för att beräkna verklig avkastning på investerat kapital (ROIC)."
        formula: "Insatt kapital = Sammanlagda insättningar - Sammanlagda kapitaluttag"
        formulaDescription: "Beräknas utifrån alla DEPOSIT- och WITHDRAWAL-transaktioner i din portfölj."
        components:
          deposited:
            label: "Totalt insatt kapital"
            description: "Summan av alla historiska externa insättningar till portföljen."
        takeaways:
          benchmark: "Insatt kapital som måttstock: Skiljer dina egna sparinsättningar från marknadens organiska tillväxt."
          returnBase: "Avkastningsbas: Utgör nämnaren i exakta pengaviktade och tidsviktade avkastningsmodeller."
      dividends:
        title: "Totala utdelningar"
        category: "Utdelningar"
        short: "Alla kontanta utdelningar som tagits emot från aktie- och fondinnehav."
        full: "Totala utdelningar är alla kontanta utdelningar som utdelande aktier, ETF:er och REIT:ar har betalat direkt till din portfölj. De kan behållas som kontant likviditet eller återinvesteras i nya innehav."
        formula: "Totala utdelningar = Summan av alla DIVIDEND-transaktioner som krediterats kontot"
        formulaDescription: "Utesluter kursökningar och fokuserar enbart på utdelning av bolagens vinster."
        components:
          cumulative:
            label: "Ackumulerade utdelningar"
            description: "Sammanlagda kontanta utdelningar som krediterats för alla portföljens tillgångar."
        takeaways:
          cashFlow: "Passivt kassaflöde: Mäter den verkliga utbetalningsförmågan hos dina inkomstinriktade investeringar."
          compounding: "Bränsle för ränta på ränta: Utdelningar kan återinvesteras systematiskt för att öka den sammansatta tillväxten."
      topPerformer:
        title: "Dagens bästa tillgång"
        category: "Dagens ledare"
        short: "Den enskilda aktiva tillgången med störst procentuell uppgång under den aktuella handelsdagen."
        full: "Hittar den tillgång i din portfölj som sticker ut med störst procentuell uppgång under dagen jämfört med föregående officiella stängningskurs. Hjälper dig att se vilka innehav som driver momentum och leder."
        formula: "Bästa tillgång = max( (Aktuell kurs - Föregående stängningskurs) ÷ Föregående stängningskurs ) bland alla aktiva innehav"
        formulaDescription: "Bedöms bland alla aktiva tillgångar i portföljen, utom kontanter."
        components:
          topAsset:
            label: "Bästa tillgång"
            description: "Tillgångens ticker och procentuella avkastning under dagen."
            none: "Inga aktiva aktiepositioner"
        takeaways:
          momentum: "Momentum: Omedelbar överblick över dagens starkaste kursuppgång."
          attribution: "Avkastningsbidrag: Förstå vilken position som bär dagens portföljavkastning."

