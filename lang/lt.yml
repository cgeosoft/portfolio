        formula: "Bendras pelnas = (Investuota vertė - Įsigijimo vertė) + Realizuotas pelnas + Dividendai + Palūkanos - Brokerio komisiniai"
        formulaDescription: "Grąža % = (Bendras pelnas nuo pradžios ÷ Visas investuotas kapitalas) × 100"
        components:
          unrealized:
            label: "Nerealizuotas pelnas / nuostolis"
            description: "Popierinis pelnas ar nuostolis atvirose pozicijose (Investuota vertė − Įsigijimo vertė)."
          realized:
            label: "Uždarytas / realizuotas pelnas"
            description: "Grynasis pelnas ar nuostolis, užfiksuotas parduodant aktyvus laikui bėgant."
          income:
            label: "Dividendai ir palūkanos"
            description: "Sukauptos pinigų išmokos ir fiksuotas pajamingumas, įskaityti į portfelį."
          fees:
            label: "Sandorių komisiniai"
            description: "Visi brokerio komisiniai ir pavedimų mokesčiai, atskaityti laikui bėgant."
        takeaways:
          alpha: "Tikroji ekonominė alfa: vertina visą sukurtą turtą, o ne tik tikerių kainų pokyčius."
          cashFlow: "Įtraukiami pinigų srautai: reinvestuoti ar gauti dividendai ir palūkanos visiškai įskaičiuojami į grąžos procentą."
          netOfFees: "Atskaičius komisinius: brokerio komisiniai ir sandorių sąnaudos atimami, kad būtų rodoma tikroji grynoji grąža."
      valuation:
        title: "Portfelio vertė"
        category: "Vertė"
        short: "Bendra jūsų portfelio likvidacinė grynoji vertė pagal realaus laiko rinkos kotiruotes."
        full: "Portfelio vertė atspindi tikslią visą likvidžią jūsų investicinio portfelio vertę šiuo metu. Ji sujungia visų aktyvių vertybinių popierių (akcijų, ETF, kriptovaliutų, investicinių fondų) realaus laiko rinkos vertę su neinvestuotais pinigų rezervais."
        formula: "Portfelio vertė = Bendra investicijų rinkos vertė + Pinigų rezervai"
        formulaDescription: "Investicijų vertė apskaičiuojama dauginant kiekvienos aktyvios pozicijos akcijų skaičių iš naujausios rinkos kotiruotės."
        components:
          holdings:
            label: "Investicijų vertė"
            description: "Bendra visų aktyvių akcijų, ETF, kriptovaliutų ir kitų aktyvų realaus laiko vertė."
          cash:
            label: "Neinvestuoti pinigų rezervai"
            description: "Likvidus pinigų rezervas naujiems pirkimams arba kaip saugus prieglobstis."
          costBasis:
            label: "Investicijų įsigijimo vertė"
            description: "Visas kapitalas, išleistas šiuo metu atviroms pozicijoms įsigyti."
        takeaways:
          liquidWorth: "Likvidi vertė: kiek jūsų portfelis duotų prieš mokesčius, jei visos investicijos būtų nedelsiant parduotos dabartinėmis rinkos pirkimo kainomis."
          multiAsset: "Įvairių aktyvų sujungimas: sujungia pozicijas įvairiomis valiutomis, pinigų likučius ir trupmeninius aktyvus."
          cashDrag: "Įtraukiamas pinigų poveikis: tiksliai įvertina likvidžius rezervus kartu su investuotais aktyvais."
      todayReturn:
        title: "Šiandienos grąža"
        category: "Dienos grąža"
        short: "Vienos sesijos vertės pokytis, palyginti su ankstesniu rinkos uždarymu."
        full: "Šiandienos grąža matuoja jūsų aktyvių pozicijų vertės pokytį pinigais ir procentais dabartinėje prekybos sesijoje. Ji lygina realaus laiko kotiruotes su kiekvienos investicijos ankstesnės dienos oficialia uždarymo kaina."
        formula: "Šiandienos grąža ($) = Suma [ (Dabartinė kaina - Ankstesnė uždarymo kaina) × Akcijos ]"
        formulaDescription: "Šiandienos grąža (%) = (Šiandienos grąža $ ÷ Bendra ankstesnės sesijos uždarymo vertė) × 100"
        components:
          currencyDelta:
            label: "24 val. pokytis pinigais"
            description: "Absoliutus finansinis pelnas ar nuostolis dabartinėje sesijoje."
          percentChange:
            label: "24 val. pokytis procentais"
            description: "Grąža procentais, palyginti su vakarykšte uždarymo verte."
          topWinner:
            label: "Sesijos lyderis"
            description: "Geriausiai šioje sesijoje pasirodęs aktyvas jūsų portfelyje."
        takeaways:
          volatility: "Sesijos svyravimai: rodo, kaip dienos makroekonominiai įvykiai, rezultatų ataskaitos ar rinkos pokyčiai šiandien paveikė jūsų investicijas."
          excludesCash: "Be pinigų: dienos grąžą lemia tik kainai jautrūs vertybiniai popieriai; pinigų rezervų dienos svyravimai lygūs nuliui."
          realTime: "Realaus laiko atnaujinimai: perskaičiuojama, kai prekybos valandomis gaunamos naujos kotiruotės."
      realizedIncome:
        title: "Realizuota ir pajamos"
        category: "Pajamos ir pajamingumas"
        short: "Sukauptas užfiksuotas pinigų pelnas iš įvykdytų pardavimų, dividendų ir pajamingumo."
        full: "Kol nerealizuotas popierinis pelnas kyla ir krinta kartu su rinkos nuotaikomis, Realizuota ir pajamos seka nuolatinį, užfiksuotą turtą, kuris jau jūsų sąskaitoje. Jis sumuoja visą pelną iš parduotų vertybinių popierių kartu su reguliariomis dividendų ir palūkanų pajamomis."
        formula: "Realizuota ir pajamos = Uždarytų pardavimų pelnas + Visi gauti dividendai + Uždirbtos fiksuotos palūkanos"
        formulaDescription: "Uždarytų pardavimų pelnas apskaičiuojamas kiekvienam SELL sandoriui FIFO / vidutinės įsigijimo vertės metodu."
        components:
          sells:
            label: "Grynieji realizuoti pardavimai"
            description: "Užfiksuotas kapitalo prieaugis iš įvykdytų pardavimo sandorių."
          dividends:
            label: "Gauti dividendai"
            description: "Pinigų išmokos, kurias portfelio investicijos išmokėjo tiesiogiai jums."
          interest:
            label: "Fiksuotos palūkanos / pajamingumas"
            description: "Pajamos iš pinigų pajamingumo, obligacijų kuponų ar skolinimo."
        takeaways:
          permanent: "Nuolatinis turtas: užfiksuoto pelno nepanaikins būsimi rinkos nuosmukiai."
          income: "Pajamų kūrimas: aiškus vaizdas, kiek pasyvių pajamų duoda dividendus mokantys aktyvai."
          tax: "Mokesčiai ir apskaita: naudinga sekant metinius apmokestinamus kapitalo įvykius ir dividendų išmokas."
      cashReserves:
        title: "Pinigų rezervai"
        category: "Likvidumas"
        short: "Nepaskirstyti likvidūs pinigai, skirti strateginiam perbalansavimui ar saugumui."
        full: "Pinigų rezervai yra neinvestuota valiuta jūsų portfelyje. Šis likvidumas tarnauja kaip 'sausas parakas' palankiems rinkos kritimams, kaip avarinis rezervas arba laukiant dividendų reinvestavimo."
        formula: "Pinigų rezervai = Visi įnašai - Visi pirkimai + Visi pardavimai + Dividendai - Išėmimai - Komisiniai"
        formulaDescription: "Pinigų svoris (%) = (Pinigų rezervai ÷ Visa portfelio vertė) × 100"
        components:
          balance:
            label: "Dabartinis likutis"
            description: "Iškart prieinami likvidūs pinigai portfelio bazine valiuta."
          share:
            label: "Dalis paskirstyme"
            description: "Visos portfelio vertės dalis procentais, laikoma pinigais."
            value: "{percent}% portfelio"
        takeaways:
          liquidity: "Galimybių likvidumas: leidžia nedelsiant veikti rinkos nuosmukių metu neparduodant esamų aktyvų."
          risk: "Rizikos mažinimas: mažina bendrus portfelio svyravimus nuosmukio ciklais."
      capitalInjected:
        title: "Įneštas kapitalas"
        category: "Pagrindinė suma"
        short: "Visas į portfelį įneštas pagrindinis kapitalas."
        full: "Įneštas kapitalas seka visus jūsų pagrindinės sumos įnašus portfelio žurnale. Jis yra finansinė bazė (vardiklis) tikrajai investuoto kapitalo grąžai (ROIC) apskaičiuoti."
        formula: "Įneštas kapitalas = Sukaupti įnašai - Sukaupti kapitalo išėmimai"
        formulaDescription: "Apskaičiuojama iš visų DEPOSIT ir WITHDRAWAL sandorių įrašų jūsų portfelyje."
        components:
          deposited:
            label: "Iš viso įnešta kapitalo"
            description: "Visų istorinių išorinių įnašų, pervestų į portfelį, suma."
        takeaways:
          benchmark: "Pagrindinės sumos atskaitos taškas: atskiria išorinius taupymo įnašus nuo rinkos sukurto augimo."
          returnBase: "Grąžos bazė: sudaro vardiklį tiksliems pinigais ir laiku pasvertos grąžos modeliams."
      dividends:
        title: "Visi dividendai"
        category: "Išmokos"
        short: "Visų laikų pinigų dividendai, gauti iš akcijų ir fondų."
        full: "Visi dividendai yra bendros visų laikų pinigų išmokos, kurias jūsų portfeliui tiesiogiai išmokėjo dividendus mokančios akcijos, ETF ir REIT. Jas galima laikyti kaip pinigų likvidumą arba investuoti į naujas investicijas."
        formula: "Visi dividendai = Visų į sąskaitą įskaitytų DIVIDEND sandorių suma"
        formulaDescription: "Neįtraukia kainos augimo ir vertina tik įmonių pelno išmokas."
        components:
          cumulative:
            label: "Sukaupti dividendai"
            description: "Visi pinigų dividendai, įskaityti iš visų portfelio aktyvų."
        takeaways:
          cashFlow: "Pasyvūs pinigų srautai: matuoja realią į pajamas orientuotų investicijų pinigų išmokų galią."
          compounding: "Sudėtinio augimo kuras: dividendus galima sistemingai reinvestuoti, kad sudėtinis augimas paspartėtų."
      topPerformer:
        title: "Sesijos lyderis"
        category: "Sesijos lyderis"
        short: "Aktyvi investicija, kurios procentinis prieaugis dabartinėje rinkos sesijoje didžiausias."
        full: "Nustato išsiskiriantį aktyvą jūsų portfelyje pagal dienos procentinį prieaugį nuo ankstesnio oficialaus rinkos uždarymo. Padeda pastebėti momentumo variklius ir rinkos lyderius tarp jūsų investicijų."
        formula: "Lyderis = max( (Dabartinė kotiruotė - Ankstesnė uždarymo kaina) ÷ Ankstesnė uždarymo kaina ) tarp visų aktyvių investicijų"
        formulaDescription: "Vertinama tarp visų aktyvių portfelio aktyvų, išskyrus pinigus."
        components:
          topAsset:
            label: "Geriausias aktyvas"
            description: "Aktyvo tikeris ir dienos grąža procentais."
            none: "Nėra aktyvių akcijų pozicijų"
        takeaways:
          momentum: "Momentumo sekimas: iškart matomas stipriausias šiandienos aktyvo kilimas."
          attribution: "Grąžos priskyrimas: supraskite, kuri pozicija lemia šiandienos portfelio rezultatą."

