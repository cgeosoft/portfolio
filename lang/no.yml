    defs:
      totalGain:
        title: "Samlet gevinst siden start"
        category: "Avkastning"
        short: "Det samlede økonomiske nettoresultatet for hele porteføljen din siden start."
        full: "Dette nøkkeltallet viser det samlede nettoresultatet av kapitalen din. Det ser ikke bare på gjeldende urealiserte papirgevinster, men samler alle kursendringer, realiserte gevinster fra lukkede salg, utbytteutdelinger og renteutbetalinger, og trekker fra betalte transaksjonsgebyrer over tid."
        formula: "Samlet gevinst = (Investert verdi - Kostpris) + Realisert resultat + Utbytte + Renter - Meglergebyrer"
        formulaDescription: "Avkastning % = (Samlet gevinst siden start ÷ Samlet investert kapital) × 100"
        components:
          unrealized:
            label: "Urealisert gevinst / tap"
            description: "Papirgevinst eller -tap på nåværende åpne posisjoner (Investert verdi − Kostpris)."
          realized:
            label: "Lukket / realisert resultat"
            description: "Nettogevinst eller -tap som er låst inn ved salg av aktiva over tid."
          income:
            label: "Utbytte og renter"
            description: "Samlede kontantutdelinger og faste renter godskrevet porteføljen."
          fees:
            label: "Transaksjonsgebyrer"
            description: "Samlet kurtasje og ordregebyrer trukket fra over tid."
        takeaways:
          alpha: "Reell økonomisk alfa: Vurderer den samlede formuen som er skapt, ikke bare kursendringer."
          cashFlow: "Kontantstrømmer medregnet: Reinvestert eller mottatt utbytte og renter inngår fullt ut i avkastningsprosenten."
          netOfFees: "Etter gebyrer: Kurtasje og handelskostnader trekkes fra for å vise realistisk nettoavkastning."
      valuation:
        title: "Porteføljens verdi"
        category: "Verdsettelse"
        short: "Porteføljens samlede nettoverdi ved realisering til gjeldende markedskurser."
        full: "Porteføljens verdi viser den nøyaktige samlede likvide verdien av hele investeringsporteføljen din akkurat nå. Den kombinerer markedsverdien i sanntid av alle aktive verdipapirer (aksjer, ETF-er, kryptovalutaer, verdipapirfond) med de uinvesterte kontantreservene dine."
        formula: "Porteføljens verdi = Beholdningenes samlede markedsverdi + Kontantreserver"
        formulaDescription: "Beholdningenes verdi beregnes ved å multiplisere antallet i hver aktive posisjon med siste markedskurs."
        components:
          holdings:
            label: "Verdi av investerte beholdninger"
            description: "Samlet gjeldende verdi av alle aktive aksjer, ETF-er, krypto og andre aktiva."
          cash:
            label: "Uinvesterte kontantreserver"
            description: "Likvid kontantbuffer til nye kjøp eller som trygg havn."
          costBasis:
            label: "Beholdningenes kostpris"
            description: "Samlet kapital brukt på å kjøpe de nåværende åpne posisjonene."
        takeaways:
          liquidWorth: "Likvid verdi: Hva porteføljen ville gitt før skatt hvis alle beholdninger ble solgt umiddelbart til gjeldende bud."
          multiAsset: "Flere aktivatyper samlet: Samler posisjoner i flere valutaer, kontantsaldoer og brøkdeler av aktiva."
          cashDrag: "Inkluderer kontantenes demping av avkastningen: Vekter likvide reserver korrekt sammen med investerte aktiva."
      todayReturn:
        title: "Dagens avkastning"
        category: "Daglig avkastning"
        short: "Verdiendring i handelsdagen sammenlignet med forrige sluttkurs."
        full: "Dagens avkastning måler beløpsmessige og prosentvise svingninger i de aktive posisjonene dine i gjeldende handelsdag. Den sammenligner gjeldende kurser med forrige dags offisielle sluttkurser for hver beholdning."
        formula: "Dagens avkastning ($) = Summen av [ (Gjeldende kurs - Forrige sluttkurs) × Antall ]"
        formulaDescription: "Dagens avkastning (%) = (Dagens avkastning $ ÷ Samlet verdi ved forrige sluttkurs) × 100"
        components:
          currencyDelta:
            label: "Beløpsendring 24 t"
            description: "Absolutt økonomisk gevinst eller tap i gjeldende handelsdag."
          percentChange:
            label: "Prosentvis endring 24 t"
            description: "Prosentvis avkastning i forhold til verdien ved gårsdagens sluttkurs."
          topWinner:
            label: "Dagens største vinner"
            description: "Aktivumet i porteføljen din som har gjort det best i denne handelsdagen."
        takeaways:
          volatility: "Daglig volatilitet: Viser hvordan makrohendelser, resultater eller markedsbevegelser påvirket beholdningene dine i dag."
          excludesCash: "Uten kontanter: Bare kursfølsomme verdipapirer driver den daglige avkastningen; kontantreserver har ingen daglig volatilitet."
          realTime: "Oppdateringer i sanntid: Beregnes fortløpende på nytt når nye kurser kommer inn i åpningstiden."
      realizedIncome:
        title: "Realisert og inntekter"
        category: "Inntekter og avkastning"
        short: "Samlede innlåste kontantgevinster fra gjennomførte salg, utbytte og renter."
        full: "Mens urealiserte papirgevinster stiger og faller med markedsstemningen, følger Realisert og inntekter den varige, sikrede formuen du har tatt hjem. Det summerer alle realiserte gevinster fra solgte verdipapirer sammen med løpende inntekter fra utbytte og renter."
        formula: "Realisert og inntekter = Resultat av lukkede salg + Samlet mottatt utbytte + Opptjente faste renter"
        formulaDescription: "Resultatet av lukkede salg beregnes ved hver SELL-handel med FIFO- eller gjennomsnittskostmetoden."
        components:
          sells:
            label: "Realiserte nettosalg"
            description: "Sikrede kursgevinster fra gjennomførte salgstransaksjoner."
          dividends:
            label: "Mottatt utbytte"
            description: "Kontantutbetalinger fra porteføljens beholdninger direkte til deg."
          interest:
            label: "Faste renter / avkastning"
            description: "Inntekter fra renter på kontanter, obligasjonskuponger eller utlån."
        takeaways:
          permanent: "Varig formue: Innlåste gevinster kan ikke viskes ut av fremtidige markedsfall."
          income: "Inntektsskaping: Tydelig oversikt over passive inntekter fra utbyttebetalende aktiva."
          tax: "Skatt og regnskap: Nyttig for å følge årets skattepliktige kapitalhendelser og utbytteutdelinger."
      cashReserves:
        title: "Kontantreserver"
        category: "Likviditet"
        short: "Ikke-allokerte likvide kontanter til strategisk rebalansering eller som sikkerhet."
        full: "Kontantreserver er uinvestert valuta i porteføljen din. Denne likviditeten fungerer som 'tørt krutt' for opportunistiske kjøp ved markedsfall, som nødbuffer eller i påvente av reinvestering av utbytte."
        formula: "Kontantreserver = Samlede innskudd - Samlede kjøp + Samlede salg + Utbytte - Uttak - Gebyrer"
        formulaDescription: "Kontantandel (%) = (Kontantreserver ÷ Porteføljens samlede verdi) × 100"
        components:
          balance:
            label: "Gjeldende saldo"
            description: "Umiddelbart tilgjengelige kontanter i porteføljens basisvaluta."
          share:
            label: "Andel av fordelingen"
            description: "Prosentandelen av porteføljens samlede verdi som står i kontanter."
            value: "{percent} % av porteføljen"
        takeaways:
          liquidity: "Opportunistisk likviditet: Gjør det mulig å handle umiddelbart ved markedsfall uten å selge eksisterende aktiva."
          risk: "Risikoreduksjon: Demper porteføljens samlede volatilitet i nedgangsperioder."
      capitalInjected:
        title: "Innskutt kapital"
        category: "Hovedstol"
        short: "Samlet hovedstol innskutt i porteføljen."
        full: "Innskutt kapital følger de samlede innskuddene dine i porteføljejournalen. Den er det økonomiske grunnlaget (nevneren) for å beregne reell avkastning på investert kapital (ROIC)."
        formula: "Innskutt kapital = Samlede innskudd - Samlede kapitaluttak"
        formulaDescription: "Beregnes ut fra alle DEPOSIT- og WITHDRAWAL-transaksjoner i porteføljen din."
        components:
          deposited:
            label: "Samlet innskutt kapital"
            description: "Summen av alle historiske eksterne innskudd overført til porteføljen."
        takeaways:
          benchmark: "Hovedstol som målestokk: Skiller egne sparebidrag fra markedets organiske vekst."
          returnBase: "Avkastningsgrunnlag: Danner nevneren i presise penge- og tidsvektede avkastningsmodeller."
      dividends:
        title: "Samlet utbytte"
        category: "Utdelinger"
        short: "Alt kontantutbytte mottatt fra aksje- og fondsbeholdninger."
        full: "Samlet utbytte er alle kontantutdelinger som utbyttebetalende aksjer, ETF-er og REIT-er har betalt direkte til porteføljen din. De kan beholdes som kontantlikviditet eller reinvesteres i nye beholdninger."
        formula: "Samlet utbytte = Summen av alle DIVIDEND-transaksjoner godskrevet kontoen"
        formulaDescription: "Utelukker kursstigning og ser bare på utdeling av selskapenes inntjening."
        components:
          cumulative:
            label: "Akkumulert utbytte"
            description: "Samlet kontantutbytte godskrevet på tvers av alle porteføljens aktiva."
        takeaways:
          cashFlow: "Passiv kontantstrøm: Måler den reelle utbetalingsevnen til de inntektsorienterte investeringene dine."
          compounding: "Drivstoff for rentes rente: Utbytte kan reinvesteres systematisk for å øke den sammensatte veksten."
      topPerformer:
        title: "Dagens beste aktivum"
        category: "Dagens leder"
        short: "Det enkelte aktive aktivumet med størst prosentvis oppgang i gjeldende handelsdag."
        full: "Finner aktivumet i porteføljen din som skiller seg ut med størst prosentvis oppgang i løpet av dagen sammenlignet med forrige offisielle sluttkurs. Hjelper deg å se hvilke beholdninger som driver momentum og leder an."
        formula: "Beste aktivum = max( (Gjeldende kurs - Forrige sluttkurs) ÷ Forrige sluttkurs ) blant alle aktive beholdninger"
        formulaDescription: "Vurderes blant alle aktive aktiva i porteføljen, unntatt kontanter."
        components:
          topAsset:
            label: "Beste aktivum"
            description: "Aktivumets ticker og prosentvise avkastning i løpet av dagen."
            none: "Ingen aktive aksjeposisjoner"
        takeaways:
          momentum: "Momentum: Umiddelbar oversikt over dagens sterkeste kursoppgang."
          attribution: "Avkastningsbidrag: Forstå hvilken posisjon som bærer dagens porteføljeavkastning."

