    defs:
      totalGain:
        title: "Gesamtgewinn seit Beginn"
        category: "Wertentwicklung"
        short: "Wirtschaftliches Nettoergebnis Ihres gesamten Portfolios seit Beginn."
        full: "Diese Kennzahl erfasst das gesamte Nettoergebnis Ihres Kapitals. Sie betrachtet nicht nur aktuelle nicht realisierte Buchgewinne, sondern fasst alle Kursänderungen, realisierte Gewinne aus abgeschlossenen Verkäufen, Dividendenausschüttungen und Zinszahlungen zusammen und zieht die im Lauf der Zeit gezahlten Transaktionsgebühren ab."
        formula: "Gesamtgewinn = (Investierter Wert - Einstandswert) + Realisierter G/V + Dividenden + Zinsen - Brokergebühren"
        formulaDescription: "Rendite % = (Gesamtgewinn seit Beginn ÷ Gesamtes investiertes Kapital) × 100"
        components:
          unrealized:
            label: "Nicht realisierter Gewinn / Verlust"
            description: "Buchgewinn oder -verlust offener Positionen (Investierter Wert − Einstandswert)."
          realized:
            label: "Abgeschlossener / realisierter G/V"
            description: "Beim Verkauf von Werten im Lauf der Zeit gesicherter Nettogewinn oder -verlust."
          income:
            label: "Dividenden & Zinsen"
            description: "Kumulierte Barausschüttungen und Festzinsen, die dem Portfolio gutgeschrieben wurden."
          fees:
            label: "Transaktionsgebühren"
            description: "Im Lauf der Zeit abgezogene Brokerprovisionen und Ordergebühren insgesamt."
        takeaways:
          alpha: "Echtes wirtschaftliches Alpha: Bewertet das gesamte geschaffene Vermögen statt nur der Kursänderungen einzelner Ticker."
          cashFlow: "Mit Zahlungsströmen: Reinvestierte oder vereinnahmte Dividenden und Zinsen fließen vollständig in die Rendite ein."
          netOfFees: "Nach Gebühren: Brokerprovisionen und Handelskosten werden abgezogen, um realistische Nettorenditen zu zeigen."
      valuation:
        title: "Portfoliowert"
        category: "Bewertung"
        short: "Gesamter Liquidationswert Ihres Portfolios zu aktuellen Marktkursen."
        full: "Der Portfoliowert zeigt den genauen liquiden Gesamtwert Ihres gesamten Anlageportfolios in diesem Moment. Er kombiniert den aktuellen Marktwert aller aktiven Wertpapiere (Aktien, ETFs, Kryptowährungen, Investmentfonds) mit Ihren nicht investierten Barreserven."
        formula: "Portfoliowert = Gesamter Marktwert der Positionen + Barreserven"
        formulaDescription: "Der Wert der Positionen ergibt sich aus der Stückzahl jeder aktiven Position multipliziert mit ihrem neuesten Marktkurs."
        components:
          holdings:
            label: "Wert der investierten Positionen"
            description: "Aktueller Gesamtwert aller aktiven Aktien, ETFs, Kryptowerte und sonstigen Werte."
          cash:
            label: "Nicht investierte Barreserven"
            description: "Liquider Barpuffer für neue Käufe oder als sicherer Hafen."
          costBasis:
            label: "Einstandswert der Positionen"
            description: "Gesamtes Kapital, das für den Erwerb der offenen Positionen aufgewendet wurde."
        takeaways:
          liquidWorth: "Liquider Wert: Was Ihr Portfolio vor Steuern einbrächte, wenn alle Positionen sofort zu den aktuellen Geldkursen verkauft würden."
          multiAsset: "Mehrere Anlageklassen: Fasst Positionen in mehreren Währungen, Barbestände und Bruchstücke nahtlos zusammen."
          cashDrag: "Mit Cash-Drag: Gewichtet liquide Reserven korrekt neben den investierten Werten."
      todayReturn:
        title: "Heutige Rendite"
        category: "Tagesrendite"
        short: "Wertänderung im aktuellen Handelstag gegenüber dem letzten Schlusskurs."
        full: "Die heutige Rendite misst die Schwankung Ihrer aktiven Positionen im aktuellen Handelstag als Betrag und in Prozent. Sie vergleicht aktuelle Kurse mit den offiziellen Schlusskursen des Vortags für jede Position."
        formula: "Heutige Rendite ($) = Summe von [ (Aktueller Kurs - Vortagesschluss) × Stück ]"
        formulaDescription: "Heutige Rendite (%) = (Heutige Rendite $ ÷ Gesamtwert zum Vortagesschluss) × 100"
        components:
          currencyDelta:
            label: "24h-Änderung in Währung"
            description: "Absoluter Gewinn oder Verlust im aktuellen Handelstag."
          percentChange:
            label: "24h-Änderung in Prozent"
            description: "Prozentuale Rendite gegenüber dem Schlusswert des Vortags."
          topWinner:
            label: "Größter Gewinner des Tages"
            description: "Der Wert mit der besten Entwicklung in Ihrem aktiven Portfolio an diesem Handelstag."
        takeaways:
          volatility: "Tagesschwankung: Zeigt, wie Makroereignisse, Quartalszahlen oder Marktbewegungen Ihre Positionen heute beeinflusst haben."
          excludesCash: "Ohne Bargeld: Nur kursabhängige Wertpapiere bestimmen die Tagesrendite; Barreserven schwanken täglich nicht."
          realTime: "Echtzeit-Aktualisierung: Wird während der Handelszeiten bei jedem neuen Kurs dynamisch neu berechnet."
      realizedIncome:
        title: "Realisiert & Erträge"
        category: "Erträge & Rendite"
        short: "Kumulierte, gesicherte Bargewinne aus ausgeführten Verkäufen, Dividenden und Zinsen."
        full: "Während nicht realisierte Buchgewinne mit der Marktstimmung steigen und fallen, erfasst Realisiert & Erträge das dauerhaft gesicherte Vermögen, das Sie vereinnahmt haben. Die Kennzahl summiert alle realisierten Gewinne aus verkauften Wertpapieren und die laufenden Erträge aus Dividenden und Zinsen."
        formula: "Realisiert & Erträge = G/V aus Verkäufen + Erhaltene Dividenden gesamt + Erhaltene Festzinsen"
        formulaDescription: "Der G/V aus Verkäufen wird bei jeder SELL-Ausführung nach der FIFO- oder Durchschnittskostenmethode berechnet."
        components:
          sells:
            label: "Realisierte Nettoverkäufe"
            description: "Gesicherte Kursgewinne aus ausgeführten Verkäufen."
          dividends:
            label: "Erhaltene Dividenden"
            description: "Barzahlungen, die Positionen im Portfolio direkt an Sie ausgeschüttet haben."
          interest:
            label: "Festzinsen / Renditen"
            description: "Erträge aus Guthabenzinsen, Anleihekupons oder Wertpapierleihe."
        takeaways:
          permanent: "Dauerhaftes Vermögen: Gesicherte Gewinne können durch künftige Kursrückgänge nicht verloren gehen."
          income: "Erträge: Klarer Blick auf die passiven Erträge aus dividendenstarken Werten."
          tax: "Steuer & Buchhaltung: Hilfreich, um jährlich steuerpflichtige Veräußerungen und Dividendenausschüttungen zu verfolgen."
      cashReserves:
        title: "Barreserven"
        category: "Liquidität"
        short: "Nicht investiertes Bargeld für gezielte Umschichtungen oder als Sicherheit."
        full: "Barreserven sind nicht investiertes Geld in Ihrem Portfolio. Diese Liquidität dient als Reserve für Gelegenheiten bei Kursrückgängen, als Notfallpuffer oder wartet auf die Wiederanlage von Dividenden."
        formula: "Barreserven = Gesamte Einzahlungen - Gesamte Käufe + Gesamte Verkäufe + Dividenden - Auszahlungen - Gebühren"
        formulaDescription: "Baranteil (%) = (Barreserven ÷ Gesamter Portfoliowert) × 100"
        components:
          balance:
            label: "Aktueller Saldo"
            description: "Sofort verfügbares Bargeld in der Basiswährung des Portfolios."
          share:
            label: "Anteil an der Aufteilung"
            description: "Prozentualer Anteil des Gesamtportfoliowerts, der als Bargeld gehalten wird."
            value: "{percent} % des Portfolios"
        takeaways:
          liquidity: "Liquidität für Gelegenheiten: Ermöglicht sofortiges Handeln bei Kursrückgängen, ohne bestehende Werte zu verkaufen."
          risk: "Risikominderung: Dämpft die Schwankung des gesamten Portfolios in Abwärtsphasen."
      capitalInjected:
        title: "Eingezahltes Kapital"
        category: "Kapital"
        short: "Insgesamt in das Portfolio eingezahltes Kapital."
        full: "Eingezahltes Kapital erfasst Ihre gesamten Kapitaleinzahlungen in das Portfoliojournal. Es dient als Bezugsgröße (Nenner) für die Berechnung der tatsächlichen Rendite auf das investierte Kapital (ROIC)."
        formula: "Eingezahltes Kapital = Kumulierte Einzahlungen - Kumulierte Kapitalauszahlungen"
        formulaDescription: "Berechnet aus allen DEPOSIT- und WITHDRAWAL-Transaktionen in Ihrem Portfolio."
        components:
          deposited:
            label: "Gesamtes eingezahltes Kapital"
            description: "Summe aller bisherigen externen Einzahlungen in das Portfolio."
        takeaways:
          benchmark: "Kapitalbasis: Unterscheidet externe Sparbeiträge vom organischen Marktwachstum."
          returnBase: "Renditebasis: Bildet den Nenner für genaue geldgewichtete und zeitgewichtete Renditemodelle."
      dividends:
        title: "Dividenden gesamt"
        category: "Ausschüttungen"
        short: "Alle bisher erhaltenen Bardividenden aus Aktien und Fonds."
        full: "Dividenden gesamt zeigt die Summe aller Barausschüttungen, die dividendenzahlende Aktien, ETFs und REITs direkt an Ihr Portfolio gezahlt haben. Sie können als Barliquidität gehalten oder in neue Positionen investiert werden."
        formula: "Dividenden gesamt = Summe aller dem Konto gutgeschriebenen DIVIDEND-Transaktionen"
        formulaDescription: "Ohne Kurssteigerungen; berücksichtigt ausschließlich Gewinnausschüttungen der Unternehmen."
        components:
          cumulative:
            label: "Kumulierte Dividenden"
            description: "Gesamte gutgeschriebene Dividenden über alle Werte im Portfolio."
        takeaways:
          cashFlow: "Passiver Zahlungsstrom: Misst die tatsächliche Ausschüttungskraft Ihrer ertragsorientierten Anlagen."
          compounding: "Zinseszinseffekt: Dividenden lassen sich systematisch reinvestieren, um das Wachstum zu beschleunigen."
      topPerformer:
        title: "Bester Wert des Tages"
        category: "Tagesführer"
        short: "Der aktive Einzelwert mit dem höchsten prozentualen Gewinn im aktuellen Handelstag."
        full: "Ermittelt den herausragenden Wert in Ihrem Portfolio anhand des prozentualen Tagesgewinns gegenüber dem letzten offiziellen Schlusskurs. Hilft, Momentum-Treiber und Marktführer unter Ihren Positionen zu erkennen."
        formula: "Bester Wert = max( (Aktueller Kurs - Vortagesschluss) ÷ Vortagesschluss ) über alle aktiven Positionen"
        formulaDescription: "Ausgewertet über alle aktiven Werte im Portfolio außer Bargeld."
        components:
          topAsset:
            label: "Bester Wert"
            description: "Ticker des Werts und prozentuale Tagesrendite."
            none: "Keine aktiven Aktienpositionen"
        takeaways:
          momentum: "Momentum im Blick: Zeigt sofort die stärkste Kursrallye des Tages."
          attribution: "Attribution: Zeigt, welche Position die heutige Portfolioentwicklung trägt."

