        formula: "רזרבות מזומן = סך ההפקדות - סך הקניות + סך המכירות + דיבידנדים - משיכות - עמלות"
        formulaDescription: "משקל המזומן (%) = (רזרבות מזומן ÷ שווי התיק הכולל) × 100"
        components:
          balance:
            label: "יתרה נוכחית"
            description: "מזומן נזיל זמין מיד במטבע הבסיס של התיק."
          share:
            label: "חלק בהקצאה"
            description: "החלק באחוזים משווי התיק הכולל שמוחזק במזומן."
            value: "{percent}% מהתיק"
        takeaways:
          liquidity: "נזילות להזדמנויות: מאפשרת ביצוע מיידי בירידות שוק בלי למכור נכסים קיימים."
          risk: "הפחתת סיכון: ממתנת את התנודתיות הכוללת של התיק במחזורי שוק דובי."
      capitalInjected:
        title: "הון שהוזרם"
        category: "קרן"
        short: "סך הקרן המצטברת שהופקדה בתיק."
        full: "מדד 'הון שהוזרם' עוקב אחר סך ההפקדות שלך (קרן) ביומן התיק. הוא משמש כמכנה הבסיסי לחישוב התשואה האמיתית על ההון המושקע (ROIC)."
        formula: "הון שהוזרם = הפקדות מצטברות - משיכות הון מצטברות"
        formulaDescription: "מחושב מכל רשומות העסקאות מסוג DEPOSIT ו-WITHDRAWAL בתיק שלך."
        components:
          deposited:
            label: "סך ההון שהופקד"
            description: "סכום כל ההפקדות החיצוניות ההיסטוריות שהועברו לתיק."
        takeaways:
          benchmark: "ייחוס לקרן: מבחין בין הפקדות חיסכון חיצוניות לבין צמיחה אורגנית מהשוק."
          returnBase: "בסיס התשואה: משמש כמכנה למודלים מדויקים של תשואה משוקללת כסף ותשואה משוקללת זמן."
      dividends:
        title: "סך הדיבידנדים"
        category: "חלוקות"
        short: "כל תשלומי הדיבידנד במזומן שהתקבלו מאחזקות מניות וקרנות מאז ומעולם."
        full: "סך הדיבידנדים מייצג את סך חלוקות המזומן ששולמו ישירות לתיק שלך לאורך כל התקופה על ידי מניות, תעודות סל וקרנות ריט המחלקות דיבידנד. ניתן להחזיק אותם כנזילות במזומן או להשקיע אותם מחדש באחזקות חדשות."
        formula: "סך הדיבידנדים = סכום כל עסקאות DIVIDEND שזוכו לחשבון"
        formulaDescription: "לא כולל עליית מחיר ומתמקד אך ורק בחלוקות מרווחי החברות."
        components:
          cumulative:
            label: "דיבידנדים מצטברים"
            description: "סך הדיבידנדים הכספיים שזוכו מכל נכסי התיק."
        takeaways:
          cashFlow: "תזרים מזומנים פסיבי: מודד את כוח תשלום המזומן האמיתי של ההשקעות המוטות להכנסה."
          compounding: "דלק לריבית דריבית: ניתן להשקיע דיבידנדים מחדש באופן שיטתי כדי להאיץ צמיחה מצטברת."
      topPerformer:
        title: "המוביל של יום המסחר"
        category: "מוביל היום"
        short: "הנכס הפעיל הבודד עם העלייה הגבוהה ביותר באחוזים ביום המסחר הנוכחי."
        full: "מזהה את הנכס הבולט בתיק שלך לפי העלייה באחוזים במהלך היום ביחס לסגירת השוק הרשמית הקודמת. עוזר לזהות מניעי מומנטום והובלת שוק בין האחזקות שלך."
        formula: "המוביל = max( (שער נוכחי - סגירה קודמת) ÷ סגירה קודמת ) בכל האחזקות הפעילות"
        formulaDescription: "מחושב על פני כל הנכסים הפעילים שאינם מזומן בתיק."
        components:
          topAsset:
            label: "הנכס המוביל"
            description: "סימול הנכס והתשואה באחוזים במהלך היום."
            none: "אין פוזיציות מניות פעילות"
        takeaways:
          momentum: "מעקב מומנטום: תמונה מיידית של העלייה החזקה ביותר של נכס היום."
          attribution: "ייחוס: הבנה איזו פוזיציה נושאת את ביצועי התיק היום."

