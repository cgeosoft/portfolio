        short: "Zmena ocenenia počas jednej seansy oproti predchádzajúcemu zatvoreniu."
        full: "Dnešný výnos meria peňažnú a percentuálnu zmenu aktívnych pozícií počas aktuálnej obchodnej seansy. Porovnáva aktuálne ceny s oficiálnymi záverečnými cenami predchádzajúceho dňa pri každej pozícii."
        formula: "Dnešný výnos ($) = Súčet [ (Aktuálna cena - Predchádzajúca záverečná cena) × Kusy ]"
        formulaDescription: "Dnešný výnos (%) = (Dnešný výnos $ ÷ Celková hodnota pri predchádzajúcom zatvorení) × 100"
        components:
          currencyDelta:
            label: "Peňažná zmena 24h"
            description: "Absolútny zisk alebo strata v aktuálnej seanse."
          percentChange:
            label: "Percentuálna zmena 24h"
            description: "Percentuálny výnos voči oceneniu pri včerajšom zatvorení."
          topWinner:
            label: "Líder seansy"
            description: "Najvýkonnejšie aktívum vo vašom portfóliu počas tejto seansy."
        takeaways:
          volatility: "Volatilita seansy: ukazuje, ako dnešné makro udalosti, výsledky firiem alebo pohyby trhu ovplyvnili vaše pozície."
          excludesCash: "Bez hotovosti: denný výnos tvoria len cenovo citlivé cenné papiere; hotovostné rezervy majú nulovú dennú volatilitu."
          realTime: "Aktualizácie v reálnom čase: prepočítava sa, keď počas obchodných hodín prichádzajú nové ceny."
      realizedIncome:
        title: "Realizované a príjmy"
        category: "Príjmy a výnos"
        short: "Súhrnné zafixované hotovostné zisky z predajov, dividend a úrokov."
        full: "Nerealizované papierové zisky rastú a klesajú s náladou trhu, kým ukazovateľ Realizované a príjmy sleduje natrvalo zabezpečené bohatstvo. Sčítava zisky realizované z predaných cenných papierov a pravidelné príjmy z dividend a úrokov."
        formula: "Realizované a príjmy = Zisk/strata z uzavretých predajov + Celkové prijaté dividendy + Prijaté pevné úroky"
        formulaDescription: "Zisk/strata z uzavretého predaja sa počíta pri každej transakcii SELL metódou FIFO / priemernej nadobúdacej ceny."
        components:
          sells:
            label: "Čisté realizované predaje"
            description: "Realizované kapitálové zisky z vykonaných predajov."
          dividends:
            label: "Prijaté dividendy"
            description: "Hotovostné výplaty od pozícií portfólia vyplatené priamo vám."
          interest:
            label: "Pevné úroky / výnosy"
            description: "Príjem z úročenia hotovosti, kupónov dlhopisov alebo pôžičiek."
        takeaways:
          permanent: "Trvalé bohatstvo: zafixované zisky nemôžu budúce poklesy trhu vziať späť."
          income: "Tvorba príjmu: jasný prehľad o pasívnom príjme z aktív vyplácajúcich dividendy."
          tax: "Dane a účtovníctvo: užitočné na sledovanie ročných zdaniteľných udalostí a výplat dividend."
      cashReserves:
        title: "Hotovostné rezervy"
        category: "Likvidita"
        short: "Nealokovaná likvidná hotovosť na strategické rebalansovanie alebo ako rezerva."
        full: "Hotovostné rezervy predstavujú neinvestované peniaze vo vašom portfóliu. Táto likvidita slúži ako „suchý pušný prach“ na príležitosti pri prepadoch trhu, ako núdzová rezerva alebo čaká na reinvestovanie dividend."
        formula: "Hotovostné rezervy = Celkové vklady - Celkové nákupy + Celkové predaje + Dividendy - Výbery - Poplatky"
        formulaDescription: "Váha hotovosti (%) = (Hotovostné rezervy ÷ Celkové ocenenie portfólia) × 100"
        components:
          balance:
            label: "Aktuálny zostatok"
            description: "Okamžite dostupná hotovosť v základnej mene portfólia."
          share:
            label: "Podiel na alokácii"
            description: "Percentuálny podiel celkovej hodnoty portfólia držaný v hotovosti."
            value: "{percent} % portfólia"
        takeaways:
          liquidity: "Likvidita na príležitosti: umožňuje okamžite konať pri prepadoch trhu bez predaja existujúcich aktív."
          risk: "Zníženie rizika: tlmí celkovú volatilitu portfólia v medvedích fázach."
      capitalInjected:
        title: "Vložený kapitál"
        category: "Istina"
        short: "Celkový kapitál vložený do portfólia."
        full: "Vložený kapitál sleduje vaše celkové vklady istiny do denníka portfólia. Slúži ako základný menovateľ na výpočet skutočnej návratnosti investovaného kapitálu (ROIC)."
        formula: "Vložený kapitál = Súhrnné vklady - Súhrnné výbery kapitálu"
        formulaDescription: "Počíta sa zo všetkých transakcií DEPOSIT a WITHDRAWAL vo vašom portfóliu."
        components:
          deposited:
            label: "Celkovo vložený kapitál"
            description: "Súčet všetkých historických externých vkladov do portfólia."
        takeaways:
          benchmark: "Meradlo istiny: odlišuje externé vklady úspor od prirodzeného rastu trhu."
          returnBase: "Základ výnosu: tvorí menovateľ pre presné modely výnosu váženého peniazmi a časom."
      dividends:
        title: "Celkové dividendy"
        category: "Výplaty"
        short: "Všetky hotovostné dividendy prijaté z akcií a fondov."
        full: "Celkové dividendy predstavujú súhrn všetkých hotovostných výplat, ktoré do portfólia priamo vyplatili dividendové akcie, ETF a REIT. Môžu zostať ako hotovostná likvidita alebo byť investované do nových pozícií."
        formula: "Celkové dividendy = Súčet všetkých transakcií DIVIDEND pripísaných na účet"
        formulaDescription: "Nezahŕňa rast cien; zameriava sa výlučne na výplaty zo ziskov spoločností."
        components:
          cumulative:
            label: "Súhrnné dividendy"
            description: "Celková suma dividend pripísaných za všetky aktíva portfólia."
        takeaways:
          cashFlow: "Pasívny peňažný tok: meria skutočnú schopnosť vašich príjmových investícií vyplácať hotovosť."
          compounding: "Palivo pre zložené úročenie: dividendy možno systematicky reinvestovať a urýchliť tak rast."
      topPerformer:
        title: "Líder seansy"
        category: "Líder seansy"
        short: "Aktívna pozícia s najvyšším percentuálnym rastom v aktuálnej seanse."
        full: "Určuje najvýraznejšie aktívum vo vašom portfóliu podľa vnútrodenného percentuálneho rastu od predchádzajúceho oficiálneho zatvorenia. Pomáha odhaliť zdroje momenta a lídrov medzi vašimi pozíciami."
        formula: "Líder = max( (Aktuálna cena - Predchádzajúce zatvorenie) ÷ Predchádzajúce zatvorenie ) zo všetkých aktívnych pozícií"
        formulaDescription: "Vyhodnocuje sa zo všetkých aktívnych aktív portfólia okrem hotovosti."
        components:
          topAsset:
            label: "Najlepšie aktívum"
            description: "Ticker aktíva a jeho vnútrodenný percentuálny výnos."
            none: "Žiadne aktívne akciové pozície"
        takeaways:
          momentum: "Sledovanie momenta: okamžitý prehľad o dnešnom najsilnejšom raste."
          attribution: "Atribúcia: ukazuje, ktorá pozícia nesie dnešnú výkonnosť portfólia."

