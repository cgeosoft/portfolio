        full: "Dzisiejszy zwrot mierzy kwotową i procentową zmianę aktywnych pozycji w bieżącej sesji. Porównuje bieżące notowania z oficjalnymi cenami zamknięcia z poprzedniego dnia dla każdej pozycji."
        formula: "Dzisiejszy zwrot ($) = Suma [ (Bieżąca cena - Poprzednie zamknięcie) × Ilość ]"
        formulaDescription: "Dzisiejszy zwrot (%) = (Dzisiejszy zwrot $ ÷ Łączna wartość przy poprzednim zamknięciu) × 100"
        components:
          currencyDelta:
            label: "Zmiana kwotowa 24h"
            description: "Bezwzględny zysk lub strata w bieżącej sesji."
          percentChange:
            label: "Zmiana procentowa 24h"
            description: "Zwrot procentowy względem wyceny przy wczorajszym zamknięciu."
          topWinner:
            label: "Lider sesji"
            description: "Najlepsze aktywo w twoim portfelu w tej sesji."
        takeaways:
          volatility: "Zmienność sesji: pokazuje, jak dzisiejsze wydarzenia makro, wyniki spółek lub ruchy rynku wpłynęły na twoje pozycje."
          excludesCash: "Bez gotówki: dzienny zwrot tworzą tylko papiery wrażliwe na cenę; rezerwy gotówki mają zerową zmienność dzienną."
          realTime: "Aktualizacje na żywo: przelicza się, gdy w godzinach sesji napływają nowe notowania."
      realizedIncome:
        title: "Zrealizowane i dochody"
        category: "Dochody i stopa"
        short: "Łączne zablokowane zyski gotówkowe ze sprzedaży, dywidend i odsetek."
        full: "Niezrealizowane zyski rosną i spadają wraz z nastrojami rynku, a wskaźnik Zrealizowane i dochody śledzi trwale zabezpieczone bogactwo. Sumuje zyski zrealizowane ze sprzedanych papierów oraz regularne dochody z dywidend i odsetek."
        formula: "Zrealizowane i dochody = Zysk/strata z zamkniętych sprzedaży + Otrzymane dywidendy + Otrzymane odsetki"
        formulaDescription: "Zysk/strata z zamkniętej sprzedaży jest liczony przy każdej transakcji SELL metodą FIFO / średniego kosztu nabycia."
        components:
          sells:
            label: "Zrealizowane sprzedaże netto"
            description: "Zrealizowane zyski kapitałowe z wykonanych transakcji sprzedaży."
          dividends:
            label: "Otrzymane dywidendy"
            description: "Wypłaty gotówkowe od pozycji portfela przekazane bezpośrednio tobie."
          interest:
            label: "Stałe odsetki / stopy"
            description: "Dochód z oprocentowania gotówki, kuponów obligacji lub pożyczek."
        takeaways:
          permanent: "Trwałe bogactwo: zablokowanych zysków nie odwrócą przyszłe spadki rynku."
          income: "Generowanie dochodu: jasny obraz pasywnego dochodu z aktywów wypłacających dywidendy."
          tax: "Podatki i księgowość: przydatne do śledzenia rocznych zdarzeń podatkowych i wypłat dywidend."
      cashReserves:
        title: "Rezerwy gotówkowe"
        category: "Płynność"
        short: "Niealokowana płynna gotówka do strategicznego rebalansowania lub dla bezpieczeństwa."
        full: "Rezerwy gotówkowe to niezainwestowane środki w walucie w twoim portfelu. Ta płynność służy jako „suchy proch” na okazje przy spadkach rynku, bufor awaryjny lub czeka na reinwestycję dywidend."
        formula: "Rezerwy gotówkowe = Łączne wpłaty - Łączne zakupy + Łączne sprzedaże + Dywidendy - Wypłaty - Prowizje"
        formulaDescription: "Waga gotówki (%) = (Rezerwy gotówkowe ÷ Łączna wycena portfela) × 100"
        components:
          balance:
            label: "Bieżące saldo"
            description: "Natychmiast dostępna gotówka w walucie bazowej portfela."
          share:
            label: "Udział w alokacji"
            description: "Procent łącznej wartości portfela trzymany w gotówce."
            value: "{percent}% portfela"
        takeaways:
          liquidity: "Płynność na okazje: pozwala od razu działać przy spadkach rynku bez sprzedaży posiadanych aktywów."
          risk: "Ograniczanie ryzyka: tłumi ogólną zmienność portfela w okresach bessy."
      capitalInjected:
        title: "Wniesiony kapitał"
        category: "Kapitał"
        short: "Łączny kapitał wpłacony do portfela."
        full: "Wniesiony kapitał śledzi łączne wpłaty kapitału (depozyty) do rejestru portfela. Stanowi bazowy mianownik do obliczania rzeczywistego zwrotu z zainwestowanego kapitału (ROIC)."
        formula: "Wniesiony kapitał = Łączne wpłaty - Łączne wypłaty kapitału"
        formulaDescription: "Obliczany ze wszystkich transakcji DEPOSIT i WITHDRAWAL w twoim portfelu."
        components:
          deposited:
            label: "Łącznie wpłacony kapitał"
            description: "Suma wszystkich historycznych wpłat zewnętrznych do portfela."
        takeaways:
          benchmark: "Punkt odniesienia kapitału: oddziela zewnętrzne wpłaty oszczędności od organicznego wzrostu rynkowego."
          returnBase: "Baza zwrotu: stanowi mianownik dla dokładnych modeli zwrotu ważonego kapitałem i czasem."
      dividends:
        title: "Łączne dywidendy"
        category: "Wypłaty"
        short: "Wszystkie dywidendy gotówkowe otrzymane z akcji i funduszy."
        full: "Łączne dywidendy to suma wszystkich wypłat gotówkowych przekazanych bezpośrednio do portfela przez akcje, ETF-y i REIT-y wypłacające dywidendy. Mogą pozostać jako płynna gotówka lub zostać zainwestowane w nowe pozycje."
        formula: "Łączne dywidendy = Suma wszystkich transakcji DIVIDEND zaksięgowanych na koncie"
        formulaDescription: "Nie obejmuje wzrostu cen; uwzględnia wyłącznie wypłaty z zysków spółek."
        components:
          cumulative:
            label: "Łączne dywidendy"
            description: "Łączna kwota dywidend zaksięgowanych dla wszystkich aktywów portfela."
        takeaways:
          cashFlow: "Pasywny przepływ gotówki: mierzy realną zdolność wypłat gotówkowych twoich inwestycji dochodowych."
          compounding: "Paliwo procentu składanego: dywidendy można systematycznie reinwestować, by przyspieszyć wzrost."
      topPerformer:
        title: "Lider sesji"
        category: "Lider sesji"
        short: "Aktywna pozycja z najwyższym procentowym wzrostem w bieżącej sesji."
        full: "Wskazuje wyróżniające się aktywo w twoim portfelu na podstawie śróddziennego wzrostu procentowego od poprzedniego oficjalnego zamknięcia. Pomaga dostrzec źródła momentum i liderów wśród twoich pozycji."
        formula: "Lider = max( (Bieżące notowanie - Poprzednie zamknięcie) ÷ Poprzednie zamknięcie ) spośród wszystkich aktywnych pozycji"
        formulaDescription: "Oceniane spośród wszystkich aktywnych aktywów portfela poza gotówką."
        components:
          topAsset:
            label: "Najlepsze aktywo"
            description: "Ticker aktywa i jego śróddzienny zwrot procentowy."
            none: "Brak aktywnych pozycji akcyjnych"
        takeaways:
          momentum: "Śledzenie momentum: natychmiastowy wgląd w najsilniejszy dziś wzrost."
          attribution: "Atrybucja: pokazuje, która pozycja odpowiada za dzisiejszy wynik portfela."

