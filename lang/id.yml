      noEquities: "Tidak ada ekuitas aktif"
    defs:
      totalGain:
        title: "Total Keuntungan Sejak Awal"
        category: "Kinerja"
        short: "Kinerja ekonomi bersih sepanjang masa yang dihasilkan di seluruh portofolio Anda sejak awal."
        full: "Metrik ini menangkap kinerja bersih modal Anda secara menyeluruh. Metrik ini tidak hanya melihat keuntungan di atas kertas yang belum direalisasi, tetapi menggabungkan semua perubahan harga aset, laba yang direalisasi dari penjualan, distribusi dividen, pembayaran bunga, dan mengurangi biaya transaksi yang dibayar dari waktu ke waktu."
        formula: "Total Keuntungan = (Nilai Investasi - Basis Biaya) + PnL Terealisasi + Dividen + Bunga - Biaya Broker"
        formulaDescription: "Imbal Hasil % = (Total Keuntungan Sejak Awal ÷ Total Modal yang Diinvestasikan) × 100"
        components:
          unrealized:
            label: "Keuntungan / Kerugian Belum Terealisasi"
            description: "Laba atau rugi di atas kertas pada posisi yang masih terbuka (Nilai Investasi − Basis Biaya)."
          realized:
            label: "PnL Ditutup / Terealisasi"
            description: "Laba atau rugi bersih yang terkunci saat menjual aset dari waktu ke waktu."
          income:
            label: "Dividen & Bunga"
            description: "Distribusi kas kumulatif dan imbal hasil tetap yang dikreditkan ke portofolio."
          fees:
            label: "Biaya Transaksi"
            description: "Total komisi broker dan biaya order yang dipotong dari waktu ke waktu."
        takeaways:
          alpha: "Alpha Ekonomi Sejati: Mengevaluasi total kekayaan yang tercipta, bukan hanya perubahan harga ticker yang statis."
          cashFlow: "Termasuk Arus Kas: Dividen dan bunga yang diinvestasikan kembali atau diterima diperhitungkan sepenuhnya dalam persentase imbal hasil."
          netOfFees: "Setelah Biaya: Komisi broker dan gesekan perdagangan dipotong untuk menunjukkan imbal hasil bersih yang realistis."
      valuation:
        title: "Valuasi Portofolio"
        category: "Valuasi"
        short: "Total kekayaan bersih likuidasi portofolio Anda pada kuotasi pasar langsung."
        full: "Valuasi Portofolio mencerminkan total nilai likuid yang tepat dari seluruh portofolio investasi Anda saat ini. Valuasi ini menggabungkan nilai pasar real-time dari semua sekuritas aktif (saham, ETF, mata uang kripto, reksa dana) dengan cadangan kas Anda yang tidak diinvestasikan."
        formula: "Valuasi Portofolio = Total Nilai Pasar Kepemilikan + Cadangan Kas"
        formulaDescription: "Nilai Kepemilikan dihitung dengan mengalikan jumlah unit setiap posisi aktif dengan kuotasi pasar langsung terbarunya."
        components:
          holdings:
            label: "Nilai Kepemilikan yang Diinvestasikan"
            description: "Nilai langsung agregat dari semua saham, ETF, kripto, dan aset lain yang aktif."
          cash:
            label: "Cadangan Kas yang Tidak Diinvestasikan"
            description: "Penyangga kas likuid yang tersedia untuk pembelian baru atau likuiditas safe-haven."
          costBasis:
            label: "Basis Biaya Kepemilikan"
            description: "Total modal yang dikeluarkan untuk memperoleh posisi yang saat ini terbuka."
        takeaways:
          liquidWorth: "Nilai Likuid: Hasil yang akan diperoleh portofolio Anda sebelum pajak jika semua kepemilikan dilikuidasi segera pada harga penawaran pasar saat ini."
          multiAsset: "Integrasi Multi-Aset: Menggabungkan posisi multi-mata uang, saldo kas, dan aset pecahan dengan mulus."
          cashDrag: "Termasuk Cash Drag: Membobot cadangan likuid secara akurat bersama aset yang diinvestasikan."
      todayReturn:
        title: "Imbal Hasil Hari Ini"
        category: "Imbal Hasil Harian"
        short: "Selisih valuasi satu sesi dibandingkan penutupan pasar sebelumnya."
        full: "Imbal Hasil Hari Ini mengukur fluktuasi nominal dan persentase posisi aktif Anda selama sesi perdagangan saat ini. Ini membandingkan kuotasi langsung dengan harga penutupan pasar resmi hari sebelumnya untuk setiap kepemilikan."
        formula: "Imbal Hasil Hari Ini ($) = Jumlah dari [ (Harga Saat Ini - Harga Penutupan Sebelumnya) × Unit ]"
        formulaDescription: "Imbal Hasil Hari Ini (%) = (Imbal Hasil Hari Ini $ ÷ Total Nilai Penutupan Sesi Sebelumnya) × 100"
        components:
          currencyDelta:
            label: "Selisih Nominal 24 jam"
            description: "Keuntungan atau kerugian finansial absolut pada sesi saat ini."
          percentChange:
            label: "Perubahan Persentase 24 jam"
            description: "Imbal hasil persentase relatif terhadap valuasi dasar penutupan kemarin."
          topWinner:
            label: "Kenaikan Teratas Sesi"
            description: "Aset dengan kinerja terbaik di portofolio aktif Anda selama sesi ini."
        takeaways:
          volatility: "Volatilitas Sesi: Menunjukkan bagaimana peristiwa makro harian, laporan laba, atau pergeseran pasar memengaruhi kepemilikan Anda hari ini."
          excludesCash: "Tidak Termasuk Kas: Hanya sekuritas yang sensitif terhadap harga yang mendorong imbal hasil harian; cadangan kas memiliki volatilitas harian nol."
          realTime: "Pembaruan Real-time: Dihitung ulang secara dinamis saat kuotasi baru masuk selama jam pasar."
      realizedIncome:
        title: "Terealisasi & Pendapatan"
        category: "Pendapatan & Imbal Hasil"
        short: "Laba kas kumulatif yang terkunci dari penjualan yang dieksekusi, dividen, dan imbal hasil."
        full: "Sementara keuntungan di atas kertas yang belum terealisasi naik dan turun mengikuti sentimen pasar, Terealisasi & Pendapatan melacak kekayaan permanen yang sudah Anda kantongi. Ini menjumlahkan semua laba yang direalisasi dari sekuritas yang dijual bersama aliran pendapatan rutin dari dividen dan bunga."
        formula: "Terealisasi & Pendapatan = PnL Penjualan Ditutup + Total Dividen Diterima + Bunga Tetap yang Diperoleh"
        formulaDescription: "PnL Penjualan Ditutup dihitung pada setiap eksekusi SELL menggunakan metode basis biaya FIFO / rata-rata."
        components:
          sells:
            label: "Penjualan Terealisasi Bersih"
            description: "Keuntungan modal yang sudah terealisasi dari transaksi jual yang dieksekusi."
          dividends:
            label: "Dividen Diterima"
            description: "Pembayaran tunai yang dibagikan oleh kepemilikan portofolio langsung kepada Anda."
          interest:
            label: "Bunga Tetap / Imbal Hasil"
            description: "Pendapatan dari imbal hasil kas, kupon obligasi, atau pinjaman."
        takeaways:
          permanent: "Kekayaan Permanen: Keuntungan yang terkunci tidak dapat dibalikkan oleh penurunan pasar di masa depan."
          income: "Penghasil Pendapatan: Visibilitas jelas atas imbal hasil pasif dari aset yang membayar dividen."
          tax: "Pajak & Akuntansi: Berguna untuk melacak peristiwa modal kena pajak tahunan dan distribusi dividen."
      cashReserves:
        title: "Cadangan Kas"
        category: "Likuiditas"
        short: "Kas likuid yang tidak dialokasikan, tersedia untuk penyeimbangan ulang strategis atau keamanan."
        full: "Cadangan Kas mewakili mata uang fiat yang tidak diinvestasikan di portofolio Anda. Likuiditas ini berfungsi sebagai 'amunisi' untuk peluang saat pasar turun, penyangga darurat, atau menunggu investasi ulang dividen."
        formula: "Cadangan Kas = Total Setoran - Total Pembelian + Total Penjualan + Dividen - Penarikan - Biaya"
        formulaDescription: "Bobot Kas (%) = (Cadangan Kas ÷ Total Valuasi Portofolio) × 100"
        components:
          balance:
            label: "Saldo Saat Ini"
            description: "Kas likuid yang langsung tersedia dalam mata uang dasar portofolio."
          share:
            label: "Porsi Alokasi"
            description: "Proporsi persentase dari total nilai portofolio yang disimpan dalam bentuk kas."
            value: "{percent}% dari portofolio"
        takeaways:
          liquidity: "Likuiditas Oportunistik: Memungkinkan eksekusi segera saat pasar turun tanpa menjual aset yang ada."
          risk: "Mitigasi Risiko: Meredam volatilitas portofolio secara keseluruhan selama siklus bearish."
      capitalInjected:
        title: "Modal Disetor"
        category: "Pokok"
        short: "Total kumulatif modal pokok yang disetorkan ke portofolio."
        full: "Modal Disetor melacak total kontribusi pokok (setoran) Anda ke buku besar portofolio. Ini berfungsi sebagai penyebut dasar finansial untuk menghitung Return on Invested Capital (ROIC) yang sebenarnya."
        formula: "Modal Disetor = Setoran Kumulatif - Penarikan Modal Kumulatif"
        formulaDescription: "Dihitung dari semua catatan transaksi DEPOSIT dan WITHDRAWAL di portofolio Anda."
        components:
          deposited:
            label: "Total Modal Disetor"
            description: "Jumlah semua setoran eksternal historis yang ditransfer ke portofolio."
        takeaways:
          benchmark: "Tolok Ukur Pokok: Membedakan kontribusi tabungan eksternal dari pertumbuhan pasar organik."
          returnBase: "Dasar Imbal Hasil: Menjadi penyebut untuk model Imbal Hasil Tertimbang Uang dan Tertimbang Waktu yang akurat."
      dividends:
        title: "Total Dividen"
        category: "Distribusi"
        short: "Seluruh pembayaran dividen tunai yang diterima dari kepemilikan saham dan reksa dana."
        full: "Total Dividen mewakili seluruh distribusi kas yang dibayarkan langsung ke portofolio Anda oleh saham, ETF, dan REIT yang membagikan dividen. Dividen dapat disimpan sebagai likuiditas kas atau ditempatkan kembali ke kepemilikan baru."
        formula: "Total Dividen = Jumlah semua transaksi DIVIDEND yang dikreditkan ke akun"
        formulaDescription: "Tidak termasuk kenaikan harga dan berfokus hanya pada distribusi laba perusahaan."
        components:
          cumulative:
            label: "Dividen Kumulatif"
            description: "Total dividen moneter yang dikreditkan di seluruh aset portofolio."
        takeaways:
          cashFlow: "Arus Kas Pasif: Mengukur kekuatan pembayaran tunai nyata dari investasi berorientasi pendapatan Anda."
          compounding: "Bahan Bakar Pemajemukan: Dividen dapat diinvestasikan kembali secara sistematis untuk mempercepat pertumbuhan majemuk."
      topPerformer:
        title: "Kinerja Terbaik Sesi"
        category: "Pemimpin Sesi"
        short: "Aset aktif individual dengan kenaikan persentase tertinggi pada sesi pasar saat ini."
        full: "Mengidentifikasi aset yang menonjol di portofolio Anda berdasarkan kenaikan persentase intraday dari penutupan pasar resmi sebelumnya. Membantu menemukan pendorong momentum dan kepemimpinan pasar di antara kepemilikan Anda."
        formula: "Kinerja Terbaik = max( (Kuotasi Saat Ini - Penutupan Sebelumnya) ÷ Penutupan Sebelumnya ) di seluruh kepemilikan aktif"
        formulaDescription: "Dievaluasi di seluruh aset non-kas yang aktif di portofolio."
        components:
          topAsset:
            label: "Aset Teratas"
            description: "Ticker aset dan imbal hasil persentase intraday."
            none: "Tidak ada posisi ekuitas aktif"
        takeaways:
          momentum: "Pelacakan Momentum: Visibilitas instan atas reli aset terkuat hari ini."
          attribution: "Atribusi: Pahami posisi mana yang menopang kinerja portofolio hari ini."

