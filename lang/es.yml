      noEquities: "No hay acciones activas"
    defs:
      totalGain:
        title: "Ganancia total desde el inicio"
        category: "Rendimiento"
        short: "Resultado económico neto de toda tu cartera desde el inicio."
        full: "Esta métrica recoge el rendimiento neto completo de tu capital. No se limita a las plusvalías latentes actuales: suma todas las variaciones de precio, los beneficios realizados en ventas, los dividendos y los intereses cobrados, y resta las comisiones pagadas a lo largo del tiempo."
        formula: "Ganancia total = (Valor invertido - Costo base) + Resultado realizado + Dividendos + Intereses - Comisiones del bróker"
        formulaDescription: "Rentabilidad % = (Ganancia total desde el inicio ÷ Capital total invertido) × 100"
        components:
          unrealized:
            label: "Ganancia / pérdida no realizada"
            description: "Ganancia o pérdida latente de las posiciones abiertas (Valor invertido − Costo base)."
          realized:
            label: "Resultado cerrado / realizado"
            description: "Ganancia o pérdida neta consolidada al vender activos a lo largo del tiempo."
          income:
            label: "Dividendos e intereses"
            description: "Distribuciones en efectivo y rendimientos fijos acumulados abonados en la cartera."
          fees:
            label: "Comisiones de transacción"
            description: "Total de comisiones de corretaje y de órdenes descontadas a lo largo del tiempo."
        takeaways:
          alpha: "Alfa económica real: mide la riqueza total creada, no solo la variación del precio de cotización."
          cashFlow: "Incluye flujos de efectivo: los dividendos e intereses reinvertidos o cobrados se reflejan por completo en el porcentaje de rentabilidad."
          netOfFees: "Neto de comisiones: se descuentan las comisiones del bróker y los costos de negociación para mostrar una rentabilidad neta realista."
      valuation:
        title: "Valoración de la cartera"
        category: "Valoración"
        short: "Patrimonio neto total de tu cartera a precios de mercado actuales."
        full: "La valoración de la cartera refleja el valor líquido total exacto de toda tu cartera de inversión en este momento. Combina el valor de mercado en tiempo real de todos los valores activos (acciones, ETF, criptomonedas, fondos de inversión) con tus reservas de efectivo sin invertir."
        formula: "Valoración de la cartera = Valor de mercado total de las posiciones + Reservas de efectivo"
        formulaDescription: "El valor de las posiciones se calcula multiplicando la cantidad de cada posición activa por su última cotización de mercado."
        components:
          holdings:
            label: "Valor de las posiciones invertidas"
            description: "Valor actual agregado de todas las acciones, ETF, criptoactivos y demás activos."
          cash:
            label: "Reservas de efectivo sin invertir"
            description: "Colchón de efectivo disponible para nuevas compras o como refugio."
          costBasis:
            label: "Costo base de las posiciones"
            description: "Capital total invertido para adquirir las posiciones abiertas."
        takeaways:
          liquidWorth: "Valor líquido: lo que obtendría tu cartera antes de impuestos si vendieras todas las posiciones ahora mismo a los precios de compra del mercado."
          multiAsset: "Integración multiactivo: consolida posiciones en varias monedas, saldos de efectivo y fracciones de activos."
          cashDrag: "Incluye el efecto del efectivo: pondera las reservas líquidas junto con los activos invertidos."
      todayReturn:
        title: "Rentabilidad de hoy"
        category: "Rentabilidad diaria"
        short: "Variación de valoración en la sesión frente al cierre anterior del mercado."
        full: "La rentabilidad de hoy mide la variación monetaria y porcentual de tus posiciones activas en la sesión actual. Compara las cotizaciones actuales con el precio oficial de cierre del día anterior de cada posición."
        formula: "Rentabilidad de hoy ($) = Suma de [ (Precio actual - Cierre anterior) × Cantidad ]"
        formulaDescription: "Rentabilidad de hoy (%) = (Rentabilidad de hoy $ ÷ Valor agregado al cierre de la sesión anterior) × 100"
        components:
          currencyDelta:
            label: "Variación 24 h en moneda"
            description: "Ganancia o pérdida absoluta en la sesión actual."
          percentChange:
            label: "Variación porcentual 24 h"
            description: "Rentabilidad porcentual respecto a la valoración al cierre de ayer."
          topWinner:
            label: "Mayor subida de la sesión"
            description: "El activo con mejor rendimiento de tu cartera en esta sesión."
        takeaways:
          volatility: "Volatilidad de la sesión: muestra cómo afectaron hoy a tus posiciones los eventos macroeconómicos, los resultados empresariales o los movimientos del mercado."
          excludesCash: "Excluye el efectivo: solo los valores sensibles al precio generan rentabilidad diaria; las reservas de efectivo no tienen volatilidad diaria."
          realTime: "Actualización en tiempo real: se recalcula a medida que llegan nuevas cotizaciones durante el horario de mercado."
      realizedIncome:
        title: "Realizado e ingresos"
        category: "Ingresos y rentabilidad"
        short: "Ganancias en efectivo consolidadas de ventas ejecutadas, dividendos y rendimientos."
        full: "Mientras las plusvalías latentes suben y bajan con el mercado, Realizado e ingresos sigue la riqueza permanente y consolidada que ya has asegurado. Suma todos los beneficios realizados en ventas de valores junto con los ingresos periódicos de dividendos e intereses."
        formula: "Realizado e ingresos = Resultado de ventas cerradas + Dividendos totales cobrados + Intereses fijos obtenidos"
        formulaDescription: "El resultado de ventas cerradas se calcula en cada SELL con el método FIFO / costo medio."
        components:
          sells:
            label: "Ventas realizadas netas"
            description: "Plusvalías consolidadas de las ventas ejecutadas."
          dividends:
            label: "Dividendos cobrados"
            description: "Pagos en efectivo que las posiciones de la cartera te abonan directamente."
          interest:
            label: "Intereses / rendimientos fijos"
            description: "Ingresos por intereses del efectivo, cupones de bonos o préstamos."
        takeaways:
          permanent: "Riqueza permanente: las ganancias consolidadas no se pierden por futuras caídas del mercado."
          income: "Generación de ingresos: visión clara del rendimiento pasivo de los activos que pagan dividendos."
          tax: "Fiscalidad y contabilidad: útil para seguir los hechos imponibles anuales y los dividendos cobrados."
      cashReserves:
        title: "Reservas de efectivo"
        category: "Liquidez"
        short: "Efectivo líquido sin asignar disponible para rebalancear o como reserva de seguridad."
        full: "Las reservas de efectivo son el dinero sin invertir de tu cartera. Esta liquidez sirve de 'munición' para aprovechar caídas del mercado, como colchón de emergencia o a la espera de reinvertir dividendos."
        formula: "Reservas de efectivo = Depósitos totales - Compras totales + Ventas totales + Dividendos - Retiradas - Comisiones"
        formulaDescription: "Peso del efectivo (%) = (Reservas de efectivo ÷ Valoración total de la cartera) × 100"
        components:
          balance:
            label: "Saldo actual"
            description: "Efectivo disponible al instante en la moneda base de la cartera."
          share:
            label: "Peso en la cartera"
            description: "Porcentaje del valor total de la cartera que está en efectivo."
            value: "{percent}% de la cartera"
        takeaways:
          liquidity: "Liquidez para oportunidades: permite actuar de inmediato ante caídas del mercado sin vender activos."
          risk: "Reducción del riesgo: amortigua la volatilidad de la cartera en los ciclos bajistas."
      capitalInjected:
        title: "Capital aportado"
        category: "Principal"
        short: "Capital principal total depositado en la cartera."
        full: "El capital aportado sigue el total de tus aportaciones de capital (depósitos) en el registro de la cartera. Sirve como denominador base para calcular la verdadera rentabilidad sobre el capital invertido (ROIC)."
        formula: "Capital aportado = Depósitos acumulados - Retiradas de capital acumuladas"
        formulaDescription: "Se calcula a partir de todas las transacciones DEPOSIT y WITHDRAWAL de tu cartera."
        components:
          deposited:
            label: "Capital total depositado"
            description: "Suma de todos los depósitos externos transferidos a la cartera."
        takeaways:
          benchmark: "Referencia del principal: distingue el ahorro aportado del crecimiento orgánico del mercado."
          returnBase: "Base de rentabilidad: es el denominador de los modelos de rentabilidad ponderada por dinero y ponderada en el tiempo."
      dividends:
        title: "Dividendos totales"
        category: "Distribuciones"
        short: "Todos los dividendos en efectivo cobrados de acciones y fondos."
        full: "Los dividendos totales son la suma de todas las distribuciones en efectivo abonadas en tu cartera por acciones, ETF y REIT que pagan dividendos. Puedes mantenerlos como liquidez o reinvertirlos en nuevas posiciones."
        formula: "Dividendos totales = Suma de todas las transacciones DIVIDEND abonadas en la cuenta"
        formulaDescription: "Excluye la revalorización del precio y se centra solo en el reparto de beneficios empresariales."
        components:
          cumulative:
            label: "Dividendos acumulados"
            description: "Total de dividendos abonados por todos los activos de la cartera."
        takeaways:
          cashFlow: "Flujo de efectivo pasivo: mide la capacidad real de pago en efectivo de tus inversiones orientadas a ingresos."
          compounding: "Motor del interés compuesto: los dividendos se pueden reinvertir de forma sistemática para acelerar el crecimiento compuesto."
      topPerformer:
        title: "Mejor activo de la sesión"
        category: "Líder de la sesión"
        short: "El activo con la mayor subida porcentual en la sesión actual."
        full: "Identifica el activo más destacado de tu cartera según su subida porcentual intradía desde el último cierre oficial. Ayuda a detectar los motores de momento y el liderazgo entre tus posiciones."
        formula: "Mejor activo = máx( (Cotización actual - Cierre anterior) ÷ Cierre anterior ) entre todas las posiciones activas"
        formulaDescription: "Se evalúan todos los activos activos de la cartera, salvo el efectivo."
        components:
          topAsset:
            label: "Mejor activo"
            description: "Ticker del activo y su rentabilidad porcentual intradía."
            none: "No hay posiciones de renta variable activas"
        takeaways:
          momentum: "Seguimiento del momento: visión inmediata del activo con mayor subida de hoy."
          attribution: "Atribución: entiende qué posición impulsa hoy el rendimiento de la cartera."

