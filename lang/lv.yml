            label: "Darījumu komisijas"
            description: "Kopējās brokera komisijas un rīkojumu maksas, kas atskaitītas laika gaitā."
        takeaways:
          alpha: "Patiesā ekonomiskā alfa: novērtē kopējo radīto bagātību, nevis tikai tikeru cenu izmaiņas."
          cashFlow: "Ietver naudas plūsmu: reinvestētās vai saņemtās dividendes un procenti pilnībā tiek ņemti vērā ienesīguma procentos."
          netOfFees: "Pēc komisijām: brokera komisijas un darījumu izmaksas tiek atskaitītas, lai parādītu reālu neto ienesīgumu."
      valuation:
        title: "Portfeļa vērtība"
        category: "Vērtība"
        short: "Jūsu portfeļa kopējā likvidācijas neto vērtība pēc reāllaika tirgus kotācijām."
        full: "Portfeļa vērtība atspoguļo precīzu visa jūsu ieguldījumu portfeļa kopējo likvīdo vērtību šobrīd. Tā apvieno visu aktīvo vērtspapīru (akciju, ETF, kriptovalūtu, ieguldījumu fondu) reāllaika tirgus vērtību ar neieguldītajām naudas rezervēm."
        formula: "Portfeļa vērtība = Ieguldījumu kopējā tirgus vērtība + Naudas rezerves"
        formulaDescription: "Ieguldījumu vērtību aprēķina, reizinot katras aktīvās pozīcijas daļu skaitu ar tās jaunāko tirgus kotāciju."
        components:
          holdings:
            label: "Ieguldījumu vērtība"
            description: "Visu aktīvo akciju, ETF, kriptovalūtu un citu aktīvu kopējā reāllaika vērtība."
          cash:
            label: "Neieguldītās naudas rezerves"
            description: "Likvīda naudas rezerve jauniem pirkumiem vai kā drošs patvērums."
          costBasis:
            label: "Ieguldījumu iegādes vērtība"
            description: "Kopējais kapitāls, kas iztērēts pašreiz atvērto pozīciju iegādei."
        takeaways:
          liquidWorth: "Likvīdā vērtība: ko jūsu portfelis dotu pirms nodokļiem, ja visi ieguldījumi tiktu nekavējoties pārdoti par pašreizējām tirgus pirkšanas cenām."
          multiAsset: "Dažādu aktīvu apvienošana: apvieno pozīcijas dažādās valūtās, naudas atlikumus un daļējus aktīvus."
          cashDrag: "Ietver naudas ietekmi: precīzi svērtas likvīdās rezerves kopā ar ieguldītajiem aktīviem."
      todayReturn:
        title: "Šodienas ienesīgums"
        category: "Dienas ienesīgums"
        short: "Vērtības izmaiņa vienā sesijā salīdzinājumā ar iepriekšējo tirgus slēgšanu."
        full: "Šodienas ienesīgums mēra jūsu aktīvo pozīciju vērtības izmaiņu naudā un procentos pašreizējā tirdzniecības sesijā. Tas salīdzina reāllaika kotācijas ar katra ieguldījuma iepriekšējās dienas oficiālo slēgšanas cenu."
        formula: "Šodienas ienesīgums ($) = Summa no [ (Pašreizējā cena - Iepriekšējā slēgšanas cena) × Daļas ]"
        formulaDescription: "Šodienas ienesīgums (%) = (Šodienas ienesīgums $ ÷ Kopējā iepriekšējās sesijas slēgšanas vērtība) × 100"
        components:
          currencyDelta:
            label: "24h izmaiņa naudā"
            description: "Absolūtā finanšu peļņa vai zaudējumi pašreizējā sesijā."
          percentChange:
            label: "24h izmaiņa procentos"
            description: "Ienesīgums procentos attiecībā pret vakardienas slēgšanas vērtību."
          topWinner:
            label: "Sesijas līderis"
            description: "Labāko rezultātu sasniegušais aktīvs jūsu portfelī šajā sesijā."
        takeaways:
          volatility: "Sesijas svārstīgums: parāda, kā dienas makroekonomiskie notikumi, peļņas pārskati vai tirgus pārmaiņas šodien ietekmēja jūsu ieguldījumus."
          excludesCash: "Neietver naudu: dienas ienesīgumu nosaka tikai cenu jutīgi vērtspapīri; naudas rezervēm dienas svārstīgums ir nulle."
          realTime: "Reāllaika atjauninājumi: tiek pārrēķināts, kad tirdzniecības laikā pienāk jaunas kotācijas."
      realizedIncome:
        title: "Realizētais un ienākumi"
        category: "Ienākumi un ienesīgums"
        short: "Uzkrātā fiksētā naudas peļņa no veiktajiem pārdevumiem, dividendēm un ienesīguma."
        full: "Kamēr nerealizētā peļņa kāpj un krīt līdz ar tirgus noskaņojumu, Realizētais un ienākumi uzskaita pastāvīgo, fiksēto bagātību, kas jau ir jūsu kontā. Tas summē visu peļņu no pārdotajiem vērtspapīriem kopā ar regulārajiem dividenžu un procentu ienākumiem."
        formula: "Realizētais un ienākumi = Slēgto pārdevumu peļņa + Kopā saņemtās dividendes + Nopelnītie fiksētie procenti"
        formulaDescription: "Slēgto pārdevumu peļņu aprēķina katram SELL darījumam pēc FIFO / vidējās iegādes vērtības metodes."
        components:
          sells:
            label: "Neto realizētie pārdevumi"
            description: "Fiksētais kapitāla pieaugums no izpildītajiem pārdošanas darījumiem."
          dividends:
            label: "Saņemtās dividendes"
            description: "Naudas maksājumi, ko portfeļa ieguldījumi izmaksājuši tieši jums."
          interest:
            label: "Fiksētie procenti / ienesīgums"
            description: "Ienākumi no naudas ienesīguma, obligāciju kuponiem vai aizdevumiem."
        takeaways:
          permanent: "Pastāvīga bagātība: fiksēto peļņu nevar atcelt turpmāki tirgus kritumi."
          income: "Ienākumu radīšana: skaidrs pārskats par pasīvo ienesīgumu no dividendes maksājošiem aktīviem."
          tax: "Nodokļi un grāmatvedība: noderīgi, lai sekotu gada apliekamajiem kapitāla notikumiem un dividenžu izmaksām."
      cashReserves:
        title: "Naudas rezerves"
        category: "Likviditāte"
        short: "Nesadalīta likvīda nauda, kas pieejama stratēģiskai pārbalansēšanai vai drošībai."
        full: "Naudas rezerves ir neieguldītā valūta jūsu portfelī. Šī likviditāte kalpo kā 'sausais šaujampulveris' izdevīgiem tirgus kritumiem, ārkārtas rezervei vai dividenžu reinvestēšanas gaidīšanai."
        formula: "Naudas rezerves = Kopējās iemaksas - Kopējie pirkumi + Kopējie pārdevumi + Dividendes - Izmaksas - Komisijas"
        formulaDescription: "Naudas svars (%) = (Naudas rezerves ÷ Kopējā portfeļa vērtība) × 100"
        components:
          balance:
            label: "Pašreizējais atlikums"
            description: "Uzreiz pieejamā likvīdā nauda portfeļa bāzes valūtā."
          share:
            label: "Daļa sadalījumā"
            description: "Kopējās portfeļa vērtības daļa procentos, kas tiek turēta naudā."
            value: "{percent}% no portfeļa"
        takeaways:
          liquidity: "Izdevīgu iespēju likviditāte: ļauj nekavējoties rīkoties tirgus kritumos, nepārdodot esošos aktīvus."
          risk: "Riska mazināšana: samazina kopējo portfeļa svārstīgumu lejupslīdes ciklos."
      capitalInjected:
        title: "Iemaksātais kapitāls"
        category: "Pamatsumma"
        short: "Kopējais portfelī iemaksātais pamatkapitāls."
        full: "Iemaksātais kapitāls uzskaita jūsu kopējās pamatsummas iemaksas portfeļa reģistrā. Tas kalpo kā finanšu bāze (saucējs), lai aprēķinātu patieso ieguldītā kapitāla atdevi (ROIC)."
        formula: "Iemaksātais kapitāls = Uzkrātās iemaksas - Uzkrātās kapitāla izmaksas"
        formulaDescription: "Aprēķināts no visiem DEPOSIT un WITHDRAWAL darījumu ierakstiem jūsu portfelī."
        components:
          deposited:
            label: "Kopā iemaksātais kapitāls"
            description: "Visu vēsturisko ārējo iemaksu summa, kas pārskaitīta portfelī."
        takeaways:
          benchmark: "Pamatsummas atskaites punkts: atšķir ārējos uzkrājumu iemaksājumus no tirgus radītā pieauguma."
          returnBase: "Ienesīguma bāze: veido saucēju precīziem naudas svērtā un laikā svērtā ienesīguma modeļiem."
      dividends:
        title: "Kopējās dividendes"
        category: "Izmaksas"
        short: "Visu laiku saņemtās naudas dividendes no akcijām un fondiem."
        full: "Kopējās dividendes ir visu laiku kopējās naudas izmaksas, ko jūsu portfelim tieši izmaksājušas dividendes maksājošas akcijas, ETF un REIT. Tās var turēt kā naudas likviditāti vai ieguldīt jaunos ieguldījumos."
        formula: "Kopējās dividendes = Visu kontā ieskaitīto DIVIDEND darījumu summa"
        formulaDescription: "Neietver cenu pieaugumu un aplūko tikai uzņēmumu peļņas izmaksas."
        components:
          cumulative:
            label: "Uzkrātās dividendes"
            description: "Kopējās naudas dividendes, kas ieskaitītas no visiem portfeļa aktīviem."
        takeaways:
          cashFlow: "Pasīvā naudas plūsma: mēra jūsu uz ienākumiem orientēto ieguldījumu reālo naudas izmaksas spēju."
          compounding: "Saliktā pieauguma degviela: dividendes var sistemātiski reinvestēt, lai paātrinātu salikto pieaugumu."
      topPerformer:
        title: "Sesijas līderis"
        category: "Sesijas līderis"
        short: "Atsevišķs aktīvs ar lielāko procentuālo pieaugumu pašreizējā tirgus sesijā."
        full: "Nosaka izcilāko aktīvu jūsu portfelī pēc dienas procentuālā pieauguma kopš iepriekšējās oficiālās tirgus slēgšanas. Palīdz pamanīt momenta virzītājus un tirgus līderus jūsu ieguldījumos."
        formula: "Līderis = max( (Pašreizējā kotācija - Iepriekšējā slēgšanas cena) ÷ Iepriekšējā slēgšanas cena ) starp visiem aktīvajiem ieguldījumiem"
        formulaDescription: "Vērtēts starp visiem aktīvajiem portfeļa aktīviem, izņemot naudu."
        components:
          topAsset:
            label: "Labākais aktīvs"
            description: "Aktīva tikeris un dienas ienesīgums procentos."
            none: "Nav aktīvu akciju pozīciju"
        takeaways:
          momentum: "Momenta izsekošana: uzreiz redzams šodienas spēcīgākais aktīvu kāpums."
          attribution: "Ienesīguma sadalījums: saprotiet, kura pozīcija nosaka šodienas portfeļa rezultātu."

