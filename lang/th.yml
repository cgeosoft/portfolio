    defs:
      totalGain:
        title: "กำไรรวมตั้งแต่เริ่มต้น"
        category: "ผลการดำเนินงาน"
        short: "ผลการดำเนินงานทางเศรษฐกิจสุทธิทั้งหมดของพอร์ตโฟลิโอตั้งแต่เริ่มต้น"
        full: "ตัวชี้วัดนี้แสดงผลการดำเนินงานสุทธิของเงินทุนอย่างครบถ้วน ไม่ได้ดูเพียงกำไรทางบัญชีที่ยังไม่รับรู้ในปัจจุบัน แต่รวมการเปลี่ยนแปลงราคาสินทรัพย์ทั้งหมด กำไรที่รับรู้จากการขาย เงินปันผล ดอกเบี้ย และหักค่าธรรมเนียมการซื้อขายที่จ่ายไปตลอดเวลา"
        formula: "กำไรรวม = (มูลค่าที่ลงทุน - ต้นทุน) + กำไร/ขาดทุนที่รับรู้ + เงินปันผล + ดอกเบี้ย - ค่าธรรมเนียมโบรกเกอร์"
        formulaDescription: "ผลตอบแทน % = (กำไรรวมตั้งแต่เริ่มต้น ÷ เงินทุนที่ลงทุนทั้งหมด) × 100"
        components:
          unrealized:
            label: "กำไร / ขาดทุนที่ยังไม่รับรู้"
            description: "กำไรหรือขาดทุนทางบัญชีของสถานะที่เปิดอยู่ (มูลค่าที่ลงทุน − ต้นทุน)"
          realized:
            label: "กำไร/ขาดทุนที่ปิด / รับรู้แล้ว"
            description: "กำไรหรือขาดทุนสุทธิที่ล็อกไว้จากการขายสินทรัพย์ตลอดเวลา"
          income:
            label: "เงินปันผลและดอกเบี้ย"
            description: "เงินสดที่ได้รับจากการจ่ายและดอกเบี้ยคงที่สะสมที่เข้าพอร์ตโฟลิโอ"
          fees:
            label: "ค่าธรรมเนียมการซื้อขาย"
            description: "ค่านายหน้าและค่าธรรมเนียมคำสั่งทั้งหมดที่ถูกหักไปตลอดเวลา"
        takeaways:
          alpha: "อัลฟาทางเศรษฐกิจที่แท้จริง: ประเมินความมั่งคั่งทั้งหมดที่สร้างขึ้น ไม่ใช่เพียงการเปลี่ยนแปลงราคาของชื่อย่อ"
          cashFlow: "รวมกระแสเงินสด: เงินปันผลและดอกเบี้ยที่นำไปลงทุนต่อหรือรับเป็นเงินสดถูกนับรวมในเปอร์เซ็นต์ผลตอบแทนทั้งหมด"
          netOfFees: "หลังหักค่าธรรมเนียม: หักค่านายหน้าและต้นทุนการซื้อขายเพื่อแสดงผลตอบแทนสุทธิที่สมจริง"
      valuation:
        title: "มูลค่าพอร์ตโฟลิโอ"
        category: "การประเมินมูลค่า"
        short: "มูลค่าสุทธิรวมหากขายพอร์ตโฟลิโอทั้งหมดที่ราคาตลาดสด"
        full: "มูลค่าพอร์ตโฟลิโอสะท้อนมูลค่าสภาพคล่องรวมที่แท้จริงของพอร์ตการลงทุนทั้งหมดในขณะนี้ โดยรวมมูลค่าตลาดแบบเรียลไทม์ของหลักทรัพย์ทั้งหมดที่ถือ (หุ้น ETF คริปโต กองทุนรวม) กับเงินสดสำรองที่ยังไม่ได้ลงทุน"
        formula: "มูลค่าพอร์ตโฟลิโอ = มูลค่าตลาดรวมของสินทรัพย์ที่ถือ + เงินสดสำรอง"
        formulaDescription: "มูลค่าสินทรัพย์ที่ถือคำนวณจากจำนวนหุ้นของแต่ละสถานะคูณกับราคาตลาดสดล่าสุด"
        components:
          holdings:
            label: "มูลค่าสินทรัพย์ที่ลงทุน"
            description: "มูลค่าสดรวมของหุ้น ETF คริปโต และสินทรัพย์อื่นทั้งหมดที่ถืออยู่"
          cash:
            label: "เงินสดสำรองที่ยังไม่ลงทุน"
            description: "เงินสดสำรองที่พร้อมใช้สำหรับการซื้อใหม่หรือเป็นสภาพคล่องที่ปลอดภัย"
          costBasis:
            label: "ต้นทุนของสินทรัพย์ที่ถือ"
            description: "เงินทุนทั้งหมดที่ใช้ซื้อสถานะที่เปิดอยู่ในปัจจุบัน"
        takeaways:
          liquidWorth: "มูลค่าสภาพคล่อง: จำนวนเงินก่อนภาษีที่พอร์ตโฟลิโอจะได้รับหากขายสินทรัพย์ที่ถือทั้งหมดทันทีที่ราคาเสนอซื้อในตลาดปัจจุบัน"
          multiAsset: "รวมหลายสินทรัพย์: รวมสถานะหลายสกุลเงิน ยอดเงินสด และสินทรัพย์เศษหน่วยเข้าด้วยกันอย่างราบรื่น"
          cashDrag: "รวมผลกระทบของเงินสด: ถ่วงน้ำหนักเงินสำรองควบคู่กับสินทรัพย์ที่ลงทุนอย่างแม่นยำ"
      todayReturn:
        title: "ผลตอบแทนวันนี้"
        category: "ผลตอบแทนรายวัน"
        short: "การเปลี่ยนแปลงมูลค่าในรอบการซื้อขายเดียวเทียบกับราคาปิดครั้งก่อน"
        full: "ผลตอบแทนวันนี้วัดการเปลี่ยนแปลงเป็นจำนวนเงินและเปอร์เซ็นต์ของสถานะที่ถืออยู่ในรอบการซื้อขายปัจจุบัน โดยเปรียบเทียบราคาสดกับราคาปิดอย่างเป็นทางการของวันก่อนหน้าสำหรับแต่ละสินทรัพย์ที่ถือ"
        formula: "ผลตอบแทนวันนี้ ($) = ผลรวมของ [ (ราคาปัจจุบัน - ราคาปิดครั้งก่อน) × จำนวนหุ้น ]"
        formulaDescription: "ผลตอบแทนวันนี้ (%) = (ผลตอบแทนวันนี้ $ ÷ มูลค่ารวม ณ ราคาปิดรอบก่อน) × 100"
        components:
          currencyDelta:
            label: "การเปลี่ยนแปลงเป็นเงิน 24 ชม."
            description: "กำไรหรือขาดทุนทางการเงินสัมบูรณ์ในรอบการซื้อขายปัจจุบัน"
          percentChange:
            label: "การเปลี่ยนแปลงเป็นเปอร์เซ็นต์ 24 ชม."
            description: "ผลตอบแทนเป็นเปอร์เซ็นต์เทียบกับมูลค่าฐาน ณ ราคาปิดเมื่อวาน"
          topWinner:
            label: "ขึ้นมากที่สุดในรอบนี้"
            description: "สินทรัพย์ที่มีผลการดำเนินงานดีที่สุดในพอร์ตโฟลิโอของคุณในรอบนี้"
        takeaways:
          volatility: "ความผันผวนในรอบ: แสดงว่าเหตุการณ์เศรษฐกิจมหภาค รายงานผลประกอบการ หรือการเปลี่ยนแปลงของตลาดในวันนี้ส่งผลต่อสินทรัพย์ที่ถืออย่างไร"
          excludesCash: "ไม่รวมเงินสด: มีเพียงหลักทรัพย์ที่อ่อนไหวต่อราคาเท่านั้นที่ส่งผลต่อผลตอบแทนรายวัน เงินสดสำรองมีความผันผวนรายวันเป็นศูนย์"
          realTime: "อัปเดตแบบเรียลไทม์: คำนวณใหม่เมื่อมีราคาใหม่เข้ามาระหว่างเวลาทำการของตลาด"
      realizedIncome:
        title: "กำไรที่รับรู้และรายได้"
        category: "รายได้และอัตราผลตอบแทน"
        short: "กำไรเงินสดสะสมที่ล็อกไว้แล้วจากการขาย เงินปันผล และผลตอบแทน"
        full: "ขณะที่กำไรทางบัญชีที่ยังไม่รับรู้ขึ้นลงตามอารมณ์ตลาด กำไรที่รับรู้และรายได้จะติดตามความมั่งคั่งถาวรที่คุณได้รับมาแล้วจริง โดยรวมกำไรทั้งหมดที่รับรู้จากหลักทรัพย์ที่ขายไปกับรายได้ประจำจากเงินปันผลและดอกเบี้ย"
        formula: "กำไรที่รับรู้และรายได้ = กำไร/ขาดทุนจากการขาย + เงินปันผลที่ได้รับทั้งหมด + ดอกเบี้ยคงที่ที่ได้รับ"
        formulaDescription: "กำไร/ขาดทุนจากการขายคำนวณในแต่ละคำสั่ง SELL ด้วยวิธี FIFO / ต้นทุนเฉลี่ย"
        components:
          sells:
            label: "กำไรสุทธิที่รับรู้จากการขาย"
            description: "กำไรจากส่วนต่างราคาที่ได้รับจริงจากธุรกรรมขายที่ดำเนินการแล้ว"
          dividends:
            label: "เงินปันผลที่ได้รับ"
            description: "เงินสดที่สินทรัพย์ในพอร์ตโฟลิโอจ่ายให้คุณโดยตรง"
          interest:
            label: "ดอกเบี้ยคงที่ / ผลตอบแทน"
            description: "รายได้จากผลตอบแทนเงินสด คูปองพันธบัตร หรือการให้กู้ยืม"
        takeaways:
          permanent: "ความมั่งคั่งถาวร: กำไรที่ล็อกไว้แล้วไม่สามารถถูกลบล้างด้วยตลาดขาลงในอนาคต"
          income: "การสร้างรายได้: เห็นชัดเจนถึงผลตอบแทนแบบพาสซีฟจากสินทรัพย์ที่จ่ายเงินปันผล"
          tax: "ภาษีและบัญชี: มีประโยชน์ในการติดตามเหตุการณ์ทางทุนที่ต้องเสียภาษีและการจ่ายเงินปันผลรายปี"
      cashReserves:
        title: "เงินสดสำรอง"
        category: "สภาพคล่อง"
        short: "เงินสดที่ยังไม่จัดสรร พร้อมใช้สำหรับการปรับสมดุลเชิงกลยุทธ์หรือเพื่อความปลอดภัย"
        full: "เงินสดสำรองคือเงินตราที่ยังไม่ได้ลงทุนในพอร์ตโฟลิโอของคุณ สภาพคล่องนี้ทำหน้าที่เป็น 'กระสุน' สำหรับโอกาสเมื่อตลาดย่อตัว เป็นเงินสำรองฉุกเฉิน หรือรอการนำเงินปันผลไปลงทุนต่อ"
        formula: "เงินสดสำรอง = เงินฝากรวม - การซื้อรวม + การขายรวม + เงินปันผล - การถอน - ค่าธรรมเนียม"
        formulaDescription: "น้ำหนักเงินสด (%) = (เงินสดสำรอง ÷ มูลค่าพอร์ตโฟลิโอรวม) × 100"
        components:
          balance:
            label: "ยอดคงเหลือปัจจุบัน"
            description: "เงินสดที่ใช้ได้ทันทีในสกุลเงินหลักของพอร์ตโฟลิโอ"
          share:
            label: "สัดส่วนการจัดสรร"
            description: "สัดส่วนเปอร์เซ็นต์ของมูลค่าพอร์ตโฟลิโอทั้งหมดที่ถือเป็นเงินสด"
            value: "{percent}% ของพอร์ตโฟลิโอ"
        takeaways:
          liquidity: "สภาพคล่องเพื่อโอกาส: ซื้อได้ทันทีเมื่อตลาดปรับลดโดยไม่ต้องขายสินทรัพย์ที่มีอยู่"
          risk: "ลดความเสี่ยง: ลดความผันผวนโดยรวมของพอร์ตโฟลิโอในช่วงตลาดขาลง"
      capitalInjected:
        title: "เงินทุนที่ใส่เข้า"
        category: "เงินต้น"
        short: "เงินต้นสะสมทั้งหมดที่ฝากเข้าพอร์ตโฟลิโอ"
        full: "เงินทุนที่ใส่เข้าติดตามเงินต้นทั้งหมดที่คุณฝาก (เงินฝาก) เข้าสมุดบัญชีพอร์ตโฟลิโอ ใช้เป็นตัวหารฐานในการคำนวณผลตอบแทนจากเงินลงทุน (ROIC) ที่แท้จริง"
        formula: "เงินทุนที่ใส่เข้า = เงินฝากสะสม - เงินทุนที่ถอนสะสม"
        formulaDescription: "คำนวณจากบันทึกธุรกรรม DEPOSIT และ WITHDRAWAL ทั้งหมดในพอร์ตโฟลิโอ"
        components:
          deposited:
            label: "เงินทุนที่ฝากทั้งหมด"
            description: "ผลรวมของเงินฝากจากภายนอกทั้งหมดที่โอนเข้าพอร์ตโฟลิโอ"
        takeaways:
          benchmark: "ฐานเงินต้น: แยกเงินออมที่ใส่เพิ่มจากภายนอกออกจากการเติบโตตามธรรมชาติของตลาด"
          returnBase: "ฐานผลตอบแทน: เป็นตัวหารสำหรับแบบจำลองผลตอบแทนถ่วงน้ำหนักด้วยเงินและถ่วงน้ำหนักด้วยเวลาที่แม่นยำ"
      dividends:
        title: "เงินปันผลรวม"
        category: "การจ่ายผลตอบแทน"
        short: "เงินปันผลเงินสดทั้งหมดที่ได้รับจากหุ้นและกองทุนที่ถือตลอดเวลา"
        full: "เงินปันผลรวมคือผลรวมเงินสดที่หุ้น ETF และ REIT ที่จ่ายเงินปันผลได้จ่ายเข้าพอร์ตโฟลิโอของคุณโดยตรงตลอดอายุการลงทุน สามารถเก็บไว้เป็นสภาพคล่องเงินสดหรือนำไปลงทุนในสินทรัพย์ใหม่"
        formula: "เงินปันผลรวม = ผลรวมของธุรกรรม DIVIDEND ทั้งหมดที่เข้าบัญชี"
        formulaDescription: "ไม่รวมการเพิ่มขึ้นของราคา มุ่งเฉพาะการแบ่งกำไรของบริษัท"
        components:
          cumulative:
            label: "เงินปันผลสะสม"
            description: "เงินปันผลทั้งหมดที่เข้าบัญชีจากสินทรัพย์ทุกตัวในพอร์ตโฟลิโอ"
        takeaways:
          cashFlow: "กระแสเงินสดแบบพาสซีฟ: วัดความสามารถในการจ่ายเงินสดจริงของการลงทุนที่เน้นรายได้"
          compounding: "เชื้อเพลิงของดอกเบี้ยทบต้น: นำเงินปันผลไปลงทุนต่ออย่างเป็นระบบเพื่อเร่งการเติบโตแบบทบต้น"
      topPerformer:
        title: "ผลงานดีที่สุดในรอบ"
        category: "ผู้นำในรอบ"
        short: "สินทรัพย์รายตัวที่ถืออยู่ซึ่งมีเปอร์เซ็นต์กำไรสูงสุดในรอบการซื้อขายปัจจุบัน"
        full: "ระบุสินทรัพย์ที่โดดเด่นในพอร์ตโฟลิโอของคุณจากเปอร์เซ็นต์กำไรระหว่างวันเทียบกับราคาปิดอย่างเป็นทางการครั้งก่อน ช่วยให้เห็นตัวขับเคลื่อนโมเมนตัมและผู้นำตลาดในสินทรัพย์ที่ถือ"
        formula: "ผลงานดีที่สุด = max( (ราคาปัจจุบัน - ราคาปิดครั้งก่อน) ÷ ราคาปิดครั้งก่อน ) จากสินทรัพย์ที่ถือทั้งหมด"
        formulaDescription: "ประเมินจากสินทรัพย์ที่ไม่ใช่เงินสดทั้งหมดที่ถืออยู่ในพอร์ตโฟลิโอ"
        components:
          topAsset:
            label: "สินทรัพย์อันดับหนึ่ง"
            description: "ชื่อย่อของสินทรัพย์และผลตอบแทนระหว่างวันเป็นเปอร์เซ็นต์"
            none: "ไม่มีสถานะหุ้นที่ถืออยู่"
        takeaways:
          momentum: "ติดตามโมเมนตัม: เห็นทันทีว่าสินทรัพย์ใดปรับขึ้นแรงที่สุดวันนี้"
          attribution: "การวิเคราะห์ที่มา: เข้าใจว่าสถานะใดกำลังขับเคลื่อนผลการดำเนินงานของพอร์ตโฟลิโอวันนี้"

