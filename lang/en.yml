# English interface text: the source for every other lang/<code>.yml.
# Format (modules/shared/src/i18n.ts): nested maps, two spaces per level,
# values in double quotes, {name} placeholders, plurals as one/other children.
# Each section below belongs to one area of the app; keep keys in their section.

# ── common: words many screens share ──────────────────────────────────────
common:
  add: "Add"
  all: "All"
  apply: "Apply"
  back: "Back"
  cancel: "Cancel"
  close: "Close"
  confirm: "Confirm"
  continue: "Continue"
  copy: "Copy"
  copied: "Copied"
  delete: "Delete"
  done: "Done"
  download: "Download"
  edit: "Edit"
  error: "Error"
  export: "Export"
  import: "Import"
  learnMore: "Learn more"
  loading: "Loading…"
  next: "Next"
  no: "No"
  none: "None"
  ok: "OK"
  optional: "Optional"
  refresh: "Refresh"
  remove: "Remove"
  reset: "Reset"
  retry: "Retry"
  save: "Save"
  saving: "Saving…"
  search: "Search"
  unknown: "Unknown"
  yes: "Yes"

# ── language: the language picker ─────────────────────────────────────────
language:
  label: "Language"
  description: "Language of the interface, the AI reports, the assistant and the notifications. Portfolio reloads to apply it."
  tierShort: "Tier {tier}"
  tier1: "Every major AI model family supports this language."
  tier2: "Most AI model families support this language."
  tier3: "Some AI model families support this language; reports may read less naturally."
  tier4: "Few AI model families support this language; reports may contain mistakes."
  supportedBy: "Officially supported by {models}."

# ── layout: menu bar, header, bottom bar, app-wide dialogs ────────────────
layout:
  _section: "layout"

# ── portfolios: the Portfolios page and its dialogs ───────────────────────
portfolios:
  _section: "portfolios"

# ── dashboard: overview cards, holdings, charts ───────────────────────────
dashboard:
  _section: "dashboard"

# ── transactions: transactions, import and export ─────────────────────────
transactions:
  _section: "transactions"

# ── reports: Analyze with AI and saved reports ────────────────────────────
reports:
  _section: "reports"

# ── assistant: chat sidebar, suggestions, company intel ──────────────────
assistant:
  _section: "assistant"

# ── metrics: dashboard cards and the metric library ───────────────────────
metrics:
  _section: "metrics"

# ── settings: every Settings page ─────────────────────────────────────────
settings:
  appearance:
    title: "Appearance"
    description: "How Portfolio looks on this device."
    theme: "Theme"
    themeDescription: "Dark or light colours, or follow the setting of your computer."
    themeDark: "Dark"
    themeLight: "Light"
    themeSystem: "Same as my computer"
    textSize: "Text size"
    textSizeDescription: "Make all text and buttons larger or smaller. Ctrl + and Ctrl - also work, Ctrl 0 resets."
    textSizes:
      small: "Small ({percent}%)"
      default: "Default ({percent}%)"
      large: "Large ({percent}%)"
      larger: "Larger ({percent}%)"
      largest: "Largest ({percent}%)"
      custom: "Custom ({percent}%)"

# ── setup: the first-run setup and the lock screen ────────────────────────
setup:
  _section: "setup"

# ── service: text the service sends (notifications, errors) ──────────────
service:
  assistant:
    untitledChat: "Chat Session"
  report:
    title: "{portfolio} - Weekly Briefing ({period})"
    summary:
      one: "Valuation {currency}{value} with {change}% cumulative return across {count} asset."
      other: "Valuation {currency}{value} with {change}% cumulative return across {count} assets."
    fallback:
      heading: "Automated Portfolio Briefing ({period})"
      overviewLabel: "Market Overview"
      overview: "Total portfolio valuation stands at {currency}{value} with {change}% overall return."
      note: "Note: Detailed LLM report model was temporarily unreachable ({error}). Technical metrics and ledger values remain verified."
  suggestions:
    dropped:
      invalid:
        one: "{count} suggestion was dropped: the answer was incomplete."
        other: "{count} suggestions were dropped: the answer was incomplete."
      notHeld:
        one: "{count} suggestion was dropped: it changes a holding the portfolio does not have."
        other: "{count} suggestions were dropped: it changes a holding the portfolio does not have."
      unknown:
        one: "{count} suggestion was dropped: the data providers do not know the symbol."
        other: "{count} suggestions were dropped: the data providers do not know the symbol."
      privateAsset:
        one: "{count} suggestion was dropped: it trades a private holding."
        other: "{count} suggestions were dropped: it trades a private holding."
      misread:
        one: "{count} suggestion was dropped: the assistant misread the current weight."
        other: "{count} suggestions were dropped: the assistant misread the current weight."
      noChange:
        one: "{count} suggestion was dropped: the weight change was too small or in the wrong direction."
        other: "{count} suggestions were dropped: the weight change was too small or in the wrong direction."
      duplicate:
        one: "{count} suggestion was dropped: it repeated a symbol."
        other: "{count} suggestions were dropped: it repeated a symbol."
      extra:
        one: "{count} suggestion was dropped: only {max} are kept."
        other: "{count} suggestions were dropped: only {max} are kept."
    dismissedLeftOut:
      one: "{count} dismissed suggestion was left out."
      other: "{count} dismissed suggestions were left out."
  dailyBrief:
    notificationTitle: "{portfolio}: daily brief"
    conversationTitle: "Daily brief {date}"
    question: "Daily brief for {date}: what happened in the last trading session?"
    fallback:
      sessionReturn: "Session return {change}"
      topGainer: "Top gainer: {instrument} {change}"
      topDecliner: "Top decliner: {instrument} {change}"
      transactions:
        one: "{count} transaction since {since}"
        other: "{count} transactions since {since}"
      note: "The assistant was not available, so this brief shows the numbers only."
  weeklyAnalysis:
    notificationTitle: "{portfolio}: weekly analysis"
    openReports: "Open Portfolio, Reports for the full analysis."
    fallback:
      heading: "Weekly analysis {period}"
      weekReturn: "Return of the week: {change}"
      topGainer: "Top gainer: {symbol} {change}"
      topDecliner: "Top decliner: {symbol} {change}"
  eventAlerts:
    notificationTitle: "Portfolio: upcoming events"
    heading: "Events of your holdings up to {date}"
    exDividend: "{symbol}: ex-dividend date {date}"
    earnings: "{symbol}: earnings report {date}"
    earningsBeforeOpen: "{symbol}: earnings report {date}, before the market opens"
    earningsAfterClose: "{symbol}: earnings report {date}, after the market closes"
    footer: "Open Portfolio for the income and events overview."
  testNotification:
    title: "Portfolio"
    gotify: "Test message from Portfolio. Daily briefs will arrive here."
    ntfy: "Test message from Portfolio. Daily briefs and weekly analyses will arrive here."
