# ── transactions: transactions, import and export ─────────────────────────
transactions:
  _section: "transactions"

# ── reports: Analyze with AI and saved reports ────────────────────────────
reports:
  _section: "reports"

# ── assistant: chat sidebar, suggestions, company intel ──────────────────
assistant:
  _section: "assistant"

# ── metrics: dashboard cards and the metric library ───────────────────────
