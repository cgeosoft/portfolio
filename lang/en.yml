# English interface text: the source for every other lang/<code>.yml.
# Format (modules/shared/src/i18n.ts): nested maps, two spaces per level,
# values in double quotes, {name} placeholders, plurals as one/other children.
# Each section below belongs to one area of the app; keep keys in their section.

# ── common: words many screens share ──────────────────────────────────────
common:
  add: "Add"
  all: "All"
  apply: "Apply"
  back: "Back"
  cancel: "Cancel"
  close: "Close"
  confirm: "Confirm"
  continue: "Continue"
  copy: "Copy"
  copied: "Copied"
  delete: "Delete"
  done: "Done"
  download: "Download"
  edit: "Edit"
  error: "Error"
  export: "Export"
  import: "Import"
  learnMore: "Learn more"
  loading: "Loading…"
  next: "Next"
  no: "No"
  none: "None"
  ok: "OK"
  optional: "Optional"
  refresh: "Refresh"
  remove: "Remove"
  reset: "Reset"
  retry: "Retry"
  save: "Save"
  saving: "Saving…"
  search: "Search"
  unknown: "Unknown"
  yes: "Yes"

# ── language: the language picker ─────────────────────────────────────────
language:
  label: "Language"
  description: "Language of the interface, the AI reports, the assistant and the notifications. Portfolio reloads to apply it."
  tierShort: "Tier {tier}"
  tier1: "Every major AI model family supports this language."
  tier2: "Most AI model families support this language."
  tier3: "Some AI model families support this language; reports may read less naturally."
  tier4: "Few AI model families support this language; reports may contain mistakes."
  supportedBy: "Officially supported by {models}."

