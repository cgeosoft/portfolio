    defs:
      totalGain:
        title: "Общая прибыль с начала"
        category: "Доходность"
        short: "Чистый экономический результат всего портфеля за всё время с момента создания."
        full: "Эта метрика отражает полный чистый результат вашего капитала. Она учитывает не только текущую нереализованную бумажную прибыль, но и все изменения цен активов, реализованную прибыль от продаж, выплаты дивидендов и процентов, за вычетом уплаченных за всё время комиссий."
        formula: "Общая прибыль = (Вложенная стоимость - Себестоимость) + Реализованный PnL + Дивиденды + Проценты - Комиссии брокера"
        formulaDescription: "Доходность % = (Общая прибыль с начала ÷ Всего вложенный капитал) × 100"
        components:
          unrealized:
            label: "Нереализованная прибыль / убыток"
            description: "Бумажная прибыль или убыток по открытым позициям (Вложенная стоимость − Себестоимость)."
          realized:
            label: "Закрытый / реализованный PnL"
            description: "Чистая прибыль или убыток, зафиксированные при продаже активов."
          income:
            label: "Дивиденды и проценты"
            description: "Сумма денежных выплат и фиксированного дохода, зачисленных в портфель."
          fees:
            label: "Комиссии за операции"
            description: "Все брокерские и биржевые комиссии, удержанные за всё время."
        takeaways:
          alpha: "Реальная экономическая альфа: оценивает весь созданный капитал, а не только изменение цены тикера."
          cashFlow: "С учётом денежного потока: реинвестированные или полученные дивиденды и проценты полностью входят в процент доходности."
          netOfFees: "За вычетом комиссий: брокерские комиссии и торговые издержки вычитаются, чтобы показать реальную чистую доходность."
      valuation:
        title: "Стоимость портфеля"
        category: "Оценка"
        short: "Общая ликвидационная стоимость портфеля по текущим котировкам."
        full: "Стоимость портфеля показывает точную общую ликвидную стоимость всего инвестиционного портфеля прямо сейчас. Она складывается из текущей рыночной стоимости всех открытых бумаг (акций, ETF, криптовалют, паевых фондов) и неинвестированного денежного резерва."
        formula: "Стоимость портфеля = Общая рыночная стоимость позиций + Денежный резерв"
        formulaDescription: "Стоимость позиций рассчитывается умножением количества по каждой открытой позиции на её последнюю рыночную котировку."
        components:
          holdings:
            label: "Стоимость вложенных позиций"
            description: "Суммарная текущая стоимость всех открытых акций, ETF, криптовалют и других активов."
          cash:
            label: "Неинвестированный денежный резерв"
            description: "Ликвидный денежный запас для новых покупок или как защитный резерв."
          costBasis:
            label: "Себестоимость позиций"
            description: "Весь капитал, потраченный на покупку текущих открытых позиций."
        takeaways:
          liquidWorth: "Ликвидная стоимость: сколько принёс бы портфель до налогов, если продать все позиции сразу по текущим ценам спроса."
          multiAsset: "Учёт всех активов: объединяет позиции в разных валютах, денежные остатки и дробные доли."
          cashDrag: "С учётом денежного балласта: корректно учитывает ликвидный резерв наряду с вложенными активами."
      todayReturn:
        title: "Доходность за сегодня"
        category: "Дневная доходность"
        short: "Изменение стоимости за сессию относительно предыдущего закрытия."
        full: "Доходность за сегодня показывает денежное и процентное изменение открытых позиций в текущей торговой сессии. Текущие котировки сравниваются с официальными ценами закрытия предыдущего дня по каждой позиции."
        formula: "Доходность за сегодня ($) = Сумма [ (Текущая цена - Цена предыдущего закрытия) × Количество ]"
        formulaDescription: "Доходность за сегодня (%) = (Доходность за сегодня $ ÷ Суммарная стоимость на закрытии предыдущей сессии) × 100"
        components:
          currencyDelta:
            label: "Изменение за 24 ч в валюте"
            description: "Абсолютная прибыль или убыток в текущей сессии."
          percentChange:
            label: "Изменение за 24 ч в %"
            description: "Доходность в процентах относительно стоимости на вчерашнем закрытии."
          topWinner:
            label: "Лидер сессии"
            description: "Самый доходный актив вашего портфеля в этой сессии."
        takeaways:
          volatility: "Волатильность сессии: показывает, как макрособытия, отчётность или движения рынка повлияли на ваши позиции сегодня."
          excludesCash: "Без денежных средств: дневную доходность дают только бумаги, зависящие от цены; у денежного резерва дневная волатильность нулевая."
          realTime: "Обновление в реальном времени: пересчитывается по мере поступления новых котировок в торговые часы."
      realizedIncome:
        title: "Реализовано и доход"
        category: "Доход и доходность"
        short: "Накопленная зафиксированная прибыль от продаж, дивидендов и процентов."
        full: "Нереализованная бумажная прибыль растёт и падает вместе с настроением рынка, а «Реализовано и доход» отслеживает окончательно зафиксированный капитал. Метрика суммирует прибыль от проданных бумаг и регулярный доход от дивидендов и процентов."
        formula: "Реализовано и доход = PnL закрытых продаж + Всего полученных дивидендов + Полученные фиксированные проценты"
        formulaDescription: "PnL закрытой продажи рассчитывается по каждой операции SELL методом FIFO / средней себестоимости."
        components:
          sells:
            label: "Чистая реализованная прибыль от продаж"
            description: "Зафиксированный прирост капитала от исполненных продаж."
          dividends:
            label: "Полученные дивиденды"
            description: "Денежные выплаты, которые позиции портфеля перечислили вам напрямую."
          interest:
            label: "Фиксированные проценты / доходность"
            description: "Доход от процентов на денежные средства, купонов облигаций или кредитования."
        takeaways:
          permanent: "Постоянный капитал: зафиксированную прибыль не отменит будущее падение рынка."
          income: "Генерация дохода: наглядно показывает пассивный доход от дивидендных активов."
          tax: "Налоги и учёт: помогает отслеживать налогооблагаемые события и дивиденды за год."
      cashReserves:
        title: "Денежный резерв"
        category: "Ликвидность"
        short: "Нераспределённые свободные деньги для стратегической ребалансировки или подстраховки."
        full: "Денежный резерв показывает неинвестированные деньги в вашем портфеле. Эта ликвидность служит «сухим порохом» для покупок на просадках рынка, подушкой безопасности или ждёт реинвестирования дивидендов."
        formula: "Денежный резерв = Всего пополнений - Всего покупок + Всего продаж + Дивиденды - Выводы - Комиссии"
        formulaDescription: "Доля денежных средств (%) = (Денежный резерв ÷ Общая стоимость портфеля) × 100"
        components:
          balance:
            label: "Текущий остаток"
            description: "Свободные деньги в базовой валюте портфеля."
          share:
            label: "Доля в распределении"
            description: "Процент общей стоимости портфеля, который хранится в денежных средствах."
            value: "{percent}% портфеля"
        takeaways:
          liquidity: "Ликвидность для возможностей: позволяет сразу покупать на просадках без продажи имеющихся активов."
          risk: "Снижение риска: смягчает общую волатильность портфеля на медвежьем рынке."
      capitalInjected:
        title: "Внесённый капитал"
        category: "Основной капитал"
        short: "Общая сумма основного капитала, внесённого в портфель."
        full: "Внесённый капитал отслеживает все ваши взносы (пополнения) в журнал портфеля. Он служит базовым знаменателем для расчёта реальной рентабельности вложенного капитала (ROIC)."
        formula: "Внесённый капитал = Сумма пополнений - Сумма выводов капитала"
        formulaDescription: "Рассчитывается по всем операциям DEPOSIT и WITHDRAWAL в вашем портфеле."
        components:
          deposited:
            label: "Всего внесено капитала"
            description: "Сумма всех внешних пополнений портфеля за всё время."
        takeaways:
          benchmark: "Ориентир по основному капиталу: отделяет ваши внешние взносы от роста за счёт рынка."
          returnBase: "База доходности: служит знаменателем для точных моделей доходности, взвешенной по деньгам и по времени."
      dividends:
        title: "Всего дивидендов"
        category: "Выплаты"
        short: "Все денежные дивиденды, полученные от акций и фондов за всё время."
        full: "«Всего дивидендов» показывает общую сумму денежных выплат за всё время, перечисленных в ваш портфель дивидендными акциями, ETF и REIT. Их можно держать в денежных средствах или вложить в новые позиции."
        formula: "Всего дивидендов = Сумма всех операций DIVIDEND, зачисленных на счёт"
        formulaDescription: "Не учитывает рост цены и включает только распределение прибыли компаний."
        components:
          cumulative:
            label: "Накопленные дивиденды"
            description: "Общая сумма дивидендов, зачисленных по всем активам портфеля."
        takeaways:
          cashFlow: "Пассивный денежный поток: показывает реальную денежную отдачу ваших доходных вложений."
          compounding: "Топливо для сложного процента: дивиденды можно систематически реинвестировать, чтобы ускорить рост капитала."
      topPerformer:
        title: "Лидер сессии"
        category: "Лидер сессии"
        short: "Открытый актив с наибольшим процентным ростом в текущей торговой сессии."
        full: "Определяет самый сильный актив портфеля по внутридневному процентному росту от предыдущего официального закрытия. Помогает увидеть драйверы импульса и лидеров среди ваших позиций."
        formula: "Лидер = max( (Текущая котировка - Предыдущее закрытие) ÷ Предыдущее закрытие ) по всем открытым позициям"
        formulaDescription: "Оценивается по всем открытым активам портфеля, кроме денежных средств."
        components:
          topAsset:
            label: "Лучший актив"
            description: "Тикер актива и его внутридневная доходность в процентах."
            none: "Нет открытых позиций в акциях"
        takeaways:
          momentum: "Отслеживание импульса: сразу видно самый сильный рост за сегодня."
          attribution: "Атрибуция: понятно, какая позиция определяет результат портфеля сегодня."

