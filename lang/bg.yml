    components: "Съставни части и текущи стойности"
    insights: "Основни изводи"
    footerHint: "Щракнете върху раздел по-горе, за да смените показателя"
    closeGuide: "Затваряне на ръководството"
    live:
      sinceInception: "Доходност: {percent} от началото"
      invested: "Вложено: {amount}"
      costBasis: "Себестойност: {amount}"
      dayChange: "Промяна 24 ч: {arrow} {percent}"
      sellsAndDividends: "Продажби: {sells} | Дивиденти: {dividends}"
      cashShare: "{percent}% от целия портфейл"
      netDeposits: "Общо нетни депозити"
      cashDistributions: "Парични изплащания за целия период"
      sessionChange: "+{percent}% за сесията"
      noEquities: "Няма отворени позиции в акции"
    defs:
      totalGain:
        title: "Обща печалба от началото"
        category: "Представяне"
        short: "Нетният икономически резултат на целия портфейл от създаването му досега."
        full: "Този показател обхваща пълния нетен резултат на капитала ви. Той не гледа само текущата нереализирана хартиена печалба, а обединява всички промени в цените на активите, реализираните печалби от продажби, изплатените дивиденти и лихви и изважда платените през цялото време такси."
        formula: "Обща печалба = (Вложена стойност - Себестойност) + Реализиран PnL + Дивиденти + Лихви - Брокерски такси"
        formulaDescription: "Доходност % = (Обща печалба от началото ÷ Общо вложен капитал) × 100"
        components:
          unrealized:
            label: "Нереализирана печалба / загуба"
            description: "Хартиена печалба или загуба по отворените позиции (Вложена стойност − Себестойност)."
          realized:
            label: "Закрит / реализиран PnL"
            description: "Нетна печалба или загуба, фиксирана при продажбата на активи."
          income:
            label: "Дивиденти и лихви"
            description: "Сумата на паричните изплащания и фиксирания доход, постъпили в портфейла."
          fees:
            label: "Такси за транзакции"
            description: "Всички брокерски комисиони и такси за поръчки, удържани през цялото време."
        takeaways:
          alpha: "Истинска икономическа алфа: оценява цялото създадено богатство, а не само промяната в цената на тикера."
          cashFlow: "С паричния поток: реинвестираните или получените дивиденти и лихви изцяло влизат в процента на доходност."
          netOfFees: "След такси: брокерските комисиони и разходите по сделките се изваждат, за да се покаже реалистичната нетна доходност."
      valuation:
        title: "Стойност на портфейла"
        category: "Оценка"
        short: "Общата ликвидационна стойност на портфейла по текущите котировки."
        full: "Стойността на портфейла показва точната обща ликвидна стойност на целия ви инвестиционен портфейл в момента. Тя обединява текущата пазарна стойност на всички отворени ценни книжа (акции, ETF, криптовалути, взаимни фондове) с неинвестирания паричен резерв."
        formula: "Стойност на портфейла = Обща пазарна стойност на позициите + Паричен резерв"
        formulaDescription: "Стойността на позициите се изчислява, като броят на всяка отворена позиция се умножи по последната ѝ пазарна котировка."
        components:
          holdings:
            label: "Стойност на вложените позиции"
            description: "Общата текуща стойност на всички отворени акции, ETF, криптовалути и други активи."
          cash:
            label: "Неинвестиран паричен резерв"
            description: "Ликвиден паричен буфер за нови покупки или като сигурен резерв."
          costBasis:
            label: "Себестойност на позициите"
            description: "Целият капитал, вложен в придобиването на текущите отворени позиции."
        takeaways:
          liquidWorth: "Ликвидна стойност: колко би донесъл портфейлът преди данъци, ако всички позиции се продадат веднага по текущите цени „купува“."
          multiAsset: "Обединяване на активите: обединява позиции в различни валути, парични салда и дробни дялове."
          cashDrag: "С ефекта на парите: отчита точно ликвидния резерв редом с вложените активи."
      todayReturn:
        title: "Доходност днес"
        category: "Дневна доходност"
        short: "Промяната в стойността за сесията спрямо предишното затваряне."
        full: "Доходността днес измерва паричната и процентната промяна на отворените позиции в текущата търговска сесия. Тя сравнява текущите котировки с официалните цени на затваряне от предишния ден за всяка позиция."
        formula: "Доходност днес ($) = Сума от [ (Текуща цена - Цена при предишно затваряне) × Брой ]"
        formulaDescription: "Доходност днес (%) = (Доходност днес $ ÷ Обща стойност при затварянето на предишната сесия) × 100"
        components:
          currencyDelta:
            label: "Промяна за 24 ч във валута"
            description: "Абсолютната печалба или загуба в текущата сесия."
          percentChange:
            label: "Промяна за 24 ч в %"
            description: "Процентната доходност спрямо стойността при вчерашното затваряне."
          topWinner:
            label: "Лидер на сесията"
            description: "Активът с най-добро представяне в портфейла ви за тази сесия."
        takeaways:
          volatility: "Волатилност на сесията: показва как макрособитията, финансовите резултати или пазарните движения са повлияли на позициите ви днес."
          excludesCash: "Без парите: само ценните книжа, зависещи от цената, движат дневната доходност; паричният резерв има нулева дневна волатилност."
          realTime: "Обновяване в реално време: преизчислява се при постъпване на нови котировки в търговските часове."
      realizedIncome:
        title: "Реализирано и доход"
        category: "Доход и доходност"
        short: "Натрупаните фиксирани парични печалби от продажби, дивиденти и лихви."
        full: "Нереализираните хартиени печалби растат и падат с настроенията на пазара, а „Реализирано и доход“ проследява окончателно фиксираното богатство. Показателят сумира всички печалби от продадени ценни книжа и редовния доход от дивиденти и лихви."
        formula: "Реализирано и доход = PnL от закрити продажби + Общо получени дивиденти + Получени фиксирани лихви"
        formulaDescription: "PnL от закрита продажба се изчислява при всяка транзакция SELL по метода FIFO / средна себестойност."
        components:
          sells:
            label: "Нетна реализирана печалба от продажби"
            description: "Фиксирани капиталови печалби от изпълнени продажби."
          dividends:
            label: "Получени дивиденти"
            description: "Парични плащания, изплатени директно на вас от позициите в портфейла."
          interest:
            label: "Фиксирани лихви / доходност"
            description: "Доход от лихви върху парични средства, купони на облигации или кредитиране."
        takeaways:
          permanent: "Трайно богатство: фиксираните печалби не могат да бъдат заличени от бъдещи спадове на пазара."
          income: "Генериране на доход: ясно показва пасивния доход от активите, изплащащи дивиденти."
          tax: "Данъци и отчетност: полезно за проследяване на облагаемите събития и дивидентите за годината."
      cashReserves:
        title: "Паричен резерв"
        category: "Ликвидност"
        short: "Неразпределени свободни пари за стратегическо ребалансиране или сигурност."
        full: "Паричният резерв представлява неинвестираните пари в портфейла ви. Тази ликвидност служи като „сух барут“ за покупки при спадове на пазара, като спешен буфер или в очакване на реинвестиране на дивиденти."
        formula: "Паричен резерв = Общо депозити - Общо покупки + Общо продажби + Дивиденти - Тегления - Такси"
        formulaDescription: "Дял на паричните средства (%) = (Паричен резерв ÷ Обща стойност на портфейла) × 100"
        components:
          balance:
            label: "Текущо салдо"
            description: "Свободни пари в базовата валута на портфейла."
          share:
            label: "Дял в разпределението"
            description: "Процентът от общата стойност на портфейла, държан в парични средства."
            value: "{percent}% от портфейла"
        takeaways:
          liquidity: "Ликвидност за възможности: позволява незабавни покупки при спадове без продажба на съществуващи активи."
          risk: "Намаляване на риска: смекчава общата волатилност на портфейла при мечи пазар."
      capitalInjected:
        title: "Вложен капитал"
        category: "Главница"
        short: "Общата сума на главницата, внесена в портфейла."
        full: "Вложеният капитал проследява всичките ви вноски (депозити) в дневника на портфейла. Той е базовият знаменател за изчисляване на реалната възвръщаемост на вложения капитал (ROIC)."
        formula: "Вложен капитал = Сума на депозитите - Сума на тегленията на капитал"
        formulaDescription: "Изчислява се от всички транзакции DEPOSIT и WITHDRAWAL в портфейла ви."
        components:
          deposited:
            label: "Общо внесен капитал"
            description: "Сумата на всички външни депозити в портфейла за целия период."
        takeaways:
          benchmark: "Ориентир за главницата: отделя външните ви вноски от органичния пазарен растеж."
          returnBase: "База за доходността: служи за знаменател в точните модели на доходност, претеглена по пари и по време."
      dividends:
        title: "Общо дивиденти"
        category: "Изплащания"
        short: "Всички парични дивиденти, получени от акции и фондове за целия период."
        full: "„Общо дивиденти“ показва общата сума на паричните изплащания за целия период, получени в портфейла ви от акции, ETF и REIT, които плащат дивиденти. Те могат да се държат като парични средства или да се вложат в нови позиции."
        formula: "Общо дивиденти = Сума на всички транзакции DIVIDEND, заверени в сметката"
        formulaDescription: "Не включва поскъпването и обхваща само разпределената печалба на компаниите."
        components:
          cumulative:
            label: "Натрупани дивиденти"
            description: "Общата сума на дивидентите, заверени по всички активи в портфейла."
        takeaways:
          cashFlow: "Пасивен паричен поток: измерва реалната парична възвръщаемост на доходоносните ви инвестиции."
          compounding: "Гориво за сложната лихва: дивидентите могат да се реинвестират систематично, за да ускорят растежа."
      topPerformer:
        title: "Лидер на сесията"
        category: "Лидер на сесията"
        short: "Отвореният актив с най-голям процентен ръст в текущата търговска сесия."
        full: "Открива най-силния актив в портфейла ви по вътрешнодневния процентен ръст спрямо предишното официално затваряне. Помага да откриете двигателите на импулса и лидерите сред позициите си."
        formula: "Лидер = max( (Текуща котировка - Предишно затваряне) ÷ Предишно затваряне ) за всички отворени позиции"
        formulaDescription: "Оценява се за всички отворени активи в портфейла без паричните средства."
        components:
          topAsset:
            label: "Най-добър актив"
            description: "Тикерът на актива и вътрешнодневната му доходност в проценти."
            none: "Няма отворени позиции в акции"
        takeaways:
          momentum: "Проследяване на импулса: веднага виждате най-силния ръст за деня."
          attribution: "Атрибуция: разбирате коя позиция носи представянето на портфейла днес."

