<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- App Brand Cyber Pink Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee84aa" />
      <stop offset="60%" stop-color="#DD3C73" />
      <stop offset="100%" stop-color="#b32053" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DD3C73" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#DD3C73" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#DD3C73" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#ambientGlow)" />

  <!-- Base App Tile (Squircle) with Pink Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#bgGrad)" stroke="#DD3C73" stroke-width="4" />

  <!-- Central Lucide Trending Up (trending-up) Scaled to 512 viewBox -->
  <g transform="translate(76, 76) scale(15)"
     fill="none"
     stroke="url(#accent)"
     stroke-width="2.2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
    <polyline points="16 7 22 7 22 13" />
  </g>
</svg>
