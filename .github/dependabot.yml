version: 2
updates:
  # Workspace packages share the root bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 2.0.5 makes Bun the default main process and refuses the build.cottontail
      # config. Upgrade by hand together with the config change.
      - dependency-name: electrobun

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
