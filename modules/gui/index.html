<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Personal Investment Tracker" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('portfolio_theme') || 'dark';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            var metaScheme = document.querySelector('meta[name="color-scheme"]');
            if (metaScheme) metaScheme.content = 'light';
            var metaColor = document.querySelector('meta[name="theme-color"]');
            if (metaColor) metaColor.content = '#f8fafc';
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            var metaScheme = document.querySelector('meta[name="color-scheme"]');
            if (metaScheme) metaScheme.content = 'dark';
            var metaColor = document.querySelector('meta[name="theme-color"]');
            if (metaColor) metaColor.content = '#090b10';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Boot loader: a static copy of the desktop shell's starting page (modules/desktop/src/bun/pages.ts),
         painted before the scripts load so the hand-off from the shell shows no blank page.
         hideBootLoader() in src/bootLoader.ts removes it once the first screen has its data. -->
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center;
        background: #07090e; color: #e2e8f0; -webkit-user-select: none; user-select: none;
        font: 14px/1.5 "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background-image: radial-gradient(circle 420px at 50% 25%, rgba(79, 70, 229, 0.22), transparent 70%),
          radial-gradient(circle 340px at 25% 75%, rgba(147, 51, 234, 0.12), transparent 70%),
          radial-gradient(circle 300px at 85% 85%, rgba(6, 182, 212, 0.08), transparent 70%);
        transition: opacity 0.3s ease-out; }
      #boot-loader.hide { opacity: 0; pointer-events: none; }
      #boot-loader main { display: flex; flex-direction: column; align-items: center; width: min(100%, 640px); padding: 24px; }
      #boot-loader .tile { width: 56px; height: 56px; padding: 1px; border-radius: 16px; box-shadow: 0 20px 40px -12px rgba(221, 60, 115, 0.35);
        background: linear-gradient(to top right, #DD3C73, #a855f7, #22d3ee); }
      #boot-loader .tile div { width: 100%; height: 100%; border-radius: 15px; background: #020617; display: flex; align-items: center; justify-content: center; }
      #boot-loader .tile svg { width: 28px; height: 28px; color: #e65f8e; animation: boot-breathe 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes boot-breathe { 50% { opacity: 0.45; } }
      #boot-loader h1 { margin: 14px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2;
        background: linear-gradient(to right, #fff, #e2e8f0, #f5abc5); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #boot-loader .tagline { margin: 4px 0 0; font: 500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e65f8e; }
      #boot-loader .pill { display: flex; align-items: center; gap: 8px; margin-top: 28px; padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 500;
        color: #94a3b8; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(30, 41, 59, 0.8); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6); }
      #boot-loader .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(230, 95, 142, 0.25); border-top-color: #e65f8e;
        animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot-loader .hint { margin: 14px 0 0; font-size: 12px; color: #475569; }
    </style>
    <title>Portfolio</title>
  </head>
  <body class="bg-[var(--app-bg)] text-[var(--text-main)] font-sans antialiased selection:bg-accent-500/30 selection:text-accent-200 overflow-hidden">
    <div id="boot-loader" aria-busy="true">
      <main>
        <div class="tile"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg></div></div>
        <h1>Portfolio</h1>
        <p class="tagline">Personal Investment Tracker</p>
        <div class="pill"><span class="spin"></span><span>Starting up</span></div>
        <p class="hint">Loading your portfolio.</p>
      </main>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
